 if(busy)return; var q=(qEl.value||'').trim(); if(!q){qEl.focus();return;}
 busy=true; document.getElementById('go').disabled=true; out.style.display='none';
 setStep(0);
 var task=match(q),i=0;
 var ai=await aiPlan(q);
 if(ai){ setStep(4); out.innerHTML=renderAI(q,ai); out.style.display='block';
   out.scrollIntoView({behavior:'smooth',block:'start'}); busy=false;
   document.getElementById('go').disabled=false; return; }
 var timer=setInterval(function(){
   i++;
   if(i<4){setStep(i);return;}
   clearInterval(timer);setStep(4);
   out.innerHTML=render(q,0,task);out.style.display='block';
   out.scrollIntoView({behavior:'smooth',block:'start'});
   busy=false;document.getElementById('go').disabled=false;
 },520);
}
document.getElementById('go').addEventListener('click',go);
qEl.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter')go();});
</script>
