<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 创作工坊 · 一句话生成配音视频/有声书 · 星籁 AI 导航</title>
<meta name="description" content="输入一句话，AI 自动完成文案创作、AI 配音、配乐混音、成片导出：支持 MP3 有声书与 MP4 口播视频，全程自动，可直接下载。">

<style>
:root{--bg:#070a10;--panel:#0f1622;--line:rgba(148,163,184,.14);--txt:#e8eef8;--txt2:#9fb0c7;--txt3:#6b7c94;--cyan:#38bdf8;--violet:#8b5cf6;--lime:#34d399;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;font:15px/1.7 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;color:var(--txt);background:radial-gradient(900px 480px at 78% -10%,rgba(56,189,248,.10),transparent 60%),radial-gradient(700px 400px at 10% 5%,rgba(139,92,246,.10),transparent 60%),linear-gradient(180deg,#070a10,#0a0f18);background-attachment:fixed;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:0 22px 70px}
.top{position:sticky;top:0;z-index:10;backdrop-filter:blur(18px);background:rgba(7,10,16,.78);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;height:60px;display:flex;align-items:center;gap:14px;padding:0 22px}
.brand{font-weight:800;font-size:15px;display:flex;align-items:center;gap:9px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#38bdf8,#8b5cf6);display:grid;place-items:center;font-size:15px;color:#04121c;font-weight:900}
nav{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
nav a{color:var(--txt2);font-size:13.5px;padding:7px 11px;border-radius:9px}
nav a:hover{color:#fff;background:rgba(148,163,184,.1)}
.hero{padding:50px 0 8px;text-align:center}
.eyebrow{display:inline-block;font-size:11.5px;letter-spacing:.2em;color:#7dd3fc;border:1px solid rgba(56,189,248,.28);background:rgba(56,189,248,.07);padding:6px 14px;border-radius:999px;margin-bottom:16px}
h1{font-size:clamp(28px,4vw,42px);margin:0 0 12px;letter-spacing:-.02em;line-height:1.22}
h1 span{background:linear-gradient(120deg,#7dd3fc,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--txt2);max-width:620px;margin:0 auto 24px;font-size:15.5px}
.box,.card{background:linear-gradient(180deg,rgba(20,28,43,.9),rgba(12,18,28,.9));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 24px 60px -24px rgba(2,8,20,.9)}
textarea{width:100%;min-height:96px;resize:vertical;background:rgba(9,14,24,.9);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-size:15px;padding:14px;outline:none;font-family:inherit}
textarea:focus{border-color:rgba(56,189,248,.5);box-shadow:0 0 0 4px rgba(56,189,248,.1)}
.row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{background:linear-gradient(135deg,#38bdf8,#6366f1);color:#04121c;font-weight:800;border:0;border-radius:12px;padding:12px 24px;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:progress}
.seg{display:flex;gap:6px;background:rgba(9,14,24,.8);border:1px solid var(--line);border-radius:11px;padding:4px}
.seg button{background:transparent;border:0;color:var(--txt2);padding:7px 14px;border-radius:8px;font-size:13.5px;cursor:pointer}
.seg button.on{background:rgba(56,189,248,.16);color:#dff3ff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chips button{background:rgba(15,22,34,.8);border:1px solid var(--line);color:var(--txt2);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.chips button:hover{border-color:rgba(56,189,248,.45);color:#dff3ff}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.step{border:1px solid var(--line);border-radius:12px;background:rgba(15,22,34,.6);padding:10px 8px;text-align:center;font-size:12.5px;color:var(--txt3);transition:.2s}
.step.on{color:#dff3ff;border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
.step.done{color:#86efac;border-color:rgba(52,211,153,.35)}
.timer{margin-top:14px;color:var(--txt3);font-size:13px}
.out{margin-top:18px;display:none}
.card h3{margin:0 0 10px;font-size:16.5px;display:flex;align-items:center;gap:8px}
.card h3:before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,#38bdf8,#8b5cf6)}
audio,video{width:100%;margin-top:10px;border-radius:12px;background:#0a1120}
.script{white-space:pre-wrap;color:var(--txt2);font-size:14.5px;line-height:1.85;background:rgba(9,14,24,.7);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--txt3)}
.meta span{border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.acts a{background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);color:#cfe9ff;border-radius:11px;padding:10px 16px;font-size:13.5px;font-weight:700}
.acts button{background:rgba(148,163,184,.1);border:1px solid var(--line);color:var(--txt2);border-radius:11px;padding:10px 16px;font-size:13.5px;cursor:pointer}
.log{margin-top:10px;font-size:12.5px;color:var(--txt3);line-height:1.9}
.log b{color:#86efac;font-weight:600}
.err{color:#fca5a5;font-size:14px}
.foot{margin-top:26px;text-align:center;color:var(--txt3);font-size:12.5px}
footer{border-top:1px solid var(--line);margin-top:44px;padding:24px 22px;text-align:center;color:var(--txt3);font-size:12.5px}
@media(max-width:760px){.wrap{padding:0 16px 54px}.top-in{padding:0 14px}nav a{font-size:12.5px;padding:6px 8px}h1{font-size:26px}.steps{grid-template-columns:repeat(2,1fr)}.lead{padding:0 8px}}
</style></head><body>
<div class="top"><div class="top-in"><a class="brand" href="/ai-nav/"><span class="logo">✦</span>星籁 AI 导航</a>
<nav><a href="/ai-nav/">AI 导航</a><a href="/ai-nav/studio/">AI 创作工坊</a><a href="/ai-nav/travel/">出行导航</a><a href="/ai-nav/select-ai/">智能选型</a><a href="/ai-nav/radar/">工具雷达</a></nav></div></div>
<div class="wrap">
<div class="hero"><div class="eyebrow">CREATE · TTS · MUSIC · RENDER</div>
<h1>一句话，<span>生成成品音视频</span></h1>
<p class="lead">文案 → AI 配音 → 配乐混音 → 成片导出，全自动闭环。支持 MP3 有声书 / MP4 口播视频，生成完直接下载。</p></div>
<div class="box">
<textarea id="q" placeholder="例如：做一段 30 秒亲子出游 vlog 口播，女声温柔，轻音乐，导出 MP3"></textarea>
<div class="row">
<div class="seg" id="seg"><button data-m="auto" class="on">自动判断</button><button data-m="audio">音频 MP3</button><button data-m="video">文字视频</button><button data-m="footage">实拍成片</button></div>
<select id="dur" style="width:auto;padding:9px 12px"><option value="30">30 秒</option><option value="60" selected>60 秒</option><option value="120">2 分钟</option><option value="180">3 分钟</option><option value="300">5 分钟</option></select>
<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--txt3)">人声 <input id="voiceVol" type="range" min="0" max="150" value="100" style="width:90px"> 配乐 <input id="bgmVol" type="range" min="0" max="150" value="90" style="width:90px"><label style="display:flex;align-items:center;gap:6px"><input id="unlimited" type="checkbox" style="width:auto"> 站长无限模式</label></div><button class="btn" id="go">开始生成</button>
<span style="color:var(--txt3);font-size:12.5px" id="quota"></span>
</div>
<div class="chips" id="chips"></div>
<div class="steps" id="steps"><div class="step" data-s="0">① 规划文案</div><div class="step" data-s="1">② AI 配音</div><div class="step" data-s="2">③ 配乐混音</div><div class="step" data-s="3">④ 校验导出</div></div>
<div class="timer" id="timer"></div>
</div>
<div class="out" id="out"></div>
<p class="foot">生成结果保留 24 小时 · 价格与功能以官方为准 · 每日 3 次免费额度</p>
</div>
<footer>© 2026 星籁 AI 工具导航 · xinglaiai.com 版权所有 · 未经许可禁止镜像/采集/商业转载</footer>
<script>
var mode='auto', busy=false;
var samples=[
 '做一段30秒亲子出游vlog口播，女声温柔，轻音乐，导出MP3',
 '把"北京秋天的城市宣传片"写成口播文案，男声沉稳，科技感配乐，输出MP4',
 '写一篇5分钟有声书文案：给孩子的睡前故事，女声温柔，舒缓环境音乐',
 '做一条15秒早安问候语音，女声活泼，轻音乐'
];
document.getElementById('chips').innerHTML=samples.map(function(s){return '<button>'+s+'</button>'}).join('');
document.getElementById('chips').addEventListener('click',function(e){if(e.target.tagName==='BUTTON'){document.getElementById('q').value=e.target.textContent;}});
document.getElementById('seg').addEventListener('click',function(e){if(e.target.tagName!=='BUTTON')return;mode=e.target.dataset.m;[].forEach.call(this.children,function(b){b.className=b===e.target?'on':''});});
function setStep(n){var s=document.querySelectorAll('#steps .step');for(var i=0;i<s.length;i++){s[i].className='step'+(i<n?' done':(i===n?' on':''));}}
function quota(){
 var k='studio_quota_'+new Date().toISOString().slice(0,10);
 var n=parseInt(localStorage.getItem(k)||'0',10);
 var unlim=localStorage.getItem('studio_unlimited')==='1';
 document.getElementById('quota').textContent=unlim?'无限模式（不限次数）':('今日剩余 '+Math.max(0,20-n)+' 次');
 return {k:k,n:n,unlim:unlim};
}
function tick(t0){var iv=setInterval(function(){document.getElementById('timer').textContent='已用时 '+((Date.now()-t0)/1000).toFixed(0)+' 秒，AI 正在工作…';},500);return iv;}
function render(d){
 var h='<div class="card"><h3>✅ 生成完成</h3>';
 h+='<div class="meta"><span>标题：'+d.title+'</span><span>音色：'+(d.voice||'-')+'</span><span>配乐：'+(d.bgm||'-')+'</span><span>时长：'+d.duration+' 秒</span><span>迭代：'+(d.iterations||1)+' 轮</span></div>';
 if(d.video_url){h+='<video controls src="'+d.video_url+'"></video>';}
 h+='<audio controls src="'+d.audio_url+'"></audio>';
 h+='<div class="acts">';
 if(d.video_url){h+='<a href="'+d.video_url+'" download>⬇ 下载 MP4</a>';}
 h+=(d.engine==='pixabay-footage')?('<span class="hint" style="align-self:center">实拍素材成片 · '+ (d.scenes||0) +' 个镜头 · 素材来自 Pixabay（可商用）</span>'):'';
 h+='<a href="'+d.audio_url+'" download>⬇ 下载 MP3</a><button onclick="copyScript()">📋 复制文案</button></div>';
 h+='<h3 style="margin-top:20px">口播文案（可直接修改，改完点下面按钮重新生成）</h3><textarea id="scriptEdit" style="min-height:180px;font-size:14px">'+d.script.replace(/</g,'&lt;')+'</textarea>';
 if(d.logs&&d.logs.length){h+='<div class="log">';d.logs.forEach(function(l){h+='<div><b>'+(l.agent||'')+'</b> '+(l.ok?'通过':'重试')+(l.round?(' · 第'+(l.round)+'轮'):'')+(l.size_kb?(' · '+l.size_kb+'KB'):'')+(l.duration?(' · '+l.duration+'s'):'')+'</div>';});h+='</div>';}
 h+='<div class="row"><button class="btn" id="regen">用改后文案重新生成</button><button class="btn" id="aiPolish" style="background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.5);color:#e9d5ff">✨ AI 优化文案</button><span class="hint">改文案后时长会按新文案重新计算</span></div></div>';
 return h;
}
function copyScript(){var t=document.getElementById('scriptBox').innerText;navigator.clipboard&&navigator.clipboard.writeText(t);}
async function doGen(body){
 busy=true;document.getElementById('go').disabled=true;
 document.getElementById('out').style.display='none';
 setStep(0);
 try{
  var r=await fetch('/ai-nav/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  var d=await r.json();
  if(!d.ok){document.getElementById('out').style.display='block';document.getElementById('out').innerHTML='<div class="card"><h3>生成失败</h3><p class="err">'+(d.hint||d.error||'未知错误')+'</p></div>';}
  else{ setStep(4);document.getElementById('timer').textContent='✅ 完成，用时 '+d.elapsed+' 秒'; document.getElementById('out').style.display='block';document.getElementById('out').innerHTML=render(d);lastData=d;document.getElementById('out').scrollIntoView({behavior:'smooth',block:'start'});}
 }catch(e){document.getElementById('out').style.display='block';document.getElementById('out').innerHTML='<div class="card"><h3>网络异常</h3><p class="err">'+e.message+'</p></div>';}
 busy=false;document.getElementById('go').disabled=false;
}
async function go(){
 if(busy)return;
 var q=(document.getElementById('q').value||'').trim();
 if(!q){document.getElementById('q').focus();return;}
 var qs=quota();
 if(!qs.unlim && qs.n>=20){alert('今日 20 次额度已用完。勾选「站长无限模式」可继续，或明天再来。');return;}
 busy=true;document.getElementById('go').disabled=true;
 document.getElementById('out').style.display='none';document.getElementById('timer').textContent='';
 setStep(0);
 var iv=tick(Date.now());var st=1;
 var stepTimer=setInterval(function(){setStep(st);if(st<3)st++;},2500);
 try{
  var body={prompt:q,mode:(mode==='footage'?'video':mode)};
  body.voice_vol=(parseInt(document.getElementById('voiceVol').value,10)||100)/100;
  body.bgm_vol=(parseInt(document.getElementById('bgmVol').value,10)||90)/100;
  if(mode==='footage'){body.engine='footage';body.duration=parseInt(document.getElementById('dur').value,10)||60;} 
  var r=await fetch('/ai-nav/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  var d=await r.json();
  clearInterval(stepTimer);clearInterval(iv);
  if(!d.ok){setStep(0);document.getElementById('timer').textContent='';document.getElementById('out').style.display='block';document.getElementById('out').innerHTML='<div class="card"><h3>生成失败</h3><p class="err">'+(d.hint||d.error||'未知错误')+'</p><p style="color:var(--txt3);font-size:13px;margin-top:8px">建议：换个说法重试，或把文案要求写得更具体（时长/音色/风格）。</p></div>';}
  else{
   setStep(4);document.getElementById('timer').textContent='✅ 完成，用时 '+d.elapsed+' 秒';
   if(!qs.unlim) localStorage.setItem(qs.k,String(qs.n+1));quota();
   document.getElementById('out').style.display='block';document.getElementById('out').innerHTML=render(d);
   document.getElementById('out').scrollIntoView({behavior:'smooth',block:'start'});
  }
 }catch(e){
  clearInterval(stepTimer);clearInterval(iv);
  document.getElementById('out').style.display='block';
  document.getElementById('out').innerHTML='<div class="card"><h3>网络异常</h3><p class="err">'+e.message+'</p><p style="color:var(--txt3);font-size:13px;margin-top:8px">请检查网络后重试；国内站（xinglaiai.com）才有 AI 生成服务。</p></div>';
 }
 busy=false;document.getElementById('go').disabled=false;
}
document.getElementById('go').addEventListener('click',go);
document.getElementById('unlimited').addEventListener('change',function(){localStorage.setItem('studio_unlimited',this.checked?'1':'0');quota();});
document.getElementById('unlimited').checked=localStorage.getItem('studio_unlimited')==='1';
document.addEventListener('click',function(e){ if(e.target && e.target.id==='aiPolish'){ var t=document.getElementById('scriptEdit'); if(!t)return; var v=t.value.trim(); if(!v){alert('文案为空');return;} var b=e.target; b.disabled=true; b.textContent='AI 优化中…'; fetch('/ai-nav/api/polish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({script:v,prompt:(document.getElementById('q').value||'')})}) .then(function(r){return r.json()}).then(function(d){ if(d.ok&&d.script){t.value=d.script;} else {alert(d.hint||d.error||'优化失败');} }) .catch(function(){alert('网络异常')}) .finally(function(){b.disabled=false;b.textContent='✨ AI 优化文案';}); return; } if(e.target && e.target.id==='regen'){ var t=document.getElementById('scriptEdit'); if(!t) return; var v=t.value.trim(); if(!v){alert('文案不能为空');return;} var d0=lastData; var body={prompt:'按修改后的文案重新生成',mode:'video',engine:'footage',duration:(d0&&Math.max(30,Math.round(d0.duration)))||60,script:v}; return doGen(body); } });
quota();
</script>
</body></html>
