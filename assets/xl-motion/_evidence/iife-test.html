<!DOCTYPE html>
<html lang="zh-CN">
<head><meta name="robots" content="noindex,nofollow"><meta name="googlebot" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xl-motion IIFE 兼容自检</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0908'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23e6c27a' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../xl-motion.css">
<style>
  body { margin: 0; padding: 36px; background: #0a0908; color: #efe6d5; font-family: sans-serif; }
  .card { width: 240px; padding: 20px; border: 1px solid rgba(230, 194, 122, .35); margin: 14px 0; }
  svg { width: 320px; display: block; margin: 14px 0; }
</style>
</head>
<body class="xlm-scope">
  <!-- 传统 <script defer> 方式加载 IIFE 入口（内部动态加载 ES Module） -->
  <div class="xlm-nebula-wrap" data-xlm-nebula-wrap style="position:fixed;inset:0;z-index:0">
    <canvas class="xlm-nebula" data-xlm-nebula data-particles="600"></canvas>
    <div class="xlm-nebula__fallback"></div>
  </div>
  <main style="position:relative;z-index:2">
    <h1>IIFE 兼容自检</h1>
    <p>count: <b data-count="1234.5" data-decimals="1" data-sep=",">1,234.5</b></p>
    <div class="card" data-tilt data-xlm-reveal>tilt + reveal（桌面鼠标可倾斜）</div>
    <svg data-flow viewBox="0 0 300 40" aria-hidden="true">
      <path d="M4,32 C60,8 110,34 160,18 C210,4 260,26 296,12" fill="none" stroke="rgba(230,194,122,.6)" stroke-width="1.4"/>
    </svg>
  </main>
  <script defer src="../xl-motion.iife.js"></script>
</body>
</html>
