:false,"e":4,"u":5},{"slug":"notebooklm","n":"NotebookLM","c":"util","d":"上传资料生成播客与问答，支持中文","free":true,"local":false,"e":3,"u":4},{"slug":"immersive-translate","n":"沉浸式翻译","c":"util","d":"双语对照网页/PDF，论文阅读神器","free":true,"local":false,"e":4,"u":5},{"slug":"otter","n":"Otter.ai","c":"util","d":"会议实时转写与摘要，英文准确率高","free":true,"local":false,"e":4,"u":4},{"slug":"whisper","n":"Whisper","c":"util","d":"开源转写，本地跑 16k 音频准确率稳","free":true,"local":true,"e":4,"u":2},{"slug":"real-esrgan","n":"Real-ESRGAN","c":"util","d":"开源图片放大，4 倍无损放大","free":true,"local":true,"e":4,"u":3}];
function pick(){
  var cat=document.getElementById('q-cat').value;
  var bud=document.getElementById('q-budget').value;
  var pref=document.getElementById('q-pref').value;
  var list=DATA.filter(function(t){ return t.c===cat; });
  if(bud==='free') list=list.filter(function(t){ return t.free; });
  if(pref==='local') { var l=list.filter(function(t){ return t.local; }); if(l.length) list=l; }
  list.sort(function(a,b){
    if(pref==='easy') return b.u-a.u || b.e-a.e;
    return b.e-a.e || b.u-a.u;
  });
  var top=list.slice(0,3);
  if(!top.length){
    document.getElementById('res').innerHTML='<p class="hint">这个组合暂时没有匹配，放宽预算试试。</p>';
    return;
  }
  document.getElementById('res').innerHTML=top.map(function(t){
    return '<div class="card"><h3><a href="../tool/'+t.slug+'/">'+t.n+'</a></h3>'+
      '<p>'+t.d+'</p>'+
      '<span class="badge">效果 '+t.e+'/5</span><span class="badge">上手 '+t.u+'/5</span>'+
      '<span class="badge">'+(t.free?'有免费额度':'需付费')+'</span>'+
      (t.local?'<span class="badge">可本地部署</span>':'')+
      '<div class="acts"><a href="../tool/'+t.slug+'/">看详情与教程 →</a></div></div>';
  }).join('');
}
['q-cat','q-budget','q-pref'].forEach(function(id){ document.getElementById(id).addEventListener('change',pick); });
pick();
