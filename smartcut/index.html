<!DOCTYPE html>
<html lang="zh-CN">
<head><meta name="robots" content="noindex,nofollow"><meta name="googlebot" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智能粗剪 · 星籁 AI</title>
<style>
:root{--bg:#0b1020;--card:#151c33;--line:#27304f;--txt:#e8ecff;--sub:#9aa6c8;--pri:#4f7cff;--pri2:#7aa2ff;--ok:#32c48d;--warn:#f3b34c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1a2550 0%,var(--bg) 60%);color:var(--txt);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:26px;margin:0 0 6px}
.sub{color:var(--sub);font-size:14px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,#171f3a,#141b31);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font-size:16px;margin:0 0 12px}
label{display:block;color:var(--sub);font-size:13px;margin:10px 0 6px}
input,select,textarea,button{font:inherit}
input[type=text],input[type=number],select,textarea{width:100%;background:#0e1428;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 11px;outline:none}
textarea{min-height:92px;resize:vertical}
input[type=file]{color:var(--sub);font-size:13px}
button{background:linear-gradient(180deg,var(--pri),#3d63d8);border:0;color:#fff;border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:#1c2542;border:1px solid var(--line);font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;background:#1c2542;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--sub);margin:2px 4px 2px 0}
.seg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#101731}
.seg .t{font-size:13px;color:var(--sub)}
.seg .txt{margin-top:4px}
.score{color:var(--ok);font-weight:700}
.bar{height:6px;background:#0e1428;border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),#8bb0ff);transition:width .4s}
.muted{color:var(--sub);font-size:13px}
video{width:100%;border-radius:10px;background:#000;margin-top:10px}
.notice{font-size:12px;color:var(--warn);margin-top:12px}
pre{background:#0e1428;border:1px solid var(--line);border-radius:9px;padding:12px;overflow:auto;max-height:260px;font-size:12px;color:#bcd0ff}
.ok{color:var(--ok)}.bad{color:#ff7b7b}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div>
      <h1>智能粗剪 <span style="font-size:13px;color:var(--sub)">对标剪映「智能粗剪」· 标准/高精度</span></h1>
      <div class="sub">上传自己的视频 → 说清粗剪要求 → AI 按语义选段（整句保留）→ 一键渲染成片（原声+字幕+AI 标识）</div>
    </div>
    <div id="health" class="muted">自检中…</div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>① 视频与要求</h2>
      <label>上传本地视频（MP4/MOV，3 秒~15 分钟）</label>
      <input type="file" id="file" accept="video/mp4,video/quicktime">
      <div class="muted" id="upState">未上传</div>
      <label>或粘贴已上传的视频 URL / 素材 URL</label>
      <input type="text" id="videoUrl" placeholder="https://xinglaiai.com/ai-nav/studio/files/uploads/xxx.mp4">
      <label>粗剪要求（越具体越好）</label>
      <textarea id="req" placeholder="例：保留 AI 趋势判断和三层基础设施的干货，开头要有钩子，结尾给结论，节奏紧凑，删掉客套和重复">保留 AI 趋势判断和三层基础设施的干货，开头要有钩子，结尾给结论，节奏紧凑，删掉客套和重复</textarea>
      <div class="row" style="margin-top:10px">
        <div style="flex:1;min-width:130px"><label>模式（preset）</label>
          <select id="preset">
            <option>通用</option><option>口播片</option><option>配音解说</option>
            <option>长视频切片</option><option>VLOG记录</option><option>混剪</option>
          </select>
        </div>
        <div style="width:120px"><label>档位</label>
          <select id="precision"><option value="standard">标准（快）</option><option value="high">高精度</option></select>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <div style="width:130px"><label>目标时长（秒）</label><input type="number" id="target" value="25" min="5" max="300"></div>
        <div style="width:130px"><label>输出比例</label>
          <select id="ratio"><option value="source">原片</option><option value="9:16">9:16 竖屏</option><option value="1:1">1:1</option><option value="16:9">16:9</option><option value="3:4">3:4</option></select>
        </div>
      </div>
      <div class="row" style="margin-top:16px">
        <button id="btnPlan">生成粗剪计划</button>
        <span class="muted" id="planState"></span>
      </div>
      <div class="notice">合规提示：请使用本人原创或已授权素材，禁止搬运他人版权视频；成片带「AI 生成」标识，平台不代发布。</div>
    </div>

    <div class="card">
      <h2>② 计划预览</h2>
      <div id="planMeta" class="muted">还没有计划</div>
      <div class="bar"><i id="planBar"></i></div>
      <video id="preview" controls playsinline style="display:none"></video>
      <div id="segs"></div>
      <div id="planExtra" class="muted"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>③ 渲染成片</h2>
    <div class="row">
      <div style="width:150px"><label>字幕</label>
        <select id="subtitle"><option value="burn">烧录字幕</option><option value="none">无字幕</option></select>
      </div>
      <div style="width:150px"><label>转场</label>
        <select id="transition"><option value="none">硬切（快）</option><option value="fade">淡入淡出</option></select>
      </div>
      <div style="width:150px"><label>BGM</label>
        <select id="bgm"><option value="none">原声</option><option value="auto">按计划自动配乐</option></select>
      </div>
      <div style="width:130px"><label>清晰度</label>
        <select id="quality"><option value="720p">720p</option><option value="1080p">1080p</option></select>
      </div>
      <div style="align-self:flex-end"><button id="btnRender" disabled>渲染成片</button></div>
      <span class="muted" id="renderState"></span>
    </div>
    <div class="bar"><i id="renderBar"></i></div>
    <video id="output" controls playsinline style="display:none"></video>
    <div id="renderInfo" class="muted"></div>
    <details style="margin-top:12px"><summary class="muted">查看计划 JSON</summary><pre id="json"></pre></details>
  </div>
</div>
<script>
const API = '/ai-nav/api';
let state = {planId:null, plan:null, videoUrl:'', busy:false};
const $ = id => document.getElementById(id);
const setText = (id, t) => { $(id).textContent = t; };

function toast(id, msg, cls){ const el=$(id); el.className = 'muted ' + (cls||''); el.textContent = msg; }

async function jfetch(url, opt){
  const r = await fetch(url, opt);
  let data = null;
  try { data = await r.json(); } catch(e) {}
  if (!r.ok || (data && data.ok === false)) {
    const err = (data && (data.hint || data.error)) || ('HTTP ' + r.status);
    throw new Error(err);
  }
  return data;
}

async function health(){
  try {
    const h = await jfetch(API + '/smartcut/health');
    $('health').innerHTML = '<span class="ok">● 服务正常</span> ' + (h.version||'') +
      ' · ASR ' + (h.asr_engines||[]).join('/') + ' · 渲染串行';
  } catch(e){ $('health').innerHTML = '<span class="bad">● 服务异常：' + e.message + '</span>'; }
}

$('file').addEventListener('change', async (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  toast('upState', '上传中… ' + Math.round(f.size/1048576*10)/10 + 'MB');
  try {
    const fd = new FormData(); fd.append('file', f);
    const r = await fetch(API + '/upload', {method:'POST', body:fd});
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.hint || d.error || ('HTTP '+r.status));
    state.videoUrl = d.url;
    $('videoUrl').value = location.origin + d.url;
    toast('upState', '已上传：' + d.name + '（' + (d.size/1048576).toFixed(1) + 'MB）', 'ok');
  } catch(e){ toast('upState', '上传失败：' + e.message, 'bad'); }
});

function segHtml(segs){
  return segs.map((s,i)=>`<div class="seg">
    <div class="t">片段 ${i+1} · ${s.start.toFixed(2)}s → ${s.end.toFixed(2)}s · ${(s.role||'完整句')} · <span class="score">${s.score}</span> 分</div>
    <div class="txt">${(s.text||'').slice(0,120)}</div>
    <div class="t" style="margin-top:4px">保留理由：${s.reason||''}</div>
  </div>`).join('');
}

$('btnPlan').addEventListener('click', async () => {
  if (state.busy) return;
  const videoUrl = ($('videoUrl').value || state.videoUrl || '').trim();
  if (!videoUrl) { toast('planState', '请先上传视频或粘贴视频 URL', 'bad'); return; }
  state.busy = true; $('btnPlan').disabled = true; $('btnRender').disabled = true;
  $('planBar').style.width = '8%';
  toast('planState', '识别语音 + AI 选段中（约 15~40 秒）…');
  const t0 = Date.now();
  try {
    const d = await jfetch(API + '/smartcut/plan', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({video_url: videoUrl, requirement: $('req').value.trim(),
        preset: $('preset').value, precision: $('precision').value,
        target_duration: Number($('target').value)||25, ratio: $('ratio').value})
    });
    state.planId = d.plan_id; state.plan = d;
    $('planBar').style.width = '100%';
    const secs = ((Date.now()-t0)/1000).toFixed(1);
    setText('planMeta', `计划 ${d.plan_id} · ${d.segments.length} 段 · 成片约 ${d.total_duration}s · 耗时 ${secs}s · 预计渲染 ${d.estimate_render_time}s`);
    $('segs').innerHTML = segHtml(d.segments || []);
    if (d.preview_url) { $('preview').src = d.preview_url; $('preview').style.display='block'; }
    const p = d.plan || {};
    $('planExtra').innerHTML = `<div style="margin-top:8px">
      <span class="tag">标题：${p.title||'-'}</span><span class="tag">封面：${p.cover_text||'-'}</span>
      <span class="tag">BGM：${(p.bgm||{}).mood||'-'}</span><span class="tag">字幕：${p.subtitle_style||'-'}</span>
      <span class="tag">AI：${d.ai_label||'AI 生成'}</span></div>
      <div style="margin-top:6px">${(p.notes||'')}</div>
      <div style="margin-top:4px">ASR：${(d.asr||{}).engine||''} · ${(d.asr||{}).sentences||0} 句 · DeepSeek ${((d.stats||{}).llm_ms||0)/1000}s · 成本 ¥${(d.stats||{}).cost_cny||0}</div>`;
    $('json').textContent = JSON.stringify(d, null, 2);
    $('btnRender').disabled = false;
    toast('planState', '计划完成：' + d.segments.length + ' 段 / ' + d.total_duration + 's', 'ok');
  } catch(e) {
    $('planBar').style.width = '0';
    toast('planState', '失败：' + e.message, 'bad');
  } finally { state.busy = false; $('btnPlan').disabled = false; }
});

let pollTimer = null;
async function pollTask(taskId){
  const st = await jfetch(API + '/smartcut/task/' + taskId);
  $('renderBar').style.width = (st.progress || 3) + '%';
  toast('renderState', st.status==='done' ? '完成' : ((st.stage||'渲染中') + ' ' + (st.progress||0) + '%'));
  if (st.status === 'done') {
    clearInterval(pollTimer); pollTimer = null;
    $('renderBar').style.width = '100%';
    $('output').src = st.video_url; $('output').style.display='block';
    $('renderInfo').innerHTML = `<div style="margin-top:8px"><span class="tag">时长 ${st.duration}s</span>
      <span class="tag">大小 ${(st.size/1048576).toFixed(1)}MB</span><span class="tag">耗时 ${st.elapsed}s</span>
      <span class="tag">${st.ratio} / ${st.quality}</span><span class="tag">AI 生成</span>
      <a href="${st.video_url}?download=1" style="color:var(--pri2)">下载成片</a></div>`;
    $('btnRender').disabled = false;
    toast('renderState', '成片完成', 'ok');
  } else if (st.status === 'failed') {
    clearInterval(pollTimer); pollTimer = null;
    $('btnRender').disabled = false;
    toast('renderState', '渲染失败：' + (st.hint || st.error), 'bad');
  }
}

$('btnRender').addEventListener('click', async () => {
  if (!state.planId || state.busy) return;
  state.busy = true; $('btnRender').disabled = true;
  $('renderBar').style.width = '2%';
  toast('renderState', '已提交渲染任务…');
  try {
    const d = await jfetch(API + '/smartcut/render', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({plan_id: state.planId, subtitle: $('subtitle').value,
        transition: $('transition').value, ratio: $('ratio').value,
        quality: $('quality').value, bgm: $('bgm').value})
    });
    toast('renderState', '排队中（预计 ' + (d.estimate_render_time||'-') + 's）');
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => pollTask(d.task_id).catch(e => {
      clearInterval(pollTimer); pollTimer=null; $('btnRender').disabled=false;
      toast('renderState', '查询失败：' + e.message, 'bad');
    }), 1800);
  } catch(e) {
    $('renderBar').style.width = '0'; $('btnRender').disabled = false;
    toast('renderState', '失败：' + e.message, 'bad');
  } finally { state.busy = false; }
});

health();
</script>
</body>
</html>
