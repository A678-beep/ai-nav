.wz-head{display:flex;gap:18px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin:0 0 12px}

}

/* 简单模式 */
.simple-hero{
  border:1px solid rgba(245,185,68,.3);border-radius:16px;padding:20px;
  background:radial-gradient(680px 300px at 8% 0%,rgba(245,185,68,.15),transparent 60%),
             radial-gradient(600px 280px at 96% 8%,rgba(45,212,191,.1),transparent 60%),
             linear-gradient(170deg,#101a2b,#0a111d 74%);
  box-shadow:var(--cc-shadow);margin-bottom:14px;
}
html[data-theme="light"] .simple-hero{background:radial-gradient(680px 300px at 8% 0%,rgba(245,185,68,.26),transparent 60%),radial-gradient(600px 280px at 96% 8%,rgba(45,212,191,.16),transparent 60%),linear-gradient(170deg,#fff,#f7faff 74%)}
.simple-hero h2{margin:0 0 6px;font-size:21px;font-weight:900}
.simple-hero .sub{margin:0 0 14px;color:var(--cc-sub);font-size:12.8px;line-height:1.65;max-width:860px}
.simple-grid{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(210px,1fr);gap:13px}
@media(max-width:880px){.simple-grid{grid-template-columns:minmax(0,1fr)}}
.simple-side{display:flex;flex-direction:column;gap:10px}
.simple-side .box{border:1px solid var(--cc-line);border-radius:11px;padding:11px 12px;background:rgba(148,163,184,.04)}
.simple-side .box .t{font-size:11px;color:var(--cc-dim);letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:7px}
.simple-side .chips{display:flex;gap:5px;flex-wrap:wrap}
.simple-side .chips button{border:1px solid var(--cc-line);background:rgba(148,163,184,.06);color:var(--cc-sub);border-radius:999px;padding:3px 10px;font:inherit;font-size:11.5px;cursor:pointer}
.simple-side .chips button.on{background:rgba(245,185,68,.17);border-color:rgba(245,185,68,.44);color:#ffe8b8;font-weight:700}
html[data-theme="light"] .simple-side .chips button.on{color:#7c4a03}
.simple-cta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:13px}
.simple-cta .big{font-size:15px;padding:12px 22px;border-radius:11px}
.simple-pipe{display:flex;flex-direction:column;gap:0;margin-top:12px}
.simple-pipe .r{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px;color:var(--cc-sub);border-bottom:1px dashed var(--cc-line2)}
.simple-pipe .r:last-child{border-bottom:0}
.simple-pipe .r .ic{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--cc-line);display:grid;place-items:center;font-size:10px;flex:0 0 auto;font-family:var(--cc-mono);color:var(--cc-dim)}
.simple-pipe .r.run .ic{border-color:rgba(245,185,68,.6);color:#ffe8b8;background:rgba(245,185,68,.12)}
.simple-pipe .r.done .ic{border-color:rgba(52,211,153,.55);color:#6ee7b7;background:rgba(52,211,153,.12);font-size:11px}
.simple-pipe .r .sp{flex:1}
.simple-pipe .r .st{font-size:11px;color:var(--cc-dim);font-family:var(--cc-mono)}

/* 方案摘要卡 */
.plan-brief{border:1px solid var(--cc-line);border-radius:12px;padding:13px 14px;background:rgba(148,163,184,.035);margin:0 0 12px}
.plan-brief .t{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:16px;font-weight:900;color:#f7e6bf;margin:0 0 4px}
html[data-theme="light"] .plan-brief .t{color:#7c4a03}
.plan-brief .l{font-size:12.5px;color:var(--cc-sub);line-height:1.65;margin:0 0 9px}
.plan-brief .chips{display:flex;gap:6px;flex-wrap:wrap}
.plan-brief .chips span{font-size:11px;color:#c8d6ea;border:1px solid var(--cc-line);background:rgba(148,163,184,.06);border-radius:6px;padding:1px 7px;font-family:var(--cc-mono)}
.plan-brief .chips span.gold{border-color:rgba(245,185,68,.32);background:rgba(245,185,68,.09);color:#f3dfae}
.plan-cost{border:1px solid rgba(245,185,68,.26);border-radius:12px;padding:12px 14px;background:linear-gradient(180deg,rgba(245,185,68,.07),rgba(245,185,68,.02))}
.plan-cost .tot{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.plan-cost .tot b{font-size:24px;font-weight:900;color:#ffe2a3;font-family:var(--cc-mono)}
html[data-theme="light"] .plan-cost .tot b{color:#8a5305}
.plan-cost .tot span{font-size:11.5px;color:var(--cc-dim)}
.plan-cost .rows{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:11.5px;color:var(--cc-sub)}
.plan-cost .rows div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--cc-line2);padding:2px 0}
.plan-cost .rows div b{font-family:var(--cc-mono);color:#e6d7b4;font-weight:600}
html[data-theme="light"] .plan-cost .rows div b{color:#6b3f03}
.plan-cost .warn{margin-top:8px;color:#fbbf24;font-size:11.5px;line-height:1.5}

/* 分镜表补充 */
.shot-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.shot-toolbar .dur{font-size:12px;color:var(--cc-sub)}
.shot-toolbar .dur b{font-family:var(--cc-mono);color:#f3dfae}
.shot-toolbar .bad{color:#f87171;font-size:11.5px}
.shot-toolbar .ok{color:#34d399;font-size:11.5px}
.cc-table input.cc-input,.cc-table select.cc-select{padding:4px 7px;min-height:31px;font-size:12px}
.cc-table .row-actions{display:flex;gap:3px}
.cc-table .row-actions button{border:1px solid var(--cc-line);background:rgba(148,163,184,.07);color:var(--cc-sub);border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:11px;line-height:1;padding:0}
.cc-table .row-actions button:hover{border-color:rgba(245,185,68,.45);color:#ffe8b8}
.cc-table .row-actions button.del:hover{border-color:rgba(248,113,113,.5);color:#fca5a5}

/* 生成进度 */
.render-box{border:1px solid var(--cc-line);border-radius:13px;padding:14px;background:rgba(148,163,184,.035)}
.render-box .rb-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.render-box .rb-head .stage{font-size:14px;font-weight:800;color:#f2e7c9;display:flex;gap:8px;align-items:center}
html[data-theme="light"] .render-box .rb-head .stage{color:#7c4a03}
.render-box .rb-head .pct{font-family:var(--cc-mono);font-size:20px;font-weight:900;color:#ffe2a3}
html[data-theme="light"] .render-box .rb-head .pct{color:#8a5305}
.render-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--cc-sub)}
.render-meta span{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--cc-line);border-radius:7px;padding:2px 8px;background:rgba(148,163,184,.04)}
.render-meta b{font-family:var(--cc-mono);color:#e6d7b4;font-weight:600}
html[data-theme="light"] .render-meta b{color:#6b3f03}
.eta{font-size:11.5px;color:var(--cc-dim);margin-top:8px;line-height:1.6}

/* QC */
.qc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.qc-item{border:1px solid var(--cc-line);border-radius:9px;padding:8px 10px;font-size:11.8px;display:flex;gap:8px;align-items:flex-start;background:rgba(148,163,184,.03)}
.qc-item .s{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;flex:0 0 auto;margin-top:1px;font-weight:800}
.qc-item .s.pass{background:rgba(52,211,153,.16);color:#6ee7b7;border:1px solid rgba(52,211,153,.4)}
.qc-item .s.fail{background:rgba(248,113,113,.16);color:#fca5a5;border:1px solid rgba(248,113,113,.4)}
.qc-item .s.warn{background:rgba(251,191,36,.16);color:#fde68a;border:1px solid rgba(251,191,36,.4)}
.qc-item .t b{display:block;font-size:12px;color:#e6edf9}
html[data-theme="light"] .qc-item .t b{color:#152238}
.qc-item .t small{color:var(--cc-dim);font-size:10.5px;line-height:1.5;display:block;margin-top:1px}
.qc-score{display:flex;align-items:baseline;gap:8px}
.qc-score b{font-size:26px;font-weight:900;font-family:var(--cc-mono)}
.qc-score.pass b{color:#34d399}.qc-score.fail b{color:#f87171}
.qc-score span{font-size:11.5px;color:var(--cc-dim)}

/* 后期卡 */
.post-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
@media(max-width:1080px){.post-grid{grid-template-columns:minmax(0,1fr)}}
.post-card{border:1px solid var(--cc-line);border-radius:12px;padding:13px;background:rgba(148,163,184,.035)}
.post-card h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:7px}
.post-card .kv{display:flex;justify-content:space-between;gap:8px;font-size:11.8px;color:var(--cc-sub);border-bottom:1px dashed var(--cc-line2);padding:4px 0}
.post-card .kv:last-child{border-bottom:0}
.post-card .kv b{font-family:var(--cc-mono);color:#e6d7b4;font-weight:600;text-align:right}
html[data-theme="light"] .post-card .kv b{color:#6b3f03}
.post-card .note{font-size:11px;color:var(--cc-dim);line-height:1.6;margin-top:8px}

/* 保存/发布 */
.save-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media(max-width:1000px){.save-grid{grid-template-columns:minmax(0,1fr)}}
.checklist{display:flex;flex-direction:column;gap:7px}
.checklist .ci{display:flex;gap:9px;align-items:flex-start;font-size:12.3px;color:var(--cc-sub);line-height:1.55}
.checklist .ci .s{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-size:10px;margin-top:1px}
.checklist .ci .s.ok{background:rgba(52,211,153,.16);color:#6ee7b7;border:1px solid rgba(52,211,153,.4)}
.checklist .ci .s.todo{background:rgba(148,163,184,.1);color:var(--cc-dim);border:1px solid var(--cc-line)}
.checklist .ci .s.bad{background:rgba(248,113,113,.16);color:#fca5a5;border:1px solid rgba(248,113,113,.4)}

/* 最近任务列表 */
.recent-list{display:flex;flex-direction:column;gap:7px;max-height:420px;overflow:auto;padding-right:3px}
.recent-item{display:flex;gap:10px;align-items:center;border:1px solid var(--cc-line);border-radius:10px;padding:9px 11px;background:rgba(148,163,184,.03);flex-wrap:wrap}
.recent-item .rid{font-family:var(--cc-mono);font-size:11px;color:var(--cc-amber)}
.recent-item .rstat{font-size:11px}
.recent-item .rmeta{flex:1;min-width:120px;font-size:11px;color:var(--cc-dim)}
.recent-item .rmeta b{color:#e6d7b4;font-family:var(--cc-mono)}
html[data-theme="light"] .recent-item .rmeta b{color:#6b3f03}

/* 档位卡 */
.tier-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
@media(max-width:1000px){.tier-grid{grid-template-columns:minmax(0,1fr)}}
.tier-card{border:1px solid var(--cc-line);border-radius:13px;padding:14px;background:rgba(148,163,184,.035);cursor:pointer;position:relative;transition:border-color .15s,transform .1s}
.tier-card:hover{transform:translateY(-1px);border-color:rgba(245,185,68,.4)}
.tier-card.on{border-color:rgba(245,185,68,.65);background:linear-gradient(180deg,rgba(245,185,68,.13),rgba(245,185,68,.03));box-shadow:inset 0 0 0 1px rgba(245,185,68,.16)}
.tier-card.on::after{content:"✓";position:absolute;right:11px;top:10px;width:18px;height:18px;border-radius:50%;background:var(--cc-amber);color:#1b1203;font-size:11px;font-weight:900;display:grid;place-items:center}
.tier-card h4{margin:0 0 4px;font-size:15px}
.tier-card .p{font-family:var(--cc-mono);font-size:19px;font-weight:900;color:#ffe2a3;margin:0 0 8px}
html[data-theme="light"] .tier-card .p{color:#8a5305}
.tier-card .p small{font-size:10.5px;color:var(--cc-dim);font-weight:500}
.tier-card ul{margin:0;padding-left:15px;font-size:11.5px;color:var(--cc-sub);line-height:1.7}
.tier-card .rec{position:absolute;right:10px;bottom:9px;font-size:10px;color:#1b1203;background:var(--cc-amber);border-radius:5px;padding:1px 6px;font-weight:800}

/* 交付 */
.sha{font-family:var(--cc-mono);font-size:10.5px;color:var(--cc-dim);word-break:break-all;line-height:1.5}
.tl{display:flex;flex-direction:column;gap:0;margin-top:8px}
.tl .ti{display:flex;gap:10px;font-size:11.8px;color:var(--cc-sub);padding:5px 0;border-bottom:1px dashed var(--cc-line2)}
.tl .ti:last-child{border-bottom:0}
.tl .ti .c{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9px;flex:0 0 auto;margin-top:1px}
.tl .ti .c.ok{background:rgba(52,211,153,.16);color:#6ee7b7}
.tl .ti .c.no{background:rgba(148,163,184,.1);color:var(--cc-dim)}
.tl .ti .sp{flex:1}
.tl .ti .tm{font-family:var(--cc-mono);font-size:10.5px;color:var(--cc-dim)}
@media(max-width:760px){
  .wz-head h1{font-size:22px}
  .wz-summary{position:static}
  .simple-hero{padding:15px}
  .tier-grid{grid-template-columns:minmax(0,1fr)}
}
</style>
