/* 文章由构建脚本注入 */
const ARTICLES = [{"id":"biz-01-notion-ai-database-automation","title":"Notion AI 数据库 自动化：4 步搭建","category":"biz","keywords":["Notion AI 数据库自动化","数据库自动化","Notion AI"],"longtail":["Notion 自动填摘要","Notion 数据库自动更新"],"tags":["Notion","数据库","自动化"],"content":"团队周报以前靠群里接龙，我统计一轮要 40 分钟，还经常漏人。后来把周报搬进 Notion 数据库，用 AI 属性写摘要，再挂三条自动化，现在每周省下 3 小时。整套跑在 Business 版上，$20/人/月，六人小组的额度够用。跑顺之前我踩过两个坑：AI 摘要会把客户报价一起抄进公开视图，批量导入的触发器也会静默失败。所以这套 Notion AI 数据库自动化，重点根本不在 AI。\n\n## 一、字段先拆到机器能填\n\n新建 Table 视图的数据库，第一轮只留五列：任务名（Text）、负责人（Person）、本周进展（Text）、风险（Select：高/中/低）、AI 摘要（AI Autofill）。只有第三列需要人写，其余都能自动产出。AI 属性的 Prompt 我固定成一句：用 40 字内概括进展，只写结果和数字，不加评价。这一步定完，Notion 自动填摘要就能稳定跑到九成可用，剩下那一成靠人工改，不要指望全自动。\n\n风险列别手填，改成 Formula：if(contains(prop(\"本周进展\"), \"延期\"), \"高\", \"低\")。测试时故意写「延期两天」，看这一列是否跳出「高」。中文引号会让公式整列报错，必须用英文双引号，我第一版从文档里复制了中文引号，卡了二十分钟才找到原因。\n\n## 二、触发器只做三件事\n\n第一步，数据库右上角 Automations → New automation，触发选 When page added，动作选 Notify people，指定负责人。第二步，再加一条 When property edited，条件设「风险 = 高」，动作发群消息。第三步，周一 7:00 的定时触发配模板按钮，只预填任务名和负责人，避免把上周内容复制成默认值。三条挂完，Notion AI 数据库自动化才算闭环。\n\n避坑一，权限。数据库放进团队空间后，公开分享链接里的 AI 摘要会对外可见；含客户报价的子页要在上线前挪进私有区，或者改用 Relation 引用、不给查看权限。避坑二，触发失败。CSV 导入超过 100 行时，When page added 只跑前 20 行的通知，剩下八十行得手动点一次批量按钮，最好在导入后检查一遍「上次编辑时间」。避坑三，额度。AI Autofill 按工作区扣次数，六个人每天二十行，月底基本见底，重要摘要先手写再让 AI 润色。\n\n## 三、审核环节要留痕\n\n我留了一个「已审核」Checkbox，AI 摘要生成后默认不打勾，只有打勾的行才进周报汇总视图。这样 AI 漏数字时能当场发现，不会在会上被问住。视图筛选设成：已审核 = 勾选 且 风险 = 高，每周一先看这十几行。另外让 Notion 数据库自动更新负责人字段，人员离职时只改一处 Relation，不用翻十张表。\n\n## 总结\n\n复刻就四步：建表拆字段、写 AI Prompt、用 Formula 兜规则、挂三条自动化。真正的收益不是订阅价，而是每周省下的 3 小时，加上出错后能追溯到具体单元格。Notion AI 数据库自动化的上限取决于字段设计，不是模型；每两周把 Prompt 和公式检查一遍，比换工具管用。Notion 自动填摘要只适合结构化字段，别指望它替你判断优先级。把这套 Notion 数据库自动更新流程跑满一个月，再决定要不要加人。","path":"articles/biz/01-notion-ai-database-automation.md"},{"id":"biz-02-feishu-bitable-ai-field","title":"飞书 多维表格 AI 字段：3 类工单","category":"biz","keywords":["飞书多维表格","AI 字段","多维表格 AI 字段"],"longtail":["AI 字段自动分类","多维表格 AI 提取"],"tags":["飞书","多维表格","AI 字段"],"content":"客服组每天把工单备注粘进表格再人工打标签，两个运营一上午就没了。我把客服系统导出的表接进飞书多维表格，用 AI 字段做分类和提取，结果再推回工单系统。现在每天只花 20 分钟抽检，团队按 Lark Pro $12/人/月订阅，三个月省下的时间够再养一个兼职。只是飞书多维表格的 AI 字段不是万能标签器，用之前得把字段类型和 Prompt 定死。\n\n## 一、先建三列，别贪多\n\n第一步，表格右侧点「+」新增字段，类型选「AI 字段」，在「自动分类」里填类别清单：物流延迟、质量问题、退款退货、其他。多维表格 AI 字段的配置入口只在这一处，别去自动化里找。第二步，再建一列 AI 字段，类型选「信息提取」，Prompt 写：从备注里提取订单号、商品名、诉求，用 JSON 输出，键名固定。第三步，加一列「人工复核」单选，值只有已复核和待复核，专门用来抽检。\n\n输入示例要写两条，一条正常、一条带脏话，模型才知道哪些内容该忽略。多维表格 AI 提取的字段类型选文本，别选数字，订单号一旦被当成数字会自动变成科学计数法。\n\n## 二、批量重算按 500 行一批\n\n一次导入 3000 行，多维表格 AI 字段不会随着导入自动全量重算，实测只处理前一批，剩下的停在等待中。我的做法是用视图筛「AI 字段为空」，每次筛 500 行，点字段菜单里的「重新生成」，六批跑完大约 40 分钟。另外，AI 字段自动分类的结果会缓存，改 Prompt 后不会自动刷新，必须手动再生成一次。\n\n避坑一，权限与脱敏。AI 字段把整行内容送进模型，同一行里如果有手机号、身份证号，等于把个人信息发了出去；我先把这些列拆到子表，只留订单号和诉求。避坑二，额度。企业版 AI 字段按调用次数计费，一次批量重算 500 行就算 500 次，月底做全量重算很容易超支，重算前先跑 50 行看效果。避坑三，中文标点。备注里的全角引号和换行会让 JSON 解析失败，提取前先用公式把换行替换成空格。\n\n## 三、把分类结果回写工单系统\n\n分类列定稿后，用自动化每天 18:00 把「待处理 + 物流延迟」的行同步到客服系统，命中率稳定在 85% 左右。剩余 15% 靠人工复核列兜底，工单积压从每天 40 条降到 6 条。多维表格 AI 提取的订单号会带空格，回写前记得在字段里做一次 trim。\n\n## 总结\n\n飞书多维表格 AI 字段真正省时间的地方在批量清洗，不在替代人。三步配置：建分类列、建提取列、留复核列，再按 500 行分批重算。成本上 Lark Pro $12/人/月，比请一个数据标注兼职便宜太多。别把 AI 字段自动分类当质检用，它输出的是草稿，工单流转还得靠你自己定的规则。","path":"articles/biz/02-feishu-bitable-ai-field.md"},{"id":"biz-03-zapier-ai-automation-workflow","title":"Zapier AI 自动化 流程：4 个触发器","category":"biz","keywords":["Zapier","AI 自动化","自动化流程"],"longtail":["Zapier 触发器","Zapier AI 步骤"],"tags":["Zapier","自动化","线索管理"],"content":"市场部每周从官网、展会、公众号收到约 200 条线索，以前两个实习生拿 Excel 去重、查公司域名、按行业打标签，一周六个小时。现在我把表单接进 Zapier，中间插一步 AI 清洗和打分，再写进 CRM，整条链路用 Professional 年付 $19.99/月就够跑。Zapier 的 AI 自动化流程不难，难的是别让 task 额度漏在触发器顺序上。\n\n## 一、四步搭完一条链路\n\n第一步，触发器选 Webhook 或表单工具（Tally、Typeform），先拿一条测试数据跑通。第二步，加 Filter，条件设邮箱包含 @ 且公司名不为空，把无效线索挡在 AI 之前。第三步，加 Zapier AI 步骤（AI by Zapier），Prompt 写：判断公司所属行业，输出 5 字以内标签和 1 到 5 分意向分，只返回 JSON。第四步，写 HubSpot 或 Salesforce，把 AI 输出拆成行业和意向分两个字段。\n\n每条 zap 跑一次就是一个 task，Professional 年付给 750 次/月，200 条线索乘 5 步就是 1000 次，超出的要单独买 task 包。所以 Filter 必须前置，无效线索不占 AI 的 task。这是保住 AI 自动化流程不超预算最直接的一招。\n\n## 二、重复线索和时区这两个坑\n\n上线前我拿两周历史线索回测：AI 打的意向分和各区销售的手工评级对比，前 30% 里有 24 家重合，够用；低于 2 分的自动进培育池，销售不跟。回测这一步不做，AI 分数就是个好看的数字。\n\n避坑一，重复触发。用户刷新表单会重复提交，同一邮箱三天内已入库的记录会被再创建一次；加一步 Find Record，查到就 Stop，别指望去重功能自动兜住。避坑二，时区。触发器按账号时区解析时间，团队在 UTC+8、CRM 存 UTC，写日期前要在 Formatter 里转一次，否则记录时间差 8 小时，报表全乱。避坑三，数据合规。客户邮箱和手机号会经过 AI 步骤的第三方模型，签 DPA 之前别上这个需求；能脱敏就先把手机号遮掉，AI 只判行业，不影响结果。Zapier 触发器选表单还是 Webhook 都行，但一次只挂一个入口，两个表单塞进同一条 zap，排查时你会想砸键盘。\n\n另外，Zapier AI 步骤返回非 JSON 是最常见的失败，Prompt 里补一句「只输出 JSON，不要解释」，后面再用 Formatter 兜一层。连续失败命中阈值时 Zapier 会自动停用 zap，周一先看邮件通知。\n\n## 三、失败排查按固定顺序走\n\n打开 Zap history，先看 Filter 还是 AI 步骤报错。Filter 不通过不是错误，是正常跳过，别看错。真正要修的是 AI 返回格式和 CRM 字段类型不匹配，前者改 Prompt，后者改映射。每周花十分钟翻一次 history，比出问题再查快。还有一类失败最坑：Filter 的条件里混进中文逗号，邮箱判断永远不成立，那一周一条线索都没进 CRM，第二天对账才发现。\n\n## 总结\n\n这条 AI 自动化流程的价值是把清洗和打分标准化，200 条线索从 6 小时压到 15 分钟。每月 $19.99 订阅加少量超量 task，成本可控。Zapier 触发器选对、Filter 前置、AI 输出固定格式，这三点做到，剩下的就是每周看一次失败记录，把失败原因按周导出，累计三条以上就改 Prompt 或者加 Filter。","path":"articles/biz/03-zapier-ai-automation-workflow.md"},{"id":"biz-04-n8n-self-hosted-workflow","title":"n8n 自建 工作流：Docker 三步部署","category":"biz","keywords":["n8n","自建工作流","定时任务"],"longtail":["n8n Docker 部署","n8n 定时触发"],"tags":["n8n","自建","工作流"],"content":"内容组每周要盯 20 个竞品博客和公众号，人工摘录进飞书表格，一个人一周 5 小时。我用 Docker 在 2 核 2G 的 VPS 上自建 n8n，配一条定时工作流：抓 RSS、去重、AI 摘要、写进多维表格、发群通知。服务器 $6/月，对比 n8n Cloud Starter 的 $24/月，省下的钱不多，但数据留在自己机器上。n8n 自建工作流真正的成本是维护，不是订阅费。\n\n## 一、部署就三步\n\n第一步，跑 docker run -d --name n8n -p 5678:5678 -v n8n_data:/home/node/.n8n docker.n8n.io/n8nio/n8n，把数据卷挂出来，升级不丢凭证。第二步，用 Caddy 配 443 端口的反向代理和自动证书，webhook 必须走公网域名，否则飞书回调收不到。第三步，进 Settings 把时区改成 Asia/Shanghai，再建第一个定时触发节点。\n\n2 核 2G 跑 20 条工作流，内存占用大约 700MB，超过 50 条建议上 4G，否则触发高峰会 OOM 重启。n8n Docker 部署最省事的其实是升级：拉新镜像、删旧容器、保留数据卷，三条命令换完。另外，n8n 官方节点里没有飞书多维表格，得在 Settings 的社区节点里填包名装插件，装完重启容器才生效。n8n Docker 部署还有一个细节：容器重启策略设 always，服务器重启后工作流自动恢复，不然周一早上你以为是定时任务没跑，其实是容器没起来。数据卷每天 rsync 到对象存储，$1/月就能保住全部历史执行记录。\n\n## 二、三个我踩过的坑\n\n避坑一，加密密钥。n8n 把凭据加密存在数据卷里，N8N_ENCRYPTION_KEY 不写死，重装容器后飞书、OpenAI 的所有凭据全部解不开，只能重新授权一遍。避坑二，重复执行。定时触发每 30 分钟跑一次，抓 RSS 时同一篇文章会重复入库，用发布时间做去重，别只按标题。避坑三，版本升级。升级前把工作流导出成 JSON 存一份，社区版大版本升级有节点参数改名的情况，我从 0.9 升到 1.x 时飞书节点一个字段名变了，整条链路静默失败，日志里只报 undefined。\n\n还有一个小坑：飞书多维表格的字段名带空格时，节点里的字段映射要手写点号路径，别用自动匹配，自动匹配会把空格吃掉。\n\n## 三、省钱账要算清楚\n\nn8n 定时触发每 30 分钟一次，一天 48 次，20 个源大约 300 条/天，一个月约 9000 次执行。n8n Cloud Starter 只含 2500 次执行，超量要加钱；自建只看 VPS 和模型费。摘要用便宜的小模型，一条成本约 $0.0004，一个月 3.6 美元，合计 $10 出头。定时任务是 n8n 最稳的用法，8:00 到 22:00 每 30 分钟跑一次，目标站超时就重试三次，第一个月跑了 8900 次，失败 12 次，全都自动重试成功。VPS 选带快照的，升级翻车直接回滚，比从头装快得多。n8n 自建工作流的好处是没有执行次数上限，坏处是服务器得自己盯。\n\n## 总结\n\n自建 n8n 的账要算维护：一个月花 1 小时看日志、备份数据卷，换来数据不出内网。三步部署、写死加密密钥、n8n 定时触发配上去重，这条 n8n 自建工作流就能稳定跑一年。一年省下的 120 小时不是工具给的，是把抓取、摘要、入库、通知拆成可复跑的节点之后省出来的。","path":"articles/biz/04-n8n-self-hosted-workflow.md"},{"id":"biz-05-coze-customer-service-bot","title":"扣子 Coze 客服机器人：3 个意图够用","category":"biz","keywords":["扣子 Coze","客服机器人","扣子工作流"],"longtail":["扣子知识库问答","客服机器人兜底话术"],"tags":["扣子","客服","知识库"],"content":"去年大促前，我把店铺售前咨询接进扣子 Coze 的客服机器人：产品参数、库存价格、发货时效三个意图，知识库放 120 页产品文档，答不上来转人工。上线两周，机器人独立答完八成售前咨询，人工只处理退款和改地址。我们每天 600 次咨询，按专业版调用量算，一个月模型成本约 $12，比多请一个客服便宜太多。\n\n## 一、先砍成一个入口、三个意图\n\n第一步，在扣子新建 Bot，选客服场景模板，把欢迎语改成带三个按钮：查参数、问价格、问发货。第二步，知识库上传产品手册 PDF，按 800 字一段、重叠 100 字切片，上传后逐条检查解析结果。第三步，工作流里加意图识别节点，置信度低于 0.6 直接走兜底，不要硬答。\n\n意图别一次做十个。扣子 Coze 客服机器人的意图越多，识别越糊，三个意图覆盖八成的重复问题，剩下的用关键词规则兜。扣子工作流里可以把「查询库存」接成 HTTP 节点，实时库存就不会被知识库的旧数据带偏。\n\n## 二、知识库和兜底是两个坑\n\n避坑一，知识库。扫描版 PDF 没有文字层，上传后检索全空，先用 OCR 转一遍；产品价格一个月改两次，知识库不重建索引，机器人会报旧价，我固定每月 1 号和 16 号重建。避坑二，兜底。客服机器人兜底话术要明确写「这个我不能确认，帮您转人工」，别让模型自己编。上周有用户问能不能开发票，库里有但切片后没命中，机器人答了可以，实际只能开普票，用户拿着截图来投诉。避坑三，额度与并发。免费版并发低，活动开始十分钟就被打满，机器人直接不回复；专业版按 token 扣费，长文档问答一次消耗很大，超长会话要限制轮数。\n\n扣子知识库问答的命中率，我拿 50 个真实问题测，第一版 62%，补了 FAQ 和同义问法后到 84%。命中率的瓶颈在切片，不在模型版本。测试问题里一定要混入「我不知道」「你们老板是谁」这类越界问题，看它会不会乱答。\n\n## 三、接入和人工转接\n\n网页和公众号都能接，公众号要认证服务号，回调地址填扣子给的 webhook。转人工用人工客服节点，带上会话摘要，客服不用再问一遍。数据合规上，用户手机号别写进变量，订单截图让用户自己在客服系统里发。扣子 Coze 客服机器人的会话详情能查到问答记录，扣子知识库问答命中的段落会自动附上。\n\n## 总结\n\n扣子 Coze 客服机器人的收益不是无人客服，而是让重复问题不占人力。三个意图、一个知识库、一条兜底链路，两周就能上线；每月 $12 的模型成本、八成自动答完率，比堆人现实得多。上线后每周看一次未命中问题，补进 FAQ，比调模型参数有用；客服机器人兜底话术也按周迭代，把新出现的问法写进去。","path":"articles/biz/05-coze-customer-service-bot.md"},{"id":"biz-06-dify-knowledge-base-setup","title":"Dify 知识库 搭建：3 个参数涨 40%","category":"biz","keywords":["Dify 知识库","知识库搭建","Dify"],"longtail":["Dify 切片参数","Dify 知识库命中率"],"tags":["Dify","知识库","RAG"],"content":"新员工入职先私聊 HR 问年假、报销、社保，一天三十多条，HR 一半时间在复读制度。我把 200 份制度文档搬进自建 Dify，做成内部问答页，一个月后七成问题能自助。自建版软件免费，2 核 4G 服务器 $6/月；云版 Professional 约 $59/月，省掉运维但按消息额度计费。Dify 知识库搭建的难点不在部署，在切片和召回。\n\n## 一、文档先洗干净再上传\n\nDify 知识库搭建的第一步不是上传文件，是洗文档。第一步，PDF 扫描件先做 OCR 转成文字，制度文件里的「第二十条」这类条款号手工核对一遍。第二步，每份文档开头补 30 字摘要，写清标题和适用对象，索引时会一起带上。第三步，FAQ 用问答模式上传，两列：问题、答案；长文档用分段模式。200 份文档里 37 份是扫描件，OCR 后错字不少，不先改，召回再准答案也是错的。\n\nDify 知识库支持批量上传文件夹，但同名文件会覆盖，上传前把版本号写进文件名。制度类文档更新频繁，我按部门建了 6 个知识库，离职制度单独一个，别混在一起。\n\n## 二、三个参数：500、50、4\n\n分段设置里 chunk size 填 500、overlap 填 50；检索策略选混合检索，Top-K 设 4，score 阈值 0.5；embedding 模型选 bge-m3，中文比默认的 ada 稳。为什么是 500：800 字以上答案经常被截断，200 字以下一句话会被切成两半；50 的重叠保证条款跨段时还能接上。\n\n调 Dify 切片参数前后，我拿 100 个真实问题测命中：默认参数 52%，改成上面这组后 83%，提升最大的是混合检索那一步。Top-K 调到 8 以上，回答开始夹带无关段落，别贪多。\n\n## 三、三个坑\n\n避坑一，重建索引。切片参数改完必须重建索引，已有索引不动，检索还是旧切片；200 份文档重建约 8 分钟，模型费 $0.3 左右。避坑二，额度。云版按消息额度卖，一次提问可能触发多轮检索，50 人每天 300 次提问，Professional 额度一周就见底，量大反而自建划算。避坑三，合规。制度文件里有员工姓名和薪酬档位，上传云版前先把表格列删掉；自建也别把管理员账号发给所有人。\n\nDify 知识库命中率低的时候先看文档解析结果，别急着换模型，七成问题出在解析层。测试集要包含「我不知道」「你们领导是谁」这类越界问题，看它会不会编。Dify 切片参数不是越细越好，200 字以下切出来的片段语义不完整，回答容易断章取义；我试过 300 字，条款类问答准确率掉到六成。另外 Dify 知识库命中率高的前提是问题改写，用户问「年假怎么算」和文档里的「带薪年休假」不是一个词，开启查询改写能补一部分。\n\n## 总结\n\n两个月运行数据：日均提问 60 次，命中回答 76%，未命中的四分之一是「我的情况算不算」，本来就该转人工。Dify 知识库搭建的收益在自助率，不在炫技。三步走完：洗文档、定切片、建索引，再花一周测 100 个问题，命中率就稳了。","path":"articles/biz/06-dify-knowledge-base-setup.md"},{"id":"biz-07-gamma-presentation","title":"Gamma 演示文稿：20 页 8 分钟出稿","category":"biz","keywords":["Gamma 演示文稿","Gamma 导出 PPT","Gamma 积分"],"longtail":["Gamma 主题模板","Gamma 积分"],"tags":["Gamma","演示文稿","路演"],"content":"咨询公司的分析师一周要交两份 deck，以前从空白页搭 20 页要 6 小时。现在我用 Gamma 演示文稿功能，把三页大纲粘进去，8 分钟出初稿，剩下的时间全花在改数据上。订阅 Plus 套餐 $10/月，年付折 $8/月，含 400 积分/月，两份 20 页的稿子刚好够用。工具本身不复杂，坑都在导出和图表上。\n\n## 一、大纲只写三页\n\n第一页写结论：一句话加三个关键数字；第二页列 5 个章节标题，每页标题必须是一句判断，不是「市场分析」这种名词；第三页写数据来源和备注。Gamma 里选「粘贴文本」入口，生成 8 到 12 张卡片，主题选深色商务，语言切中文，20 页大约 8 分钟出完。标题写成判断句的好处是，生成出来的每页都在讲观点，不是套模板排词。\n\n大纲阶段别写大段文字，Gamma 会把它们塞进卡片挤成一团。章节分页用「---」分隔，比手动加页准。\n\n## 二、改稿只动三类地方\n\n数据、图表、结论句。Gamma 生成的数字经常是编的，图表要用 Excel 导出的 CSV 重新画；导出后图表是图片，双击改不了，要改只能回 Gamma。Gamma 主题模板换一次能全篇同步配色，逐页改会在第 10 页开始崩版。20 页里真正要手工调的大约 6 页，其余留模板原样。\n\n路演前必做三件事：把所有图表数字和底稿对一遍、删掉 AI 加的过渡页、导出时选可编辑的 PowerPoint 格式。\n\n## 三、积分和导出是两个坑\n\n避坑一，Gamma 积分。生成、重生成、换主题都扣积分，20 页重生成两次等于三倍消耗，Plus 的 400 积分两份 deck 就到顶，第三份要么等月初，要么升 Pro $20/月。避坑二，Gamma 导出 PPT 后中文字体被替换成系统默认，行距和换行错位，导出前在设置里指定字体，导出后在 PowerPoint 里统一替换一次。避坑三，合规。客户未公开的财务数据别贴进 Gamma 云端，云端生成默认留档；涉密稿子用本地大纲生成骨架，再把图表换成自己画的。\n\n免费版右下角带水印，付费后才去掉，对客户提案来说这笔钱不能省。有些活不适合 Gamma 演示文稿：预算精确到元的投标文件、带交互的财务模型、有严格品牌手册的提案。Gamma 导出 PPT 后版式会漂，Gamma 主题模板也只保证大致统一，字体和间距还得在 PowerPoint 里收一遍。我的分工是 Gamma 出结构和初稿，交付前留 30 分钟过母版。Gamma 积分按月清零，月底还剩 50 分以上说明套餐买大了，降回免费版先用着；一份稿子从大纲到能讲，真实耗时是 8 分钟生成加 40 分钟改，别信一键出片。\n\n## 总结\n\n一份 20 页 deck 从 6 小时压到 1.5 小时，每月 $10 的订阅换 20 多个小时，账很好算。Gamma 演示文稿适合结构固定、以观点为主的稿子，不适合需要精确排版的投标文件。记住两条：数据自己核，导出必检查字体。","path":"articles/biz/07-gamma-presentation.md"},{"id":"biz-08-excel-copilot-formula","title":"Excel Copilot 公式：4 句提问","category":"biz","keywords":["Excel Copilot","Copilot 公式","嵌套公式"],"longtail":["Excel Copilot 写公式","Copilot 解释公式"],"tags":["Excel","Copilot","公式"],"content":"财务月结有 12 个 sheet，多条件汇总靠三层 IF 嵌套，改一个口径要重算半小时，还得找写公式的老同事。公司上了 Microsoft 365 Copilot（$30/人/月）后，我把需求说成一句话让它写公式，再让它把旧公式逐层解释，月结整理从 3 小时压到 40 分钟。Excel Copilot 公式能力不弱，前提是提问别偷懒。\n\n## 一、提问带齐三要素\n\n区域、条件、输出位置，一样不能少。我常用的句式是：在 Sheet1!A1:F500 里，按 B 列部门等于「华东」、E 列月份等于「2026-01」汇总 F 列金额，用 SUMIFS 写到 H2，金额保留两位小数。三要素缺一个，它就开始猜，猜出来的引用区域十次有两次是错的。\n\n先让它用最简单的函数，跑通再要求优化。一上来就要「用 LET 和 LAMBDA 写动态数组」，输出看着高级，旧版 Excel 打不开。\n\n## 二、让 Copilot 解释旧公式\n\n选中那个三层嵌套的单元格，让 Copilot 解释公式：按计算顺序逐层说明，指出哪一层可能返回错误，它会输出每一层的条件和结果类型。这一步比我预期有用：我表里一个 VLOOKUP 的第四参数漏写，一直返回近似匹配，解释一遍才看出来。\n\n接着让它改写成 LET 版本，每段给一个变量名，可读性提升明显。让 Copilot 解释公式这一步，也顺带验证了 Excel Copilot 公式生成的质量。注意 LET 要求 Excel 365 或 2021 以上，同事用旧版会看到 #NAME?，共享前确认全员版本。\n\n## 三、四个坑\n\n避坑一，数据范围。Copilot 只能读当前打开的工作簿和选中区域，引用关闭的工作簿会直接给 #REF!；跨表汇总先把源表打开，或者用 Power Query 合并。避坑二，函数名。中文界面里 XLOOKUP 显示的也是 XLOOKUP，但复制进 VBA 要换成英文写法，混用会编译报错。避坑三，引用方式。它默认给相对引用，往下拖一行就错位，追问一句「改成绝对引用」再复制。避坑四，合规。企业版 Copilot 按文件权限读数据，但薪酬、身份证列最好先隐藏，提问时别把整行内容贴进对话框。\n\n生成的公式一定要拿 3 行已知答案的数据验证，别直接套全表。错了再回滚，比一开始就验证费时间。每月都要用的公式，我会让 Excel Copilot 写公式一次后存进公式库：区域用命名范围，条件用单元格引用，下次只改两个参数。公式库加一列用途说明，新人搜关键词就能找到。沉淀之后，我一周真正需要让 Excel Copilot 写公式的次数从 20 次降到 6 次；Copilot 解释公式这种一次性任务也少了。表格改口径时先改命名范围，所有引用一起更新，比逐个单元格改安全。\n\n## 总结\n\nExcel Copilot 公式真正的价值是省掉「搜函数用法」和「找同事帮忙」这两步，每月 $30 适合每天都要处理表格的岗位，一个月用不到十次就不划算。提问写清区域、条件、输出位置，生成的公式先验证再套用，这两条做到，嵌套公式不再是门槛。","path":"articles/biz/08-excel-copilot-formula.md"},{"id":"biz-09-survey-ai-analysis","title":"问卷 AI 分析：300 份 2 小时出结论","category":"biz","keywords":["问卷 AI 分析","开放题编码","问卷交叉分析"],"longtail":["开放题 AI 编码","问卷数据脱敏"],"tags":["问卷","数据分析","用户研究"],"content":"教育机构每季度收 300 份家长问卷，其中 87 条是开放题，以前人工编码要一整天，还容易前后标准不一。现在用 ChatGPT Plus（$20/月）跑三步提示词，2 小时出完整结论，交叉分析也能出。问卷 AI 分析的关键不是模型，是把编码规则和脱敏做在前面。\n\n## 一、上传前先脱敏\n\n开放题里常混着手机号、孩子姓名、具体校区，这些列全部删掉，姓名替换成编号，机构名替换成 A、B、C。导出 CSV 只留四列：编号、年级、满意度、开放题原文。问卷数据脱敏的底线是「最小必要」，做问卷 AI 分析时能不给模型的字段就不给。\n\n脱敏后再检查一遍：有些家长会在回答里主动写「我孩子在三年级二班」，这类文本要手工替换成年级。用 grep 搜「班」「老师」「电话」能抓出大半。\n\n## 二、三步提示词\n\n第一步，编码：给 87 条回答打标签，输出 6 到 8 个类别，每条附一句归类理由，禁止输出原文。第二步，统计：按类别计数、给占比，再做「年级 × 满意度」的问卷交叉分析，样本少于 30 的分组标注「仅供参考」。第三步，写结论：每条结论必须带数字和分组，不许写「大部分家长认为」这种没有出处的句子。\n\n开放题 AI 编码的一致性，我抽 20 条人工复核，17 条一致，3 条分歧写进编码手册再跑第二遍。编码手册要提前定：比如「还行吧」算中性，不算满意。\n\n## 三、四个坑\n\n避坑一，隐私。问卷原文直接丢进公开模型再截图发群，等于二次泄露；结论里引用原话要改写并去掉可识别信息。避坑二，样本偏差。满意度 4.2 分看着漂亮，但回收集中在重点班，结论必须写清样本身份结构，否则误导决策。避坑三，中性回答被误判。AI 倾向把含糊回答归到正面或负面，编码手册里要给中性留一类。避坑四，百分比加总。四舍五入后各类占比加起来 101%，统一保留一位小数并注明。\n\n另外，让 AI 顺便输出「未提及但值得关注」的三条线索，通常比正面结论更有用。季度问卷重复问同样的问题，我把三步提示词存成模板：编码手册、交叉维度、结论格式。下一季度只换 CSV，2 小时能压到 50 分钟。开放题 AI 编码的类别保持稳定，才能看出诉求怎么变；每季重来一次，趋势就断了。问卷数据脱敏我写成四项检查表：删手机号列、删 IP 列、替换机构名、替换班级名，四项打勾再上传。\n\n## 总结\n\n原来一天的工作压到 2 小时，成本 $20/月，还顺手把编码标准统一了。问卷 AI 分析适合开放题编码和交叉分析，不适合替代抽样设计。流程就三步：脱敏、编码、出结论，每步都留人工抽检，报告才敢往外发。","path":"articles/biz/09-survey-ai-analysis.md"},{"id":"biz-10-contract-ai-review-risk","title":"合同 AI 审查 风险：5 条红线标完","category":"biz","keywords":["合同 AI 审查","合同风险","AI 合同初审"],"longtail":["合同红线条款","合同 AI 初审"],"tags":["合同","法务","风控"],"content":"采购合同每月 20 份，平均 8 页，法务逐份看到 40 分钟，旺季直接卡住。我把合同 AI 审查做成初筛：固定 5 类红线条款，模型逐段标出位置和原文，法务只复核标红处，一份合同 3 分钟标完、20 分钟复核完。模型走私有化部署，约 $25/人/月，合同不出内网。做合同 AI 初审之前，先把红线清单写死，比选模型重要得多。\n\n## 一、红线清单先写死\n\n五类必须标：付款账期超过 60 天、违约金比例高于合同额 20%、争议管辖地不在我方所在地、单方解除权、知识产权归对方。Prompt 固定成表格输出：条款号、原文摘录、风险等级、建议改法。等级只分红黄绿三档，别让模型自由发挥写小作文。合同风险条款的判定标准每家公司不同，清单要跟法务过一遍再上线。\n\n## 二、分段喂，别整份贴\n\n8 页合同按定义、付款、违约、保密、争议解决切 5 段，逐段审。整份贴进去，模型对中后部条款的注意力明显下降，实测漏掉违约条款的概率高。要求它每条都引用原文，复核时按条款号定位。扫描件先 OCR，手写补充条款单独拎出来人工看。\n\n30 份合同跑下来，模型标出的红线条款法务认可 82%，剩下 18% 是误报，比如对方是央企账期长但可接受。误报可以忍，漏报一次就是几十万。\n\n## 三、四个坑\n\n避坑一，保密。未签 NDA 前别把合同全文发公有云模型；走私有化部署或签了数据处理协议的服务，敏感行业直接本地跑。避坑二，漏审。附件里的报价单、SOW 经常不在正文里，模型看不到，得单独上传；手写补充条款OCR 识别率低，一律人工。避坑三，法条过时。模型引用的法规版本可能落后一两年，结论必须由法务确认，AI 只标风险，不给法律意见。避坑四，版本。合同改到第三轮，AI 审的还是旧版，文件名带 v1、v2 也会混，审之前先确认版本号。\n\n另外，合同 AI 初审的输出只保留风险项，别把整篇标得花花绿绿，法务看不出重点。合同红线条款不是拍脑袋定的，我按过去两年被判赔的 6 个案子反推：付款节点、验收标准、违约金上限、管辖地、知识产权、保密期限，六类里挑五类做成合同红线条款。每季度复盘一次误报，误报多的条款降级，漏报多的升级。AI 合同初审的结果要进合同台账，同一供应商第二次合作直接对比上次改法，复核还能再砍一半时间，整套合同 AI 审查流程才算跑顺。\n\n## 总结\n\n每月 20 份乘 20 分钟，等于省下 6.7 小时，$25/人/月一个月就回本。合同 AI 审查是筛子，不是签字人；红线条款清单、分段审、人工复核，三步缺一不可。审完的结论要落进合同管理系统，下次同类条款才能复用。","path":"articles/biz/10-contract-ai-review-risk.md"},{"id":"biz-11-recruiting-jd-generation","title":"招聘 JD 生成：1 份岗位 3 版文案","category":"biz","keywords":["招聘 JD","JD 生成","岗位画像"],"longtail":["JD 结构化模板","招聘 JD 合规"],"tags":["招聘","JD","HR"],"content":"小公司 HR 一个人管 10 个岗位，写 JD 要跟业务对需求、改渠道版本、还得防着违规词，以前一个月 4 小时全耗在这。现在用 ChatGPT Plus（$20/月）加固定模板，50 分钟出三个渠道版本，投递量还涨了三成五。招聘 JD 生成不难，难的是别把合规风险顺手写进去。\n\n## 一、先做岗位画像\n\n让业务填五项：核心任务 3 条、硬性技能 3 条、可培养项 2 条、团队规模、汇报对象。把这五项喂给模型，输出一份结构化 JD：岗位名、一句话定位、职责 5 条（动词开头）、要求 5 条（分必须和加分）。JD 结构化模板固定之后，10 个岗位写起来是填空，不是创作，业务改需求也不用重写。\n\n岗位画像里最容易被跳过的是「可培养项」，写清楚哪些技能可以入职后学，能扩大候选人池。\n\n## 二、一稿改三版\n\n同一份结构化 JD 让模型改三版：Boss 直聘版口语、带薪资范围；猎聘版专业、突出行业；内推版短、加团队亮点。每版控制在 300 字以内，手机一屏能看完。招聘 JD 生成的效率就在这一步，手工改三个渠道等于写三遍。\n\n改版时提醒模型别动岗位名和核心要求，只调整语气和信息密度，不然三个版本会互相矛盾。\n\n## 三、四个坑\n\n避坑一，歧视性用词。性别、年龄、婚育、户籍、身高一律不写，「限男性」「35 岁以下」会被平台下架甚至投诉；生成后跑一遍检查，把「形象气质佳」「能抗压」也删掉。避坑二，薪资合规。公开渠道写「月薪 8-15K」要跟实际发放一致，虚标被举报要整改；内推版可以写区间，公开渠道按当地要求来。避坑三，关键词堆砌。把十个技术栈全塞进标题，平台判定低质降权，反而没曝光。避坑四，占位句。AI 爱写「负责其他相关工作」，面试时会被追问，直接删掉。\n\n招聘 JD 合规我做成一张 12 个词的过滤表，每次生成后自动扫一遍，三个月拦下 7 处违规表述。投递量提升还有一个原因：JD 里加了「面试流程 3 天给反馈」，比堆福利有用。JD 改完别只看投递量，我每周记三个数：投递量、简历匹配率、面试到场率。投递量涨但匹配率跌，说明 JD 写得太宽；到场率低，说明薪资区间写虚了。招聘 JD 合规检查表再加一项：同一岗位挂三个渠道，薪资区间必须一致。JD 结构化模板每季度改一次，把高频被问的问题补进岗位说明，面试邀约通过率能从六成到八成。\n\n## 总结\n\n10 个岗位从 4 小时压到 50 分钟，$20/月的订阅费可以忽略。招聘 JD 生成的正确姿势是：画像先结构化、一稿改三版、违规词过筛。别让 AI 自由发挥公司介绍，那部分它写不出你的真话，交给人补两句就行。","path":"articles/biz/11-recruiting-jd-generation.md"},{"id":"biz-12-ecommerce-customer-service-scripts","title":"电商 客服 话术库：40 条场景降差评","category":"biz","keywords":["电商客服话术库","客服话术","差评安抚"],"longtail":["客服话术库搭建","差评安抚话术"],"tags":["电商","客服","话术"],"content":"女装店铺日咨询 800 条，3 个客服轮班，同一个问题三种答法，客户体验飘忽。我把高频场景整理成 40 条话术，用 ChatGPT Plus（$20/月）生成变体和违禁词检查，一个月后平均响应从 45 秒降到 18 秒，差评率从 1.8% 降到 0.9%。电商客服话术库拼的不是辞藻，是场景覆盖和版本统一。\n\n## 一、先数场景，再写话术\n\n拉 30 天聊天记录按问题聚类，前 6 类占八成：发货时间、尺码建议、质量问题、退换货、优惠券、发票。每类拆 6 到 8 个具体场景，凑成 40 条。客服话术库搭建的顺序是场景、标准答法、变体，不是先让 AI 写 100 条再挑，那样挑出来的话术跟真实问题对不上。\n\n标准答法找人写第一版，客服主管过一遍，再让 AI 扩写变体，质量才稳。\n\n## 二、每条话术三个版本\n\n标准版给文字客服，口语版给移动端，安抚版给已经不满的客户。差评安抚话术单独一组：先承认问题、再给方案、最后给时限，别用「请您理解」开头。AI 生成变体时给约束：不超过 60 字、不用感叹号、称呼统一用「您」。\n\n电商客服话术库按场景分三级目录，客服搜关键词能两秒定位，比翻聊天记录快。\n\n## 三、四个坑\n\n避坑一，违禁词。「最」「第一」「全网最低」「绝对」在广告法里都是雷，平台抽检会下架商品；话术库上线前用词表扫一遍，AI 生成后再扫一遍。避坑二，承诺越权。客服不能随口答应赔付、补发、延保，话术里写清「需主管确认」的边界，否则一个月能把利润赔光。避坑三，AI 味。满屏「亲亲」「么么哒」反而招投诉，模板里删掉语气词，保留一个问题一句回答。避坑四，版本失控。40 条话术改五轮后，新人和老人用的不是同一版，用共享表格加版本号，每周同步一次。\n\n上线第二周遇到一批面料起球投诉，差评安抚话术统一给「全额退加 10 元券」，客诉升级率从 12% 降到 4%。这套话术后来被平台客服借去当模板。话术库写完不接系统等于没用。我们把它做成客服系统的快捷回复分组，40 条话术按场景编码，客服输入斜杠加关键词两秒调出；AI 生成的变体每周人工挑三条替换旧版。客服话术库搭建到这一步才算闭环：话术在库、入口在手、每周有更新。新客服培训从两周缩到三天；差评安抚话术单独设权限，只给主管和售后组，避免新人乱承诺。版本号写在分组名后面，一眼看出谁还在用旧版。\n\n## 总结\n\n一个客服每天省 40 分钟找话术，三个人一个月省 60 小时，$20/月的工具费可以忽略。电商客服话术库不是写得多，是场景全、版本统一、边界清楚。每周把新问题补进去，话术库才活得下去。","path":"articles/biz/12-ecommerce-customer-service-scripts.md"},{"id":"biz-13-meeting-minutes-auto-distribution","title":"会议纪要 自动 分发：3 步配置 5 分钟到位","category":"biz","keywords":["会议纪要","会议纪要自动分发","会议待办"],"longtail":["会议待办自动分派","会议纪要模板"],"tags":["会议","纪要","自动化"],"content":"每周 9 场会，以前行政整理录音、写纪要、一个个发待办，一场 2 小时，还经常漏人。现在用飞书妙记录音转写加自动化：录音转文字、AI 按模板生成纪要、待办自动建任务并 @ 到人，散会 5 分钟纪要就进群。Lark Pro $12/人/月，行政这块人力省了一半。会议纪要自动分发的前提不是工具，是模板先定死。\n\n## 一、模板先定死\n\n纪要只留三段：结论、决议、待办。待办必须带三要素：做什么、谁负责、什么时候截止，缺一项就不进任务系统。会议纪要模板用飞书文档建，AI 按字段填充，格式不乱。以前纪要写得像会议实录，老板翻三页找不到结论，现在第一屏就是结论。\n\n模板里加一条规则：没有结论的议题标「待定」，附下次讨论时间，别让讨论稿混进决议。\n\n## 二、三步配置\n\n会议纪要自动分发这套配置，最花时间的是调提示词。第一步，妙记录音转写，开启说话人分离，会后 2 分钟出文字稿。第二步，把文字稿丢给 AI，提示词指定按模板输出，待办部分用表格，每行三个字段。第三步，自动化解析表格，按负责人建飞书任务，截止日期写进任务字段，同时把纪要链接发到会议群。会议待办自动分派的关键在最后一步：参会人自动带上，非参会人只发自己名下的待办，别整份纪要群发。\n\n三步里最容易出错的是第二步，文字稿里的「我们」是谁，AI 分不清，提示词里要给它参会名单和对应部门。录音转写错字多发生在专业词上，会前把项目名、产品名建个热词表，识别率能从八成到九成五。会议纪要里的决议要和待办一一对应，决了不办是常态，列表里勾掉一项才算完。分发的版本留一份只读归档，谁改过纪要能查。\n\n## 三、四个坑\n\n避坑一，合规。录音前必须全员同意，跨公司会议尤其要问；薪酬、并购、法务类会议别用第三方转写，纪要留档也要限权限。避坑二，说话人错。两人声音接近时转写会把人名配错，待办就派给错的人，上线第一个月每周都有 1 到 2 处，我加了一步「负责人确认」再建任务。避坑三，任务归属。AI 会从讨论里抓出「我们下周看看」这种非承诺句，生成一堆假待办，提示词里限定只抓明确动词加人名。避坑四，权限。纪要在云文档里默认继承文件夹权限，外部参会人拿到链接会看到内部讨论，发之前检查共享范围。\n\n## 总结\n\n一场会从 2 小时压到 15 分钟，一周 9 场就是 15 个小时，$12/人/月配好模板和自动化，行政从会后整理变成会前定议程。会议纪要自动分发的边界很清楚：会议纪要模板能统一，会议待办自动分派能跑通，但录音合规和负责人确认必须人工把关。","path":"articles/biz/13-meeting-minutes-auto-distribution.md"},{"id":"biz-14-financial-report-analysis","title":"财务报表 解读：3 张表 12 个指标讲清","category":"biz","keywords":["财务报表解读","三表勾稽","经营分析"],"longtail":["三表勾稽分析","财务指标同比"],"tags":["财务","报表","经营分析"],"content":"月度经营分析会前，财务要把三张表拆成 12 个指标，写一页给老板的解读，以前 3 小时。现在用 Excel Copilot（$30/人/月）算指标、让模型写解读初稿，40 分钟收工。财务报表解读最大的风险是算术，数字必须先在 Excel 里算准，再让模型组织语言，顺序反了就等着挨骂。\n\n## 一、先算数，再让 AI 说话\n\n12 个指标固定下来：营收、毛利率、净利率、经营现金流、应收周转天数、存货周转天数、资产负债率、有息负债、销售费用率、管理费用率、研发费用率、合同负债。这些全部在 Excel 里用公式算完，导出一张「指标、本月、上月、去年同期、同比」的表，再交给模型写文字。\n\n三表勾稽分析先做一遍：净利润和经营现金流差额超过 30% 要单独解释，应收增速超过营收增速 10 个点要标出来。财务指标同比别只看总数，也要按产品线拆，不然增长来自哪里说不清。\n\n## 二、解读按三段写\n\n第一段结论，只写三个最重要的变化，每个带数字和原因假设。第二段异常，波动超过 15% 的指标逐条说明。第三段建议，不超过三条，要能落成动作。让模型输出时加一条硬约束：不许出现没有数字的形容词。\n\n财务报表解读给老板的版本控制在 500 字以内，异常项附一页明细，会上直接翻。\n\n## 三、四个坑\n\n避坑一，算术。模型做加减乘除经常错，尤其是百分比和千分位，所有数字必须由 Excel 出，AI 只负责解释。避坑二，口径。含税与不含税、合并与母公司、本期与累计，口径不一致会让结论完全反掉；提示词里写明口径，表格列名带上「不含税」。避坑三，一次性收益。政府补助、资产处置收益会被 AI 说成主营增长，喂数据时单独标注「非经常性损益」。避坑四，合规。客户名、员工薪酬、未披露的并购信息不要贴进外部模型；用企业版工具，或者先把敏感列脱敏。\n\n另外，AI 喜欢把「同比下降」写成「有所承压」，这种话老板听腻了，直接写降了多少、为什么降。给老板的一页纸只留 5 个数：营收、毛利率、经营现金流、应收周转、有息负债，每个数后面跟一句原因。给业务部门的版本拆到产品线，财务指标同比要带量价拆分。两个版本共用一张底表，别各算各的，口径分叉会让会议先吵半小时对账。三表勾稽分析每月固定 3 号前做完，异常项附一页明细。\n\n## 总结\n\n40 分钟对 3 小时，一个月省 2 小时以上，$30/人/月的成本对财务岗不算高。财务报表解读的正确分工是 Excel 算数、AI 写话、人下判断。三表勾稽和同比先做完，再让模型润色，结论才站得住。","path":"articles/biz/14-financial-report-analysis.md"},{"id":"chat-01-chatgpt-4o-voice-english-speaking","title":"ChatGPT 4o 语音对话 练英语口语实测","category":"chat","keywords":["ChatGPT 4o 语音对话","练英语口语","AI 口语陪练"],"longtail":["ChatGPT 语音练口语","语音对话纠音"],"tags":["语音对话","英语口语","口语陪练"],"content":"我拿 ChatGPT 4o 语音对话练英语口语，起因是出差点咖啡时卡在 no foam 上。三个月里每天 20 分钟、连续 15 天算一轮，手机录音里我一句话的停顿从 8 次降到 2 次。这套用 ChatGPT 语音练口语的流程不背单词，只做三件事：钉死场景、逼它纠错、每周留档。\n\n## 先把 15 天场景钉死\n打开手机 App，点底部中间的语音图标，那就是 ChatGPT 4o 语音对话的入口。第一步把 15 天拆成五个场景：点单、问路、会议开场、电话改约、退换货，每个场景 3 天。第二步每个场景写死 10 个必须说出口的句子，按开场、问答、收尾三类排好，点单要交代杯型、奶类、温度，写不出来当场查。第三步第一遍照着稿说，第二遍合上手机复述，卡住就用语音问它这句该怎么接。第四步每轮结束录一段 1 分钟自述，第二天回放，专挑昨天卡住的那两句重说。免费账号每天语音额度大约 15 分钟，付费会员更长，20 分钟一轮刚好，超过 40 分钟嗓子先累，流利度反而下降。\n\n## 让它纠错，别让它捧场\n语音模式默认像个热情陪聊，你说错它顺着猜。想用 ChatGPT 语音练口语见效，就得先改它的行为。我固定的开场白是：Listen, do not guess. If I am unclear, tell me what you heard, then correct me in three lines: grammar, a more natural phrase, one follow-up question。这样三轮下来，它会把 I go to home 改成 I go home，把 very good 换成 solid。这套语音对话纠音的关键是每次只纠一个错，一口气列五条根本记不住；语速保持正常，别让它放慢等你。第 7 天我把提示词存进备忘录，省得每轮重打。第 10 天我加了一段角色戏：你扮演店员，我问三遍价格你就涨一次，看我能不能听出差别。它演得比预期好，我被临时加价问懵过一次，回放才发现是数字没听清。练完把它的三行纠正抄进表格，错误按介词、时态、数字听辨分类，两周后回看，介词错占了将近一半。\n\n## 三个容易踩的坑\n一是沉默十几秒，系统会认为你说完直接抢答，想句子时先垫一句 well 或 let me think。二是别指望它给发音打分，语音对话纠音只能靠回听，口音它只会模仿不会评估，要分数得另找评测口径。三是中文提问它就用中文回答，练口语要全程英文，连纠错也让它用英文说。四是网络抖一下语音就断，地铁里练基本白练。另外转写会留在聊天记录里，公司内部信息别对着它念。\n\n## 总结\n跑完三轮，我最大的变化是不怕开口，语法错误仍在，但卡壳明显变少。想复现的话，ChatGPT 4o 语音对话练英语口语就按这个顺序：先写场景句子，再用提示词逼它纠错，最后每周把错句抄进表格。这类 AI 口语陪练适合把知道练成说得出，不适合从零背单词，这两个场景别混。真要说瓶颈，是我自己的词汇量，工具只负责把词逼出来。","path":"articles/chat/01-chatgpt-4o-voice-english-speaking.md"},{"id":"chat-02-claude-37-sonnet-long-document-summary","title":"Claude 3.7 Sonnet 长文档总结法","category":"chat","keywords":["Claude 3.7 Sonnet","长文档总结","长上下文"],"longtail":["长文档总结提示词","200K 上下文总结"],"tags":["长文档","文档总结","合同审阅"],"content":"我上周要在一份 300 页的融资材料里找风险点，材料是 120 页投资协议加 180 页附件，用 Claude 3.7 Sonnet 做长文档总结，前后两小时出结果，比人工通读快了近一天。真正好用的不是一次性塞进去，而是把它当成需要分轮次的读者：先画地图，再抠细节，最后让它标页码。\n\n## 先让它画文档地图\n上传前先把扫描件统一转成有文字层的 PDF，单份别超过 30MB，超过就按章拆开。第一条消息只做一件事：让它列目录和页码，比如用表格输出每章标题、起止页、一句话摘要，不要总结内容。我拿到的结果是 9 章、286 页，一眼就看出第 4 章违约条款最厚，第 7 章附件全是表格。第二条消息再问单章，别急着让它通读全文，Claude 3.7 Sonnet 的长上下文是 20 万 token，约 15 万汉字，用 200K 上下文总结 300 页材料会占掉大半配额，留不出思考空间。章节表先拿到手，后面每次提问都带上章节号，它能稳不少。\n\n## 用标签和页码约束输出\n我的长文档总结提示词模板是这样：用标签框住第 4 章，请只输出风险清单，每条格式为页码、条款编号、风险、建议改法四栏，最多 15 条，不要解释。这个格式很关键，页码让它不敢编，条款编号方便我回原文核对。结果是 12 条风险里有 3 条是我人工漏掉的：付款节点没有逾期利息、争议解决地在外地、验收标准只有一句话。长文档总结最怕中间失忆，所以我习惯把最重要的两章放在最后一次提问，而不是第一次。核对时按它给的页码翻原文，命中率八成以上，剩下两成多半是它把相邻条款混在了一起。想要更稳，可以在提示词里加一句：不确定的条目单独列在末尾标存疑，不要硬编。\n\n## 三个坑\n一是扫描版 PDF 没有文字层，它读出来是空页或乱码，先跑一遍 OCR 再传。二是它默认爱写总结长文，内容一多就容易漏掉后半部分，务必限制条数和格式。三是它会在结尾补一句不构成法律意见，这段别删，但也不能当免责挡箭牌，条款要自己回原文核。另外扩展思考开着更准但更慢，赶时间就关掉；对话超过十几轮后它容易忘掉前面的约束，新对话记得把长文档总结提示词模板和章节表再贴一遍。传文件时一次别超过三份，附件里的图片表格它读得很勉强。200K 上下文总结不是越长越好，超过八成的上下文占用后，条款间的交叉引用就开始丢。\n\n## 总结\n这套流程我固定成三步：画地图、单章抠细节、按页码交叉核对。Claude 3.7 Sonnet 的长文档总结强在能同时抓住 300 页里的散点，弱在不会替你担责。文档越长，越要把它当检索员而不是律师。下次做尽调，我会先跑一轮机器清单，再带着问题翻原文，顺序不能反。","path":"articles/chat/02-claude-37-sonnet-long-document-summary.md"},{"id":"chat-03-deepseek-r1-local-deployment-vram","title":"DeepSeek R1 本地部署 显存要求实录","category":"chat","keywords":["DeepSeek R1","本地部署","显存要求"],"longtail":["R1 显存对照表","Ollama 部署 R1"],"tags":["本地部署","显存","推理"],"content":"我在一台 4060 Ti 16G 加 32G 内存的机器上折腾 DeepSeek R1 本地部署，前后试了 7B、14B、32B 三个规格，结论先说：4bit 量化下，显存要求大致是参数量的 0.6 到 0.7 倍。7B 约 5G，14B 约 10G，32B 约 22G，70B 要 43G 左右，官方 671B 满血版就别想单机了。别急着买卡，先用手头的机器跑一遍再决定。测试方法很土：用 nvidia-smi 看显存占用，用 ollama run --verbose 看每秒 token 数，同一批提示词跑三遍取中位数。\n\n## 从 Ollama 开始，先跑 14B\nOllama 部署 R1 是最省事的路径：装好客户端，一行命令 ollama run deepseek-r1:14b，默认拉 Q4_K_M 量化，下载约 9G。跑起来先用 ollama ps 看显存占用，14B 在 16G 卡上占 10G 出头，剩下几 G 留给上下文。想省显存就把上下文压到 4K 以内，想跑长文换 Q4_K_S 或直接上 32B。拉模型时可以先用 deepseek-r1:7b 试水，下载 5G，跑顺了再换大的；每个量化版本在 Ollama 里就是一个标签，切换只需改冒号后的后缀。Windows 和 macOS 都有一键安装包，Linux 用一行 curl 脚本，装完先 ollama list 确认模型在列表里。下载前确认磁盘留两倍空间，14B 的权重 9G，加上缓存，40G 的盘会告急。32B 版本 4090 24G 能勉强跑，但上下文给到 8K 就开始掉速，首 token 要等三四秒；70B 用 Q4 要双卡，单卡 24G 只能 CPU 卸载，速度掉到 3 到 5 token 每秒，基本只能当玩具。\n\n## 数字要按场景看\n我的实测：14B 写 800 字产品说明约 40 秒，平均 18 token 每秒；32B 同样任务 90 秒但术语准确率高一些；同一道鸡兔同笼，70B 蒸馏版做对了，7B 版本算错两次，14B 一次对一次错。速度上 7B 在 16G 卡能到 35 token 每秒，14B 18 左右，32B 只有 9，一上长上下文全部腰斩。KV 缓存按上下文线性涨，14B 每 1K 上下文大约多占 100M 显存，32K 就是 3G 多，超出显存就自动卸载到内存，32G 内存跑 32B 长上下文会明显卡顿。在 16G 卡上把 32B 跑起来，本质是拿内存换速度，任务一大就排队等显存，想快只能降规格。上面这组数字就是我的 R1 显存对照表，买卡前先对一眼，比看跑分有用。\n\n## 三个坑\n一是 671B 满血版权重加显存要 700G 以上，普通主机不可能，网上说家用机跑满血 R1 的多是标题党。二是 Ollama 部署 R1 时默认上下文只有 2K 左右，不显式传 num_ctx 时超过的部分会被静默截断，长文总结缺章少节九成是这个问题。三是默认 Q4 量化会轻微掉精度，做合同条款、财务数字这类任务建议 Q5 或 Q6，显存不够就换小规格。另外模型动辄 9G 到 40G，pull 断了不续传，网络不稳就先下 GGUF 再导入；DeepSeek R1 的思考过程会输出一大段推理，token 消耗是普通模型的两三倍，按次计费的接口要先算成本。最后提醒一句，笔记本的 16G 显存和台式机不是一回事，功耗墙一压，速度直接少一半。\n\n## 总结\nDeepSeek R1 本地部署的显存要求可以按 4bit 量化记忆：14B 看 10G、32B 看 22G、70B 看 43G。家用首选 14B，预算够上 32B，别信满血版能塞进消费级显卡。先量显存，再选规格，最后才谈效果。另外 R1 的强项是推理，写创意文案反而不如普通模型听话，别拿它包打天下。买卡前把 R1 显存对照表存进手机，装机时对着看，少走弯路。","path":"articles/chat/03-deepseek-r1-local-deployment-vram.md"},{"id":"chat-04-kimi-long-text-contract-review","title":"Kimi 长文本 合同审查实操与模板","category":"chat","keywords":["Kimi 长文本","合同审查","AI 合同审阅"],"longtail":["Kimi 审查采购合同","Kimi 合同风险清单"],"tags":["合同审查","长文本","法务"],"content":"我帮朋友看过一份 60 页的采购合同，配套还有报价单和验收标准两份附件，用 Kimi 长文本做合同审查，从上传到出第一版 Kimi 合同风险清单 18 分钟，最后人工复核改了 4 处。核心不是让它看看有没有问题，而是给它一张固定清单，让它逐条对照。\n\n## 三轮提问法\n网页版对话框直接把 PDF 和 Word 拖进去，超过百兆的文件先拆，扫描件要确认有文字层。第一轮先要结构：让它列出合同章节、页码、每章一句话内容，确认它确实读完了，而不是凭开头猜。第二轮按清单查，我的提示词是：请按主体资质、标的与验收、付款节点、违约责任、知识产权、保密、争议解决、合同解除八项逐条核查，输出表格，每项标注有、无、模糊，模糊的必须引用原文。第三轮让它把有问题的条款改写成建议条款，只说改法，不要动原文。每轮只回答一类问题，不要重复上一轮内容，否则它会从头复述清单。60 页合同加两份附件一次喂进去，第一轮 2 分钟、第二轮 6 分钟、第三轮 8 分钟，第三条最耗时间，也最值钱。这套流程用来 Kimi 审查采购合同，比问到哪查哪稳得多。\n\n## 它实际抓到了什么\n20 条风险里我认为值钱的有 6 条：验收标准只写符合国家标准，没有具体参数；30% 预付没有和交付节点挂钩；违约金按日万分之五没设上限；争议解决写的是对方所在地仲裁；保密条款没有期限；解除条件只给了单方权利。另外 14 条是重复或过度保守，我删掉了。Kimi 长文本的审查准确率跟清单颗粒度直接相关，清单越具体，废话越少。八项清单里主体资质最容易漏，营业执照的经营范围和合同标的经常对不上。相邻条款的交叉引用它也会漏，比如第 3 章说验收看附件二，附件二里其实没写标准，这种得人工串一遍。\n\n## 四个坑\n一是别问开放式问题，这份合同有什么风险，会得到一堆正确的废话。二是扫描件里的手写批注和骑缝章它看不到，涉及签章页要人工翻。三是它会补法条，我核过两条引用，有一条张冠李戴，法条必须自己查。四是公司合同先脱敏，把金额、公司名替换掉再上传，公开模型不等于走完保密流程。免费额度有次数限制，同一份合同反复追问容易被限流，重要合同一次问清楚。\n\n## 总结\nKimi 长文本做合同审查的定位是初筛：把 60 页压成 20 条候选，再由人做最终判断。这份 Kimi 合同风险清单可以固定复用，清单按合同类型换。它能省的是一遍通读，不是法务责任。下次 Kimi 审查采购合同，我会先跑清单，再拿红笔在纸质合同上圈一遍，机器筛完人再签。AI 合同审阅的边界要清楚：它列风险，不签字。","path":"articles/chat/04-kimi-long-text-contract-review.md"},{"id":"chat-05-doubao-voice-clone-cs-scripts","title":"豆包 语音克隆 客服话术 4 个细节","category":"chat","keywords":["豆包 语音克隆","客服话术","AI 语音客服"],"longtail":["豆包声音复刻","客服话术生成"],"tags":["语音克隆","客服","话术"],"content":"客服组去年想把常见问题做成口播视频，真人一条一条录要两天，我改用豆包语音克隆，三十秒素材加二十条话术，一个下午出了十八条成片。音色不像本人，但足够清楚，客服话术本来也不要求像主播，AI 语音客服更是如此。\n\n## 先录三十秒干净素材\n豆包语音克隆对素材的要求就三条：安静、清晰、别念稿。第一步找一间没有空调声的会议室，手机离嘴二十厘米，念一段自己熟的内容，念稿容易僵。第二步录满三十秒，中间别停顿超过一秒，采样尽量十六千赫兹以上，格式用 wav 或 mp3。第三步打开豆包 App，进豆包声音复刻页面，上传后等一到两分钟审核。我第一次用笔记本外放录，复刻出来像电话里的机器人，换成手机贴麦重录才正常。素材里最好带一点自然的换气和停顿，全是标准播音腔反而假。同一段素材可以反复用，但每次换话术类型，最好重新听一遍开头三秒，破音就该重录。\n\n## 话术要写成能念的句子\n客服话术不能直接粘常见问题原文，七天无理由这种书面短语念出来别扭。我把二十条话术改成六十到九十字的口语句：先报身份，再说结论，最后给下一步，比如您好，我是售后小周，您的包裹今天已经发出，预计明天下午到，物流单号稍后短信发您。数字一律写成三千二百元、明天下午三点，让克隆音自己读，别写 3200 和 15:00，读法十次有八次是错的。二十条里先挑五条试听，每条听完只记两件事：哪个字吞了、哪个停顿太长。做批量客服话术生成时，把模板拆成开头、结论、尾巴三段，换产品只改中间一段，音色不用重新复刻。客服话术生成最难的不是量，是每句都能一口气念完。\n\n## 四个坑\n一是克隆别人声音要书面授权，客服音色属于员工本人，离职后继续用会出事，商用还要看平台授权范围。二是素材里有回声，克隆出来就是电音，别在卫生间和小会议室录。三是情绪标记别加太多，亲亲、呢喃这类提示一多，整段会抖，客服话术平稳最重要。四是克隆声音做外呼要先报备，被判定骚扰电话，号码直接封。另外 AI 语音客服的合规要求比真人高，录音里要能听出是合成音，部分平台强制加提示音。\n\n## 总结\n豆包语音克隆做客服话术，核心是把素材录干净、把稿子改成人话，音色只是最后一层皮。二十条话术先跑五条，不对就回头改稿，而不是反复调音色。想批量做，把话术模板固定成身份、结论、下一步三段，换内容不换结构。AI 语音客服要落地，最好先小范围试，别一次铺满全量客户，豆包声音复刻再好也救不了烂稿子。","path":"articles/chat/05-doubao-voice-clone-cs-scripts.md"},{"id":"chat-06-qwen3-function-calling","title":"通义千问 Qwen3 函数调用调试笔记","category":"chat","keywords":["通义千问 Qwen3","函数调用","工具调用"],"longtail":["Qwen3 函数调用","工具调用 JSON Schema"],"tags":["函数调用","Qwen3","Agent"],"content":"上周我用通义千问 Qwen3 做一个小助手，功能只有两个：查天气、查快递。第一版死活不触发函数调用，模型在思考块里自问自答，接口返回里一个工具调用都没有。折腾两天后跑通，发现坑全在 JSON Schema 和思考模式上，跟模型能力关系不大。这篇记录 Qwen3 函数调用调通的全过程，按顺序照做能少走两天弯路。\n\n## 先关掉思考模式再调工具\nQwen3 是混合思考模型，开思考时它会在推理段里预演一遍调用流程，真正返回的工具调用反而被吞掉。我的做法是三步：第一步用非思考模式跑通链路，请求里传 enable_thinking 为 false 或降低思考预算；第二步温度先设 0.6，工具调用场景别用 1.0 那种发散参数；第三步给每个工具写清楚三行描述，说明什么时候用、参数从哪来、返回什么。链路通了再开思考模式，只用于复杂查询。二十次测试里，非思考模式触发率 95%，开思考模式反而掉到 70%。Qwen3 函数调用的第一课不是写提示词，是把思考关掉，把 JSON 结构写对。\n\n## JSON Schema 的三处易错点\n工具调用 JSON Schema 里最容易翻车的是参数。一是 required 不写全，模型会把日期和城市名瞎填，我漏写 required 后它连续三次传了空字符串，接口直接 400。二是枚举不给全，城市参数只写 description 不写 enum，它返回杭州余杭区这种带区县的名字，我的接口只认杭州，匹配失败。三是嵌套对象层级太深，两层以上它就开始漏字段，我现在把参数拍平成一层。并行调用也要注意：一次问天气加快递时，第二个调用的参数会丢，解决方法是让模型分两轮调用，别贪快。每次改完 Schema，先拿三个固定问题回归测试，别等上线才发现参数错位。\n\n## 三个坑\n一是流式返回下工具调用参数是分片下发的，按 index 拼接再解析，直接对每片做 JSON 解析必然报错。二是回传工具结果必须用工具角色，混进用户消息里模型会当成新问题重新回答。三是超时要设，我给的十秒偏短，查快递接口偶尔超过十二秒，现在改成二十秒加三次重试。另外 Qwen3-235B 效果最好，但日常测试用 8B 版本更快，调 Schema 阶段没必要烧大模型。工具调用 JSON Schema 的规范各家略有差异，换模型前先对照一遍文档，别把旧 Schema 直接搬过去。\n\n## 总结\n通义千问 Qwen3 函数调用难的不是模型，是参数定义和调试顺序：先关思考模式跑通链路，再补 required 和枚举，最后处理流式和重试。这套顺序反了，很容易误判成模型不会用工具。调通后把 Schema 和回归问题存成文件，下次换模型直接复用，省一半时间。","path":"articles/chat/06-qwen3-function-calling.md"},{"id":"chat-07-gemini-25-video-meeting-recording","title":"Gemini 2.5 视频理解 会议录像实测","category":"chat","keywords":["Gemini 2.5","视频理解","会议录像总结"],"longtail":["Gemini 视频理解","会议录像自动纪要"],"tags":["视频理解","会议纪要","多模态"],"content":"上周的周会录了九十分钟，我懒得回看，把录像丢给 Gemini 2.5 做视频理解，七分钟后拿到一份带时间戳的纪要，待办事项七条，其中三条我自己都忘了。这套流程比语音转写再总结省事，但两个硬限制必须提前知道：视频按帧计费，多人中文说话人区分很弱。下面按我的操作顺序写，照着做能省一次返工。\n\n## 先上传再提问\n第一步把录像从会议软件导出成 mp4，一小时的会议大约二到四个 G。第二步用文件接口上传，单文件别超过两个 G，超过就先压缩或切成两段，内联传参只支持二十兆以内，长视频千万别走内联。第三步等处理完成，一分钟的视频一般几秒，九十分钟要三到五分钟。第四步提问时带上时间戳要求：请按每五分钟一段输出，格式为时间范围、议题、结论、待办和责任人。这样一次就能拿到可用的会议录像自动纪要，不用追着问第三遍。跑完第一次我让它重排了一遍，把待办单独列成表格，比看文字稿快得多。\n\n## 数字和时间戳怎么用\nGemini 视频理解按每秒一帧抽帧，一小时视频大约消耗一百万 token，这是它比纯文本贵十倍的原因，免费额度基本跑不了两次。九十分钟的会议我实际只问了两轮，第二轮只问三个争议点，省 token 也省时间。时间戳的精度大概正负五秒，拿它定位没问题，别指望精确到句。中文说话人它只会标说话人一、说话人二，八个人的会议只能分出三四个，剩下的靠内容自己猜。Gemini 视频理解对屏幕共享画面里的表格也不敏感，关键数字最好单独截图再问一次。\n\n## 三个坑\n一是直接问整段录像讲了什么，会得到一份正确但没用的概述，必须给输出格式和分段粒度。二是 PPT 字太小的时候，抽帧后看不清，先把关键页截图单独发一份更稳。三是它会把沉默和口头语也算进议题，纪要里出现大段寒暄，让它删掉再重写成结论。四是多段录像要按时间先后命名再上传，顺序错了它会把两次会议串起来。另外会议录像自动纪要的责任人一栏最容易被它编，没听清的名字宁可留空，回头发给参会人补。\n\n## 总结\nGemini 2.5 视频理解做会议录像总结，适合一次性处理单场会议：上传、按五分钟分段、要时间戳和待办表格，三步能出可用稿子。它省的是回看时间，说话人区分和金额数字还是得人工核。录像越长，越要把提问拆成两轮，把会议录像自动纪要当成初稿而不是终稿。","path":"articles/chat/07-gemini-25-video-meeting-recording.md"},{"id":"chat-08-yuanbao-wechat-file-summary","title":"腾讯元宝 微信文件 总结流水线","category":"chat","keywords":["腾讯元宝","微信文件","文件总结"],"longtail":["元宝总结微信文件","微信文件周报"],"tags":["文件总结","微信","周报"],"content":"我们项目群每周 20 多份文件：报价单、排期表、验收单、截图，翻起来头疼。我试着让腾讯元宝读微信文件，做一条从群文件到周报的流水线，现在每周一花十分钟出稿，比之前让助理汇总省了两个小时。这条流水线的关键不在模型多强，而在上传和追问的方式。\n\n## 从微信直接送进去\n第一步在群里找到文件，长按后选用其他应用打开，列表里直接有元宝；也可以先进元宝 App，选上传文件，再从微信聊天记录里挑。第二步一次别塞太多，我一般按部门分三批，每批六到八份，单份控制在几十兆以内，超过百兆的文件先压缩。第三步第一句话就给任务：请阅读这些文件，按项目、进度、金额、风险四列输出，金额只写数字不换算。第三步很关键，不说清列名，它会写成散文。第四步追问缺口：哪份文件没提到验收时间，单独列出来，我拿这个去催人。这套元宝总结微信文件的做法，比让每个人交周报省事得多。\n\n## 二十份文件怎么读才不漏\n实测 20 份文件 3 到 5 分钟出结果，PDF 报价单和 Word 排期表读得最准，Excel 只读第一个工作表，多表的工作簿要另存成单表再传。图片截图基本只能读出标题，表格里的细字识别率低。我会在提示词里补一句：先给每份文件一句话摘要，再合并结论，这样漏了哪份一眼能看出来。微信文件周报最后要落到三段：本周完成、卡点、下周计划，让它按周报口径重写一遍，别直接用列表交上去。同一份文件改了两版时，文件名里带日期和版本号，它会优先读最新的那份，整理起来快很多。\n\n## 四个坑\n一是微信聊天里的文件有过期时间，群里超过一周的文件可能已经打不开，先存到手机再传。二是别把合同原件和身份证照片传上去，公开产品不能当保险柜。三是数字类问题它只总结不计算，金额合计要自己按一遍。四是同一份文件改了两版，它分不清哪个是最新，文件名里带上日期和版本号能省很多事。另外文件总结的准确率跟前置分类有关，先按部门分好再传，比全部堆一起强。\n\n## 总结\n腾讯元宝总结微信文件的定位是信息搬运：把二十份散文件压成三段周报和一张缺口清单。流水线固定成三步：分批上传、四列输出、追问缺口，最后人工核金额。它能省汇总时间，不能替你判断项目好坏。想把微信文件周报做顺，先把群文件按周归档，别等到周一才翻聊天记录。","path":"articles/chat/08-yuanbao-wechat-file-summary.md"},{"id":"chat-09-grok-3-realtime-search","title":"Grok 3 实时搜索实测复盘","category":"chat","keywords":["Grok 3","实时搜索","DeepSearch"],"longtail":["Grok 3 追科技新闻","DeepSearch 使用方法"],"tags":["实时搜索","科技新闻","信息核实"],"content":"做科技号最怕两件事：错过了当天的消息，把旧闻当新闻发。上个月我开始用 Grok 3 做实时搜索，盯二十四小时内的科技动态，每天两轮，一轮十分钟，比我原来刷十几个信息源快。它的优势是直接接社交媒体，劣势也在同一个地方：快，但脏。下面把我摸出来的 DeepSearch 使用方法和核验习惯写清楚。\n\n## 两段式提问\n第一步点开搜索框下面的增强搜索按钮，普通对话模式不联网，问最新消息只会给训练数据里的旧结论。第二步先发散：列出过去二十四小时关于某家公司的十条消息，按时间排序，每条给出来源。第三步再收敛：只保留有官方公告或主流媒体确认的三条，标注发布时间，说明消息来源是谁。第四步打开回答下方的来源面板，逐条点开核，链接打不开的直接标存疑。我测过一轮，十条里能站住的三到四条，比例不算低，但必须先发散再收敛，直接问重点会漏掉关键信息。这套 DeepSearch 使用方法简单，难在每次都忍住不跳过第二步。\n\n## 怎么防它把旧闻当新闻\n上周一条融资消息被它排在今天，点开来源是三个月前的帖子，转载号重新发了一遍。做 Grok 3 追科技新闻，我的做法是：提问时明确要求每条消息标注原始发布时间，和来源页面上的日期对不上就划掉；涉及数字的，去官网或公告截图对一遍，它引用的二手转述经常把金额单位写错。中文场景它也吃亏，国内厂商的动态英文信源更新慢，建议交叉用国内媒体再搜一遍。整个增强搜索平均一分钟左右出结果，追问三轮就接近三分钟，别在它身上等太久。真正值钱的是来源面板，不是那段总结。\n\n## 四个坑\n一是社交平台上的搬运号和热帖优先级很高，热度不等于真实，越耸动的标题越要核。二是它给的引用链接会失效，尤其是帖子被删之后，回答还在，来源已经打不开，重要事实必须落到官网。三是日期容易混，它常把旧帖算进当天，务必让它标原始发布时间。四是增强搜索有次数限制，免费额度用完之后只能等，重要提问一次说清，别拿它闲聊。另外实时搜索对中文长尾事件覆盖一般，冷门行业新闻还是得看垂直媒体。\n\n## 总结\nGrok 3 实时搜索适合当第一层雷达：先用增强搜索铺开二十四小时的信息，再用官网和公告收敛到三到四条。它负责快，人负责准。养成核来源和核日期的习惯，能省掉大部分翻车。Grok 3 追科技新闻真正省时间的地方，是你知道该去哪里二次确认。","path":"articles/chat/09-grok-3-realtime-search.md"},{"id":"chat-10-glm4-agent-builder","title":"智谱 GLM-4 智能体 搭建 4 步配置","category":"chat","keywords":["智谱 GLM-4","智能体搭建","智谱清言"],"longtail":["GLM-4 智能体人设","智谱清言知识库"],"tags":["智能体","智谱清言","提示词"],"content":"每周写周报要翻三个表格，我索性用智谱 GLM-4 智能体搭了一个周报助手：把数据表丢进知识库，选好模型和工具，发一句本周数据就出稿。第一次搭花了四十分钟，第二次只用了十分钟。中间踩的坑基本都在知识库和版本上，模型本身反而没出过问题。\n\n## 四步把智能体配起来\n第一步写 GLM-4 智能体人设，控制在两百字以内：你是谁、服务谁、输出什么格式、什么情况下拒绝回答。第二步传知识库，把周报模板、指标口径、上季度数据各传一份，文件别超过二十个，切片大小按表格选，默认五百字会把表头切碎。第三步写开场白和引导问题，开场白里放一句本周数据从哪来，用户就不容易问偏。第四步选模型和工具：日常用免费的小模型，口径复杂时切到 GLM-4-Plus，上下文一百二十八 K，够放三份周报。配置完先在调试窗口跑五个典型问题，每个问题看两点：有没有引用知识库原文、格式对不对。这四步在智谱清言里点几下就能完成，难点是每步都要验收。\n\n## 知识库不对，智能体就废\n我第一版把二十份文件全塞进智谱清言知识库，结果它把不同月份的口径混着用。改成三份核心文件后准确率明显上来。另一处是表格：系统默认切片五百字，一张三十行的表会被切成两段，答一半就停，解决办法是把表格另存成单表短文件，标题行重复写进每一段。还有，上传新文件后要点发布新版本，旧会话里跑的还是上一版，这个坑我踩过一次，数据明明更新了它还在用旧的。智谱清言知识库的检索是按相似度取前几段，文件越大命中越散，宁可拆成五份小文件，也别塞一份大文档。\n\n## 三个坑\n一是 GLM-4 智能体人设写太长会挤占上下文，超过五百字它就开始忘开场白和格式要求。二是发布要审核，带公司名和外部链接的智能体审核时间更长，提前一天提交。三是免费模型有并发和次数限制，团队十个人一起用会报限流，把常用问题做成快捷入口能省不少调用。另外智能体搭建容易犯的错是工具加太多，先只给一个搜索工具，跑稳了再加第二个。\n\n## 总结\n智谱 GLM-4 智能体搭建的关键不在模型，在知识库和输出格式：人设两百字、核心文件三份、表格按短文件切、每次更新后重新发布。照这四步配，一个周报助手十分钟能上手，复杂业务再慢慢加工具。真要说经验，就是先让智能体把一个场景做对，再谈多场景。","path":"articles/chat/10-glm4-agent-builder.md"},{"id":"chat-11-ernie-official-document-writing","title":"文心一言 公文写作 模板 3 轮改法","category":"chat","keywords":["文心一言","公文写作","公文模板"],"longtail":["文心一言写通知","公文写作提示词"],"tags":["公文写作","通知","提示词"],"content":"单位让我写一份一千五百字的会议通知，以前要磨一下午，这次用文心一言公文写作模板，四十分钟出稿加改三遍。公文比一般文案难在格式和文种，模型写得再顺，文种用错就是废稿。这套公文模板我已经用了两个月，通知、请示、报告都能套。\n\n## 先把要素表填满再让它写\n我的公文写作提示词分五块：文种、发文机关、主送机关、事由、依据与要求。比如：文种为通知，发文机关是某某办公室，主送各部室，事由是召开季度安全生产会议，依据是上级文件精神，要求写清时间地点、参会人员、材料准备、报名截止。然后加一句格式要求：正文一千五百字左右，层级序号用一、和（一）和 1. 三级，不要小标题加粗，不要表情符号。第一版出来结构完整，但把会议时间写成上午九点整，其实我们单位习惯写九时，这种细节要人工统一。文心一言写通知时最省事的一点，是它会把依据和要求自动拆成段落，不用自己搭架子。\n\n## 三轮修改怎么改\n第一轮改事实：时间、地点、人名、部门名逐个核，模型会顺手编一个很像真的联系人电话，必须删。第二轮改文种语气：通知用请遵照执行，请示用请批示，报告用特此报告，三个词的边界它经常混。第三轮改格式：标题二号小标宋、正文三号仿宋这些排版它管不了，但要它把落款日期和发文机关留好位置，正文里的空格和缩进自己补。三轮下来一千五百字里我改了十七处，其中九处是数字和专有名词。这套公文模板的用法是固定五块要素，换文种只改前两块，改完把成稿存回模板库，下次直接调用。\n\n## 三个坑\n一是请示和报告混用，请示要一文一事、事前请示，报告是事后汇报，混用会被退回。二是文号它爱编，某某发〔2025〕12 号这种必须用真实编号，别让它填。三是领导姓名和职务别让它猜，宁可留某某同志，也不要写错。四是涉密内容不要上传，公开模型没有保密义务。另外公文不能直接交，格式、称谓、政策表述都要过一遍人工，机器写的通知里经常出现不符合本单位习惯的提法。文心一言写通知最容易犯的错，是把口语原样写进去，改稿时要逐句压回书面语。\n\n## 总结\n文心一言做公文写作，最省时间的是骨架：把要素表填满，让它出第一版，再按事实、语气、格式三轮改。公文模板可以存成常用提示词，换文种只改前两块。它替你搭架子，责任还是签字的那个人。公文写作提示词写得越像填表越好，别指望它自己领会单位文化。","path":"articles/chat/11-ernie-official-document-writing.md"},{"id":"chat-12-mistral-lechat-french-translation","title":"Mistral Le Chat 法语翻译避坑","category":"chat","keywords":["Mistral Le Chat","法语翻译","商务法语"],"longtail":["Le Chat 中法翻译","法语商务邮件翻译"],"tags":["法语翻译","商务邮件","术语表"],"content":"我们和法国供应商的邮件以前靠同事翻，一周二十封，每封三百字左右，慢且不统一。换成 Mistral Le Chat 做法语翻译后，一天能处理完，但前两周出的错比机翻还尴尬，问题不在翻译质量，在尊称和数字格式。做商务法语翻译，术语一致比句子漂亮重要。\n\n## 先做一张十五条的术语表\n第一步把产品名、型号、合同关键词列成中法对照，一共十五条，每次翻译前粘在对话开头，要求严格按表翻译，表外专有名词保留原文。第二步固定人称：对所有客户用 vous，内部同事用 tu，邮件里混用会显得没礼貌。第三步要求输出两栏：法语译文加修改说明，说明里只列它不确定的词，方便我复核。三百字的邮件现在两分钟出稿，比逐句查词典快得多。公司名、人名、品牌名一律不翻，这条也要写进提示词，模型很喜欢把公司名意译成法语。这十五条术语表我放在共享文档里，全组统一改，Le Chat 中法翻译就不容易出现同一个词两种译法。\n\n## 数字和日期必须自己再核一遍\n法语写数字是千分位空格、小数点逗号，一千二百三十四点五六要写成 1 234,56，中文习惯的点号在法语里是千位分隔。日期也一样，2026 年 3 月 15 日要写成 15/03/2026，写成 03/15/2026 法国人会看成三月十五还是别的，很容易误读。金额后面加欧元符号，位置在数字后。我的做法是让模型翻译时保留数字原样并加括号标注，比如 1 234,56 EUR，然后自己扫一遍。称呼也别漏，Madame、Monsieur 后面跟姓，不知道姓就写 Madame, Monsieur，别用 Chère cliente 这种营销腔。商务法语的礼貌句式是固定的，请求一律用条件式，比如 je voudrais 而不是 je veux，翻漏了会显得生硬。法语商务邮件翻译里，问候语和结束语有固定句式，让它照模板写，别自由发挥，翻完把整封邮件读一遍，拗口的地方多半是中文句序没调过来。\n\n## 四个坑\n一是尊称混用，一封邮件里前后 tu 和 vous 打架，客户会明显感到不专业。二是它会把中文长句拆得七零八落，法语喜欢短句，但商务邮件需要保留因果，翻完要通读一遍断句。三是法律条款别直接机翻，责任范围和赔偿条款要人翻。四是免费版有速率限制，批量翻二十封会排队，重要的几封单独跑。另外 Le Chat 中法翻译对行业缩写不敏感，SKU、MOQ 这类词最好写进术语表。\n\n## 总结\nMistral Le Chat 法语翻译的用法是：术语表定死、人称定死、数字日期人工核，最后通读断句。它能把二十封邮件的初稿时间从一天压到一小时，但发出去前那五分钟的核对不能省。法语商务邮件翻译做得顺不顺，八成取决于术语表和模板，而不是模型本身。","path":"articles/chat/12-mistral-lechat-french-translation.md"},{"id":"chat-13-poe-multi-model-cost-comparison","title":"Poe 多模型 成本对比 6000 点实测","category":"chat","keywords":["Poe 多模型","成本对比","订阅点数"],"longtail":["Poe 点数消耗","Poe 模型选择"],"tags":["多模型","成本","订阅"],"content":"做 Poe 多模型成本对比之前，我算过一笔账：每月 20 美元，给 6000 点计算额度，十来个模型随便切。用了两个月我发现，真正烧钱的不是模型多，而是拿贵模型干粗活。同一篇三千字文档总结，用不同模型跑，Poe 点数消耗能差五倍，这个差距不摸清楚，六千点半个月就见底。\n\n## 同一篇总结的消耗对比\n我拿一篇三千字的行业报告做测试，固定提示词，只换模型。第一档是旗舰模型，单次总结大约吃掉一百点，订阅点数按每月六千点算，一个月只能跑六十次左右，平均一天两次。第二档是轻量模型，同样任务二三十点，一个月能跑两百多次。第三档是免费额度里的小模型，几乎不耗点数，但长文会截断，读到后面就开始编。结论很简单：粗读用轻量，精读用旗舰。每周五篇精读加二十篇粗读，点数刚好够用。Poe 点数消耗的关键变量不是字数，是模型单价和对话轮数，先把这两个数摸清再订阅。\n\n## 点数是怎么被烧掉的\n点数按 token 折算，输入输出都算。一篇 3000 字中文大约 4000 token，模型越贵每 token 单价越高，旗舰和轻量的差距能到五到十倍。容易忽略的是上下文：长对话里每问一次都重发历史，问到第十轮，单次消耗是第一次的四五倍，所以我在 Poe 里尽量一问一答，开新对话比接茬便宜。另一个隐形消耗是文件：上传 PDF 会先转成文本塞进上下文，页数多的时候比直接粘正文贵。想省钱先做两件事：清空没必要的历史、把长文档摘成提纲再喂。按这个办法调，我的月均点数从超标降到五千出头。\n\n## 三个坑\n一是点数不累计，月底清零，别指望攒着下个月用，重要任务当月跑完。二是不同模型定价不透明，同一个名字下面还可能分版本，Poe 模型选择前先看一眼单次提示，别默认点最上面的。三是取消订阅后剩余点数作废，年付便宜但一次付清，试错成本更高。另外别拿旗舰模型做格式整理和翻译这种机械活，同样的结果轻量模型能省四五倍点数。免费档每天给的点数更少，拿来试模型可以，别当主力。\n\n## 总结\nPoe 多模型成本对比的核心结论是分层用模型：机械任务用轻量，推理和长文用旗舰，一周按五加二十的比例分配，六千点刚好。先摸清 Poe 点数消耗，再谈值不值，订阅这件事最怕的是用贵模型堆量。Poe 模型选择没有标准答案，按你每周的精读篇数倒推，比看别人评测靠谱。订阅前先跑一周测试，把每篇的点数记下来，再决定开不开年付。","path":"articles/chat/13-poe-multi-model-cost-comparison.md"},{"id":"chat-14-characterai-character-card-writing","title":"Character.AI 角色卡 写作实操","category":"chat","keywords":["Character.AI","角色卡","AI 角色扮演"],"longtail":["Character 角色卡写法","AI 角色人设稳定"],"tags":["角色扮演","小说创作","人设"],"content":"我给连载小说里的配角建了一张角色卡，用 Character.AI 角色扮演先试戏，十轮对话下来人设没崩，还帮我想出两句台词。之前写过两版都翻车：第三轮它开始加旁白，第五轮把我的设定忘了。区别全在角色卡怎么写，跟模型无关。这篇把 Character 角色卡写法的三段结构和调试节奏说清楚。\n\n## 角色卡分三段写\n第一段写身份，不超过 300 字：年龄、职业、和主角的关系、现在最在意什么。第二段写语言习惯，这是最有用的一段：句子长度、会不会用成语、遇到紧张情况怎么说话、有什么口头禅，比如每句结尾爱加一个是吧。第三段写禁区：不能提的往事、不能主动示好的场合、不能说的口头禅。三段加起来控制在 800 字以内，超了它反而记不住。然后再填三组示例对话，每组三问三答，示范它在不同情绪下的语气，这比任何描述都管用。Character 角色卡写法里，示例对话的权重比身份描述高，我一般把篇幅对半分。\n\n## 十轮对话怎么不崩\n第一轮先做压力测试，问一个会激怒它的问题，看它会不会跳戏。第二轮换成日常闲聊，检查口头禅还在不在。到第六轮左右它开始忘设定，这是记忆窗口的极限，解决办法是在你的台词里自然地重述关键设定，比如你上次说再也不去码头，对吧，比直接命令它记住管用。第十轮后我会把整段对话复制出来当写作素材，重点看它临场编的细节，有用的留下，没用的删掉。语气最稳的是它在被追问时的第一反应，写作时可以直接借。想让 AI 角色人设稳定，别一次抛三个问题，一句一句接，它才跟得住。\n\n## 四个坑\n一是别用真人或明星做角色卡，平台会拦，也不合适。二是涉及暴力、未成年恋爱这类内容会触发过滤，角色卡写得再小心也白搭，写小说别在这上面耗。三是它爱加动作描写和表情符号，示例对话里要写清楚只输出台词，否则每句都带括号。四是它记不住长篇，超过十轮就会重复，别拿它做长线剧情，当试戏工具就好。另外 AI 角色人设稳定靠的是复述设定，不是把设定写长，每次对话开头补一句场景，比堆三百字背景有效。\n\n## 总结\nCharacter.AI 角色卡写作的关键是语言习惯和示例对话，不是形容词堆砌。三段式加三组示例，能顶住十轮测试；记住人设这件事改不了，AI 角色扮演工具就当演员试镜用，别当编剧。按这个流程写，Character 角色卡写法一次定型，AI 角色人设稳定也能撑住整章对话的草稿。","path":"articles/chat/14-characterai-character-card-writing.md"},{"id":"chat-15-iflytek-spark-meeting-minutes-dialect","title":"讯飞星火 会议纪要 方言转写流水线","category":"chat","keywords":["讯飞星火","会议纪要","方言识别"],"longtail":["讯飞听见方言转写","方言会议纪要"],"tags":["会议纪要","方言","语音转写"],"content":"上个月一场 2 小时的董事会，8 个人，粤语和四川话混着说，还有普通话和英文缩写。用讯飞听见转写加讯飞星火整理纪要，半小时出初稿，人工核了四十分钟。以前这种情况得两个人听一天，方言这块确实是它的强项。下面按转写、整理、核对三段说，每段都有关键设置。\n\n## 转写前先做三件事\n第一步导出音频，尽量拿到分轨文件，多人共用一个麦克风的录音重叠严重，方言识别会乱。第二步在转写设置里选方言类型，粤语、四川话、河南话这些主流方言都支持，混合方言的会先选主方言，其余靠模型猜。第三步导入热词表，把公司名、项目代号、人名提前录进去，这一步能少改一半错字。两小时录音机器转写大约 20 分钟到半小时，8 个人的会分不出全部说话人，我一般只分成六轨，剩下靠内容补。讯飞听见方言转写在安静环境下准确率确实高，但收音差的时候别硬扛，先降噪再传。\n\n## 用星火从转写稿到纪要\n转写稿直接扔进讯飞星火，提示词固定成三段：先输出会议基本信息，包括时间、地点、参会人；再按议题分块，每块写讨论要点和结论；最后输出待办表，四列是事项、责任人、截止时间、状态。两小时录音转出来约三万字，星火能一次吃掉，但结论部分要人工补，模型分不清讨论和决定。我的做法是让它把含就这么定、下周交这类句子的段落单独标出来，再自己判断。粤语表达里的唔该、得啦会原样出现，纪要里要改成书面语。方言会议纪要最花时间的不是转写，是把口语结论翻成能发给领导的书面句。方言识别只是第一步，纪要对齐才是难点。\n\n## 四个坑\n一是多人抢话的段落识别率掉得厉害，重要决议最好回听原音核对。二是方言里夹英文术语，比如 KPI、SKU，经常被转成拼音或错字，要进热词表。三是人名和公司名错字最多，尤其粤语发音和普通话差得远，会后统一替换一遍。四是金额和日期是重灾区，三千二百万被转成别的数字的情况我遇到过两次，数字一律人工核。另外涉密会议别用公开服务，走私有化部署。方言会议纪要发出前，至少找一位参会人通读一遍。\n\n## 总结\n讯飞星火会议纪要这套流水线，核心是三件前置工作：分轨音频、方言设置、热词表。转写交给机器，纪要和结论交给人，待办表交给模型。两小时的方言会议，现在半天能收尾。讯飞听见方言转写省掉的是重听时间，方言会议纪要省掉的是整理时间，判断和担责还是人。","path":"articles/chat/15-iflytek-spark-meeting-minutes-dialect.md"},{"id":"code-01-cursor-tab-settings","title":"Cursor Tab 补全 设置：五个开关的取舍","category":"code","keywords":["Cursor Tab 补全 设置","Cursor Tab 开关","Cursor 补全延迟"],"longtail":["Cursor 补全延迟高","Cursor 补全不触发"],"tags":["Cursor","Tab补全","IDE配置"],"content":"在 Cursor 里写 Go 接口那一周，Tab 补全每分钟弹十几次建议，连按两下就吞掉整行，真正的问题不在模型，而在 Cursor Tab 补全 设置里默认打开的触发口径。我按自己的习惯逐项关掉再对比，最后只留五个开关。Cursor 补全延迟高 和 Cursor 补全不触发，八成都能在这五个开关里找到答案。下面这组数值来自一个 400 行的 service.go，路径按 Windows 版写。\n\n## 先减触发，再谈接受\n打开 Cursor Settings（Ctrl+Shift+J），左侧选 Cursor Tab。第一项 Trigger in comments 关掉，写 TODO 或中文注释时不会再补出整段假实现，上周我就被它补出过三行并不存在的接口。第二项空行补全关掉，换行后不再等云端建议，首字建议从约 500ms 压到 200ms 内。第三项保留 Auto-import，但打开 Partial accepts，Ctrl+→ 可以逐词接受，不必整行吞下。第四项把补全模型固定成默认小模型，别追新模型，Tab 要的是快不是聪明，换模型后建议风格会飘一周。第五项在项目根目录建 .cursorignore，把 vendor/、dist/、*.generated.ts 写进去，大仓库冷启动能少卡一秒。\n\n改完先新建一个空文件连打五行 if，确认建议能在 200ms 内出现。如果 Cursor 补全不触发，先看右下角 Tab 图标是不是灰的，再检查文件类型是不是在语言白名单里，最后看 .cursorignore 有没有把当前目录误排除。团队统一的话，把这套配置提交到项目的 .vscode/settings.json，新同事拉下来就是同一手感。键位建议保留默认 Tab，改成 Enter 之后每次确认搜索框都会误触发补全。\n\n## 用数字做验收\n把这套 Cursor Tab 补全 设置 跑满一周后，我在同一个 400 行的 service.go 上做了两轮对比：默认状态下每分钟弹 14 次建议、误接受 3 次；调完剩 5 次、误接受 0 次，按一天写 250 行算，净省约 10 分钟。我在便签上记了一周，平均每天 2.6 次误接受，改完降到 0.2 次。Pro 每月 20 美元、Tab 不限量，免费版只有 2000 次补全，做这种反复对比实验明显不够用，先开一个月 Pro 再决定更划算。响应时间我记在 180 到 240ms 之间，Cursor 补全延迟高 到 400ms 以上时，先把 .cursorignore 再收一轮，再考虑换小模型。另外别在 vim 模式下测延迟，按键映射会干扰判断。\n\n## 三个容易忽略的坑\n一是补全只看当前文件附近，跨文件签名不保证，改公共函数前先打开定义文件。二是误接受会覆盖选中区，一次能吃掉 20 行，先 Ctrl+Z 再继续写，别顺手补两行。三是团队仓库的 .cursor/rules 会覆盖你的补全风格，进新项目先看有没有 rules 文件，否则容易怀疑设置没生效。四是多窗口开同一仓库时只有焦点窗口弹补全，另一个窗口看着像失效，其实是省资源。五是公司代理限速时延迟会翻倍，加白名单比调参数有效。\n\n## 总结\n调 Cursor Tab 补全 设置时，顺序是先减触发、再调接受，最后用延迟和误接受次数验收。现在补全只在光标处出现，不再抢戏，一个月省下的三个小时，足够值回 20 美元。","path":"articles/code/01-cursor-tab-settings.md"},{"id":"code-02-claude-code-cli-refactor","title":"Claude Code CLI 重构：四步顺序","category":"code","keywords":["Claude Code CLI 重构","Claude Code 重构","Claude Code 大仓库"],"longtail":["Claude Code 重构大型项目","Claude Code 上下文不够"],"tags":["Claude Code","代码重构","CLI"],"content":"上个月我接手一个三万行的 Java 老仓库，要把工具类里的静态方法抽成服务。直接让 Claude Code CLI 重构 试了两次：第一次改到第 9 个文件就丢了前面的约束，第二次把没跑通的代码也写进了注释。后来我把流程拆成四步，才把 42 个文件稳定改完。Claude Code 重构大型项目 的第一步其实不是写代码，是让工具先看懂仓库边界。\n\n## 第一步：把约束写进 CLAUDE.md\n进仓库先跑 `claude`，再用 `/init` 生成 CLAUDE.md。别生成完就完事，我手动压到 60 行以内，只留三件事：构建命令 `mvn -q compile`、测试命令 `mvn test -Dtest=OrderServiceTest`、包结构约定 service 层不许直接注入 mapper。这三行比任何提示词都值钱，因为上下文压缩时它会被优先保留。我还在文件末尾写明：不许改 public 方法签名，每个类改完必须能编译。\n\n后面发现新约束时不用重开对话，在输入框用 `#` 开头把规则追加进记忆就行。CLAUDE.md 超过 200 行反而拖慢启动，别把整本规范贴进去，只留每次必须遵守的那几条。最后把它提交进仓库，团队每人一份不如仓库里一份。\n\n## 第二步：先出计划，再动代码\n按 Shift+Tab 进 plan mode，让它只读代码、输出改造计划，存成 docs/refactor-plan.md。计划里要有文件清单、调用方、风险点，我要求每个文件一行，超过两行的退回重写。第一版计划它漏了 7 个调用方，我让它把所有引用点 grep 出来再排批次。确认后按文件分三批：第一批 5 个，第二批 12 个，第三批 25 个。每批开始前用 `--add-dir` 把公共库加进来，避免它以为工具方法不存在。Claude Code 上下文不够 的早期信号，是它开始改计划外的文件。\n\n计划写完我还会让它列出回滚步骤：哪个 commit 能退、哪些文件必须手动恢复。这一步花 10 分钟，救过一次第三批改错连接池配置的事故。\n\n## 第三步：分批提交，别一次到底\n每批改完立刻跑测试，然后 `git commit`。Claude Code CLI 重构 的节奏是一次只动 3 到 5 个文件，改完用 `/compact` 压一轮上下文，再把 `git diff` 按文件看，每批不超过 300 行。整个仓库花了约 6 小时，用的 Pro 订阅每月 20 美元，没触发 5 小时窗口的上限。Claude Code 重构大型项目 时，最贵的不是 token，是我 review 的时间，所以宁可多分两批。\n\n三个坑也集中在这一步：一是 Claude Code 上下文不够 时会把早期约束忘掉，另一种表现是开始重复问同一个问题，约束要写进 CLAUDE.md 而不是聊天里；二是别让它一次改整目录，文件越多越容易漏调用方；三是订阅额度按 5 小时滚动窗口算，长任务别和聊天共用同一时段。补一条：动手前一定先建分支，它偶尔会顺手改配置文件。\n\n## 总结\nClaude Code CLI 重构 的稳定流程是：CLAUDE.md 锁约束、plan mode 出计划、按文件分批、每批测试加提交。最后 42 个文件全部改完，测试通过率从 61% 回到 98%，返工最多的一轮，正是没写计划的那次。","path":"articles/code/02-claude-code-cli-refactor.md"},{"id":"code-03-github-copilot-unit-tests","title":"GitHub Copilot 单元测试：三步法","category":"code","keywords":["GitHub Copilot 单元测试","Copilot 生成测试","Copilot 测试用例"],"longtail":["Copilot 单元测试覆盖率","Copilot 测试用例不准"],"tags":["GitHub Copilot","单元测试","VS Code"],"content":"订单模块的老代码没有测试，我先用 GitHub Copilot 单元测试 补了一轮，结果 38 个用例全绿，覆盖率从 42% 涨到 71%，但上线第二天就发现一个金额取整的 bug，测试根本没碰到。写这篇记录，是想说清楚 Copilot 生成的测试要怎么调教才算数。\n\n## 先给测试框架立规矩\n在 VS Code 的 settings.json 里加 github.copilot.chat.testGeneration.instructions，写清三句话：用 pytest 加 factory_boy，不要 mock 数据库，金额字段一律用 Decimal。打开被测文件，在 Copilot Chat 里输 `/tests`，或在编辑器右键选 Copilot → Generate Tests，一次会生成 30 到 40 个用例。不写指令它会默认用 unittest 加 MagicMock，那 38 个用例里有 12 个是重复断言；改完指令后重复降到 3 个，还会自动给边界值补参数。\n\n生成 38 个用例大约 90 秒，比我手写快五倍，但它只读当前文件，跨模块的 fixture 要手动补。跑之前先确认 pytest 版本，它偶尔生成 pytest 8 才有的写法，老项目直接报语法错。这个设置项只对测试生成生效，不影响普通补全，团队共用就写进 .github/copilot-instructions.md。\n\n## 让失败用例当线索\n生成后先整体跑一遍，别急着看覆盖率。我那批里有 9 个一跑就报错，5 个是它假设错了参数顺序，剩下 4 个正好暴露空列表和负数金额两个真实分支。把错的改成断言当前真实行为，再补边界：0、-1、999999.99、两位小数、负数退款，自己列一遍再让它按列表补，比让它自由发挥稳。Copilot 单元测试覆盖率 从 42% 到 71% 只花了 20 分钟，但把假断言换成有效断言又花了四十分钟，这两段时间的比例基本就是这类工具的真相。覆盖率的分子分母也要看清：它只统计执行过的行，不统计断言写得对不对。\n\n还有个土办法判断深浅：手动把金额四舍五入改成截断，再跑一遍测试，38 个用例里只有 2 个变红，说明广度够、深度不够。同样的变异测试拿去改状态码，红了 6 个，这部分才是我能放心上线的。\n\n## 三个坑\n跑完这套，GitHub Copilot 单元测试 对我来说就是个起稿器。三个坑排前面：一是断言照抄现有实现，把 bug 写成预期，生成完先搜有没有\"金额等于原值\"这种废话断言。二是 mock 过度，数据库、消息队列全 mock 掉，测试只证明 mock 能工作。三是时区问题，订单时间用 UTC 还是本地时间，生成的断言经常默认本地时区，跑到 CI 就红。另外免费版每月 2000 次补全加 50 次聊天，Pro 每月 10 美元不限补全，批量生成建议用 Pro；也别让它把生产数据的手机号写进 fixture。Copilot 单元测试覆盖率 只适合当参考，Copilot 测试用例不准 的时候，先看看丢给它的需求是不是只有一句话。\n\n## 总结\nGitHub Copilot 单元测试 的正确用法是先立框架规矩、再让失败用例说话、最后人工补边界。遇到 Copilot 测试用例不准 的情况，先把指令改具体，再用变异测试验收，假绿的坑就能少踩一半。","path":"articles/code/03-github-copilot-unit-tests.md"},{"id":"code-04-windsurf-cascade-multifile","title":"Windsurf Cascade 多文件：先验收","category":"code","keywords":["Windsurf Cascade 多文件","Cascade 批量改文件","Windsurf 多文件编辑"],"longtail":["Windsurf Cascade 一次改多个文件","Cascade 全量接受风险"],"tags":["Windsurf","Cascade","AI编程"],"content":"上周给一个 React 项目换状态管理，六个文件要一起动。我先在 Windsurf Cascade 多文件 模式下试了一次：入口文件、目标 API 和三个命名约定都写清楚了，Cascade 三分钟给出六份 diff，但全量接受后有两个页面白屏。这篇记录我把顺序改对之后的做法。\n\n## 先锁上下文再写指令\n打开 Cascade（Ctrl+L），切到 Write 模式，先 @ 三个文件：入口 App.tsx、旧 store.ts、类型 types.ts。别一次 @ 十几个，超过十个上下文会被截断，它会开始猜。指令里写死四件事：不许改路由、状态用 useReducer、动作名用大写蛇形、每个文件顶部加中文注释。Windsurf 多文件编辑 的提示词里，命名约定比功能描述更影响结果，因为六个文件之间要对齐同一套名字。\n\n如果项目里已经有 hooks 目录，把目录名称也写进指令，它会按目录找相似写法。我第二次把\"参考 src/hooks/useCart.ts 的写法\"加进去，生成的动作名一次就对齐了，省掉一轮手改。六个文件里有两个纯展示组件，我直接标注可跳过，少改了 30 行。Cascade 全量接受风险 我第一次就吃过，所以这次先把范围说死。\n\n## 分批接受 diff\nCascade 会给每个文件一份 diff，别点 Accept all。我的顺序是先看最底层的 types.ts，确认类型对；再看 store 和 hooks；最后看两个页面，每接受一个文件就刷新一次页面。六个文件总共改出 214 行，我接受了 189 行，删掉 25 行它自作主张加的 loading 组件。Windsurf Cascade 一次改多个文件 之后先开本地预览，跑一遍三条主流程再 push。如果单份 diff 超过 300 行，我直接取消重来，把范围拆小。刷新页面这一步不能省，白屏那次就是没刷新直接往下改。\n\n## 回滚、额度与三个坑\nWindsurf Pro 每月 15 美元、500 credits，这次重构前后用了 6 个 prompt credits。credits 按初始 prompt 计，同一次对话里追加修改不算新 prompt，所以尽量在一轮里把要求说完。它自带 checkpoint，点 Restore 能退回任意一次对话前，但 checkpoint 不替代 git，我动手前先 commit 一次，跑完再 commit 一次。Cascade 全量接受风险 主要在无关文件被顺手改：这次它动了 package.json 的 scripts，还删了一个没在清单里的工具函数没告诉我。\n\n三个坑补完：一是一次 @ 太多文件，上下文被截断后它猜错的概率集中在 import 路径上；二是 Accept all 会连样式一起改，先看 diff 再点；三是 checkpoint 只回滚工作区，不撤回终端里跑过的命令。复查 Windsurf Cascade 多文件 的改动时，我按依赖顺序排文件，最底层的先看，六个文件十分钟能过完。回头看，Windsurf Cascade 一次改多个文件 最容易翻车的地方不是业务代码，是 package.json 这种配置文件。再补一条：中文注释别写在 JSX 属性行内，会破坏格式化。\n\n## 总结\nWindsurf Cascade 多文件 的正确顺序是锁上下文、写约定、逐文件接受、预览后提交。六个文件来回折腾两次，第三次才一遍过，关键差别是提前约定四套命名规则，而不是把需求写得更长。Cascade 批量改文件 时，慢一点 review 比快一点重做划算。","path":"articles/code/04-windsurf-cascade-multifile.md"},{"id":"code-05-tongyi-lingma-private-repo","title":"通义灵码 私有仓库：企业版知识库200MB上限","category":"code","keywords":["通义灵码 私有仓库","灵码 代码库索引","通义灵码 企业版"],"longtail":["通义灵码 私有代码库接入","灵码 知识库上传失败"],"tags":["通义灵码","私有仓库","企业版"],"content":"公司代码在内网 GitLab，我一开始以为装上通义灵码插件、登录账号就能问私有仓库的问题，结果它只会按当前文件补全，问到内部工具类一律回答不知道。真正让通义灵码 私有仓库 检索生效的，是企业版控制台里的知识库索引：我按官方文档配了一遍，30 人团队用了两周，补全命中内部 API 的比例从两成涨到六成多。\n\n## 先确认版本和容量\n进通义灵码管理控制台，先看账号版本：企业标准版给 500MB 知识库容量，企业专属版 5GB 并支持 VPC 私有化部署；个人版和 Lingma IDE 不支持私有代码库检索。客户端只支持 VS Code 或 JetBrains 系，别在别的编辑器里折腾。我们 12 个微服务、约 80 万行 Java 代码，去掉依赖和编译产物压完是 140MB 左右，标准版够用但离上限不远。\n\n我第一次用个人账号测，上传入口根本看不到，折腾半小时才发现是版本问题。通义灵码 私有仓库 检索的入口在管理控制台，不在插件设置里。\n\n## 建库、打包、上传\n控制台 → 知识管理 → 新建知识库，应用场景必须选“行间代码生成”，可见范围按团队设成指定成员。然后上传 ZIP：单个包不超过 200MB，打包前一定排掉 target、build、dist、.git 和测试目录。我第一次把 target 压进去，包 190MB，索引后补全建议里混进一堆编译产物，删掉重传。传完系统自动解压建索引，我们 140MB 的包大约 8 分钟出结果，补全时用 `#team` 引用知识库上下文。通义灵码 私有代码库接入 之后，跨服务的接口命名明显更贴内部规范，新人不用再翻十分钟找工具类。\n\n灵码 代码库索引 是按知识库粒度建的，建议一个业务域一个库，别把所有微服务塞进同一个，检索噪音会大很多。通义灵码 私有代码库接入 这件事，最花时间的不是上传，是决定哪个库放哪些代码。上传前用 `git archive` 打包，能少踩灵码 知识库上传失败 的坑。\n\n## 维护与坑\n索引不是实时的，代码合进主干后要重新上传压缩包，我定的是每周五例行更新。灵码 知识库上传失败 最常见两种：包超 200MB，或者 ZIP 里带了没法解析的二进制文件。另外权限别图省事设全员可见，订单团队的代码库不该让整个研发中心都能问。注释质量直接决定检索质量，函数头注释写清参数和业务含义，否则搜出来的片段对不上。\n\n再补两个：密钥和数据库账号别写进要上传的代码里；上传前用 `git archive` 打包，能自动排除未跟踪的临时文件。\n\n## 总结\n通义灵码 私有仓库 的关键是把企业知识库当第二个工程来维护：版本确认、ZIP 瘦身、权限收窄、按周更新。现在团队六成补全命中内部 API，订阅费省下的时间早就赚回来了。通义灵码 企业版 的 500MB 看着小，用对打包方式其实够一个中等研发团队用。","path":"articles/code/05-tongyi-lingma-private-repo.md"},{"id":"code-06-codeium-free-plan-compare","title":"Codeium 免费版 对比：补全不限量卡在哪","category":"code","keywords":["Codeium 免费版","Codeium 对比 Copilot","Codeium 补全额度"],"longtail":["Codeium 免费版够不够用","Codeium 和 Windsurf 区别"],"tags":["Codeium","免费额度","对比"],"content":"团队新来的实习生问我：Codeium 免费版 补全不限次数，是不是可以不用买 Copilot 了。我让他和另一个同事各装一个，用同一份 8 个页面的 React 后台干三天活，再和 Copilot、Cursor、Trae 三家免费方案摆一起对比。三天下来补全接受次数差不多，差别全在 Chat 额度、数据条款和账号体系上。\n\n## 先分清 Codeium 现在是谁\nCodeium 的 VS Code 插件现在叫 Windsurf Plugin，旧教程里的 Codeium 账号和现在这套不是一回事，搜到 2023 年教程的人很容易在错误入口里绕。个人版行间补全不限次数、不要信用卡，这点没变；变的是 Chat 和 Agent 走 credits，免费账户每月额度只有两位数，用完只能等下个月。Codeium 补全额度 真正不限的只有行间补全，多行改写和对话都要省着用。Codeium 和 Windsurf 区别 也在这里：插件补全归插件，Agent 归 Windsurf IDE，账号体系通着，入口不是一个。\n\n我装完第一件事是关掉默认打开的多行建议，那个功能在注释密集的文件里会连着弹三个候选，反而打断思路。关掉之后一次只出一条，接受率反而高。\n\n## 四家免费版横向对比\nCopilot 免费版每月 2000 次补全、50 次聊天；Cursor 免费版 2000 次补全加少量慢速请求；Trae 国内版每月 500 积分；通义灵码个人版免费但不支持私有库检索。Codeium 免费版够不够用 取决于你怎么用：一天写 200 行、只在行间补全，它完全够；要让它改多文件、解释报错，免费 Chat 额度两天就没了。\n\n三天实测：实习生用 Codeium 接受补全 214 次、Chat 用了 18 次，第二天下午额度见底；同事用 Copilot 补全接受 186 次、Chat 26 次，额度还剩三分之一。同一段 TypeScript 接口，Codeium 补出 8 行、Copilot 补出 11 行，能直接用的都是前 5 行，补全质量差距没有价格差距那么大。我的结论是 Codeium 免费版 适合当第二补全器，需要对话再切回 Copilot 或直接上 API。\n\n## 三个坑\n一是账号迁移，Windsurf 改版后老的 Codeium 订阅后台换了入口，付款前先确认自己在哪个控制台。二是公司代理会把补全请求拦掉，表现为延迟忽高忽低，先测 443 端口通不通，再找 IT 加白名单。三是免费版不做企业级数据隔离，客户合同、密钥、真实手机号别贴进 Chat。\n\n另外别同时装 Codeium 和 Copilot，两个 Tab 建议会打架，肉眼很难判断哪条来自谁，按项目切换更省心。学生认证的 Copilot 免费，但用公司邮箱注册个人免费版属于违规，这条实习生最容易踩。如果你只做行间补全，Codeium 免费版够不够用 的答案基本是够；Codeium 和 Windsurf 区别 也没必要纠结，装哪个插件都能用。\n\n## 总结\nCodeium 免费版 和 Copilot、Cursor、Trae 的差别不在补全次数，而在 Chat 额度、数据条款和账号体系。把 Codeium 当成不限量的行间补全器，付费留给多文件改写，是我试过最省钱的组合，三天实验成本只有一顿午饭。","path":"articles/code/06-codeium-free-plan-compare.md"},{"id":"code-07-cline-auto-edit-safety","title":"Cline 自动改代码 安全：只自动批准读文件","category":"code","keywords":["Cline 自动改代码","Cline 自动批准","Cline 安全"],"longtail":["Cline 自动改代码 安全边界","Cline 命令自动执行风险"],"tags":["Cline","代码安全","自动批准"],"content":"Cline 的自动批准是效率开关，也是事故开关。我第一次开 YOLO 模式跑一个 Node 项目，十分钟里它自己执行了 23 条命令，其中包括 `npm install` 和一条没在计划里的 `git checkout .`，把我两小时没提交的改动冲掉了。后来我把 Cline 自动改代码 的权限拆成四档，才敢让它连着跑。\n\n## 自动批准按工具分类关\n打开 Cline 设置 → Auto Approve，它按工具分四类：读文件、改文件、执行命令、用浏览器。我的配置是读文件全放行，改文件只限当前工作区，执行命令一律手动确认，浏览器关掉。工作区外的读写有单独开关，别开，开了它就能改你的 SSH 配置和全局 npm 配置。设置里的 Max Requests 我压到 20，跑完一轮必须停下来看一眼，不然账单和 diff 一起失控。自动批准设置建议截图存进团队 wiki，新人照着配，比我口头讲三遍省事。\n\n自动批准是按每次工具调用评估的，不是一次开关管全程，所以可以只放行低频安全操作，把高风险动作留给人。关掉工作区外权限后，它连读 /etc 都会在日志里记一条 denied，排查时很直观。\n\n## 再叠三层保险\n第一层是 git：让它改代码前先 commit，出问题直接 reset。第二层是 .clineignore，把 .env、密钥目录、数据库备份写进去，避免被当成上下文读走。第三层是分批：一次只给一个任务，比如“把 utils/date.js 改成 dayjs”，别给“重构整个项目”。Cline 自动改代码 安全边界 说到底是它能碰什么、碰完谁验收，我把验收固定成跑测试加看 diff 两件事，缺一不算完成。\n\n命令执行我还会加白名单：`npm test`、`npm run lint`、`git status` 三条自动放行，其余手动。这个设置看起来麻烦，但一个月下来省掉几百次确认，也没出过事。验收顺序固定：先跑测试，再看 `git diff --stat`，最后人工过一遍改动行。\n\n## 成本与三个坑\nCline 插件本身免费，钱花在 API 上：我用 DeepSeek 的 key，一天调 40 次左右，账单不到 3 元人民币。Cline 命令自动执行风险 最典型的三个：YOLO 模式不限命令、把公司内网地址写进测试脚本、API key 存在本地配置文件被同步到云盘。另外自动批准改文件时，它可能顺手格式化整个文件，diff 会变得很难看，我一般让它只改指定函数。\n\n再补两点：checkpoint 会持续占磁盘，一天攒 2GB 临时文件很正常，每周清一次；浏览器自动化别和登录态一起用，截图时可能带出后台会话。Cline 自动改代码 安全边界 里最容易被忽略的是工作区外读取，Cline 命令自动执行风险 也常从测试脚本里冒出来，这两个位置我都设了手动确认。\n\n## 总结\nCline 自动改代码 的稳妥配置是读文件放行、改文件限工作区、命令永远手动、用 git 兜底。自动化省下的时间，不该拿去赌一条没看清的命令。","path":"articles/code/07-cline-auto-edit-safety.md"},{"id":"code-08-continue-local-model-config","title":"Continue 本地模型 配置：双模型分工","category":"code","keywords":["Continue 本地模型","Continue 配置","Ollama 补全"],"longtail":["Continue 本地模型 配置教程","Continue 补全延迟高"],"tags":["Continue","Ollama","本地模型"],"content":"笔记本只有 8GB 显存，我一直觉得本地补全是个玩具。直到把 Continue 本地模型 配置 拆成两个角色：7B 负责聊天和改写，1.5B 专门做行间补全，两分钟装完，延迟从云端方案的 400ms 降到 150ms 左右。这篇把配置文件和显存账一起写清楚，8GB 卡照着抄就能跑。\n\n## 装 Ollama 与两个模型\n先装 Ollama，`ollama --version` 确认版本在 0.5 以上，然后拉两个模型：`ollama pull qwen2.5-coder:7b` 和 `ollama pull qwen2.5-coder:1.5b`，前者 4.7GB、后者 1.4GB，家里 300M 宽带大概 6 分钟。7B 的 Q4 量化运行时占 4.7GB 显存，1.5B 只占 1.4GB，两个同时加载 8GB 卡刚好停在 6GB 出头，剩下 2GB 留给系统和浏览器。如果你的卡是 6GB，只装 1.5B 做补全、聊天继续用云端，别硬塞。模型文件默认放在用户目录，C 盘紧张就把 OLLAMA_MODELS 环境变量指到 D 盘，改完重启 Ollama 服务。\n\nContinue 配置文件在 `~/.continue/config.yaml`，关键是 roles 字段，它决定哪个模型接哪类请求，选错角色比选错模型更常见。\n\n装完先跑 `ollama run qwen2.5-coder:1.5b` 随便问一句，确认模型能响应再配 Continue，省得在 IDE 里排查半天。第一次加载 7B 要 3 到 5 秒，之后常驻内存，切换项目不用重新加载；如果发现每次补全都卡一下，说明模型在被反复卸载。\n\n## config.yaml 怎么写\n```yaml\nmodels:\n  - name: qwen-7b\n    provider: ollama\n    model: qwen2.5-coder:7b\n    roles: [chat, edit, apply]\n    defaultCompletionOptions:\n      contextLength: 8192\n  - name: qwen-1.5b\n    provider: ollama\n    model: qwen2.5-coder:1.5b\n    roles: [autocomplete]\n```\n补全模型必须选 FIM 训练过的 coder 系列，拿通用模型做 autocomplete 会补出一大段而不是续几行。roles 里 autocomplete 只能挂一个模型，多挂会按顺序挑第一个；chat 和 edit 可以共用 7B。Ollama 默认上下文只有 2048，大文件会被截断，把 contextLength 调到 8192 是第一步。Continue 补全延迟高 多半是模型选错：1.5B 的首次建议约 150ms，换成 7B 直接 800ms 起，打字会明显卡顿。补全的触发延迟在设置里还能调，默认值偏保守，改到 200ms 左右手感最好。保存配置后 Continue 状态栏会显示当前配置名，点开能看到每个模型挂了哪些角色。\n\n## 三个坑\n一是别让 7B 兼任 autocomplete，风扇声会告诉你答案。二是 Ollama 的 keep_alive 默认 5 分钟，模型卸载后再加载要 3 秒，长会话记得设成 -1。三是中文注释会让补全偏向生成中文，需要代码时用英文注释引导。\n\nContinue 本地模型 配置教程 我建议先照抄，再按 Continue 补全延迟高 的原因逐项调。我收藏的 Continue 本地模型 配置教程 只有两篇，其他多半过时。显存账要自己算：14B 至少要 9GB，8GB 卡别硬上。另外别忘了留 2GB 给 IDE 本身，VS Code 加浏览器一起开，显存挤爆会直接退到 CPU 推理，延迟翻十倍。四是配置文件改完不用重启 IDE，保存后点一下 reload 就生效，但改了模型名要重新拉取，否则会静默回退。五是 16GB 内存的机器同时开 Docker 会把内存挤爆，推理速度掉一半。第一次装建议先只配补全模型跑一天，再加聊天模型，出问题好排查。\n\n## 总结\nContinue 本地模型 配置 的核心是分工：小模型管速度、大模型管质量，配置文件里用 roles 隔开。现在断网也能补全，代码不出本机，唯一代价是聊天质量比云端差一截。Ollama 补全 跑顺之后，最明显的变化是补全不再打断思路，我连开会都敢开着编辑器写代码了。","path":"articles/code/08-continue-local-model-config.md"},{"id":"code-09-openai-codex-cli-sandbox","title":"OpenAI Codex CLI 沙箱：写工作区","category":"code","keywords":["Codex CLI 沙箱","Codex CLI 权限","Codex CLI 配置"],"longtail":["Codex CLI 沙箱模式","Codex CLI 审批策略"],"tags":["Codex CLI","沙箱","权限"],"content":"装完 Codex CLI，第一次跑 `codex` 它默认待在只读沙箱里，改不了任何文件；加参数放开之后又能写工作区了，但 `npm install` 全部失败。OpenAI Codex CLI 沙箱 的三种模式我挨个试了一遍，最后固化出一份 config.toml，这篇把权限和网络的组合讲清楚，免得你也卡在“能写不能装”这一步。我把三种模式在同一个 Node 仓库上各跑了 20 分钟，数据在下面。\n\n## 三种沙箱模式怎么选\n`read-only` 只能读、不能写、不能联网，适合让它分析陌生仓库；`workspace-write` 能写当前目录和临时目录，网络默认关闭；`danger-full-access` 等于不设防，只在容器里用。我日常用第二条，命令是 `codex --sandbox workspace-write`。Codex CLI 权限 的另一半是审批策略：`untrusted` 只放行只读命令，`on-request` 由模型自己申请，`on-failure` 失败后申请，`never` 从不问，只有 CI 才用最后一条。Codex CLI 审批策略 的四个档位里，我实测 on-request 最顺手，它会先说明要跑什么再申请。\n\n三种模式我在同一个 Node 仓库各跑了 20 分钟：read-only 读了 12 个文件、写了 0 个；workspace-write 改了 9 个文件，其中 2 次超出范围被拒绝；danger-full-access 最快，但把 3 个临时文件也删了。\n\n两种设置是相乘的关系，不是二选一：沙箱决定能碰什么，审批决定碰之前问不问。我试过只放宽沙箱、审批保持 never，结果它默默改了三个配置文件。\n\n## config.toml 与 profile\n把默认值写进 `~/.codex/config.toml`：\n```toml\nsandbox_mode = \"workspace-write\"\napproval_policy = \"on-request\"\n```\n再配两个 profile：`conservative` 用 read-only 加 untrusted，跑陌生仓库；`trusted` 用 workspace-write 加 on-request。切换用 `codex --profile conservative`，写好后日常启动改成 `codex --profile development` 更稳定。工作区沙箱默认断网，需要装依赖时开 `[sandbox_workspace_write] network_access = true`，或者干脆把依赖装好再进沙箱。OpenAI Codex CLI 沙箱 的核心配置只有两个键，其余都是组合，这两个键错一个，行为就完全不同。Codex CLI 沙箱模式 选对了，误删文件的风险能降一大半；配错的典型症状是它反复申请权限，而你一直点同意。\n\n## 三个坑\n一是沙箱里 `npm install` 卡住不是网络问题，是策略问题，先看日志里的 denied。二是 `danger-full-access` 加 `approval_policy = \"never\"` 是危险组合，脚本里千万别这么写。三是沙箱只隔离文件系统和命令，不隔离代码上传，私有仓库先看数据条款。\n\n另外 `codex exec` 跑批量任务时，read-only 加 never 才是 CI 的正确姿势，别在流水线里开写权限。Codex CLI 审批策略 按环境分三套，比一套走天下安全得多。四是 `codex exec` 在 CI 里默认以仓库根为工作目录，跨目录任务记得显式传路径；五是沙箱里的 MCP 服务连不上本地端口，别在沙箱里调本地 API。被拒绝的命令在日志里会标 denied，先搜这个关键字比猜快。Codex CLI 沙箱模式 按项目分，别一个配置跑所有仓库。还有订阅额度问题：ChatGPT Plus 每月 20 美元能覆盖日常量，重度使用要么升 Pro，要么换成 API key 按量付费。\n\n## 总结\nOpenAI Codex CLI 沙箱 的默认值偏保守，真正要改的只有两处：模式换成 workspace-write，审批保持 on-request。把配置写进 config.toml 存成 profile，比每次命令行拼参数可靠得多。","path":"articles/code/09-openai-codex-cli-sandbox.md"},{"id":"code-10-trae-chinese-ide-review","title":"Trae 中文 IDE 体验：免费积分够用吗","category":"code","keywords":["Trae 中文 IDE","Trae 使用体验","Trae Builder"],"longtail":["Trae 中文 IDE 体验","Trae 国内版 免费额度"],"tags":["Trae","AI IDE","字节跳动"],"content":"用了一个月 Trae 国内版，最大的感受不是模型多强，而是中文需求终于不用先翻译成英文再喂给 AI。这篇 Trae 中文 IDE 体验 记录直接回答两个问题：中文描述的效果到底差多少，免费版每月 500 积分够不够写一周代码。测试项目是一个带登录、列表、表单的后台管理页面。\n\n## 中文需求的理解差异\n打开 Builder 模式，我输入“做一个订单列表页，顶部筛选状态和时间，表格分页每页 20 条，状态用彩色标签”。它先列计划再生成文件，一次产出 6 个文件、约 320 行代码，字段命名直接用了 orderStatus、createTime 这种我习惯的写法。同样的需求翻译成英文再试一次，生成的组件结构几乎一样，但中文注释全变成英文，变量命名也偏直译。\n\nTrae 使用体验 里最省时间的是报错解释：把中文报错贴进对话框，它会给中文排查步骤；英文报错反而解释得更细。所以我的用法是需求说中文、技术细节给英文关键字，两边的好处都拿到。\n\n## 额度与价格实测\n免费版每月 500 积分，所有功能可用，云端任务同时跑 2 个。我一周写 5 天、每天提 6 到 8 个需求，一周下来用了约 210 积分，其中一次重构吃掉了 80 积分。按这个量算，500 积分够两周多一点，写一周代码完全够，但如果天天让 Agent 从零搭页面，一周就见底。\n\nTrae 中文 IDE 的额度规则不复杂：Trae 国内版 免费额度 每月 500 积分，凌晨刷新；高峰时段会下调，晚上 8 点后同样的任务更费积分。Trae 国内版 免费额度 的另一面是云端任务排队，免费用户等 1 到 2 分钟很常见，付费档才优先响应。Lite 每月 49 元、Pro 每月 99 元，价格不算贵，但云端任务并发数差一半，赶工期才需要升。这 500 积分正常写两周没问题，预算够用。\n\n## 三个坑\n一是国内版和国际版账号不互通，用抖音登录的账号在国际版里不认，反过来也一样，注册前想清楚。二是代码会上传云端处理，公司项目先看合规，别把密钥和客户数据放进对话。三是它内嵌的 VS Code 插件市场和官方不完全同步，某些插件装不上，得用命令行手动补。另外中文变量命名要克制，拼音缩写混着写，过两周自己都看不懂。中文报错解释偶尔会把 undefined 说成「未定义对象」，别全信，回代码里看类型。\n\nTrae Builder 生成后别整段接受，我一般是先跑起来看页面，再逐文件过 diff，最后补注释。\n\n## 总结\nTrae 中文 IDE 体验 的结论是：中文需求理解确实省心，免费 500 积分够日常写代码，不够连续高强度搭建。把它当“会中文的结对助手”，而不是全自动工程师，预期就对上了。","path":"articles/code/10-trae-chinese-ide-review.md"},{"id":"code-11-aider-git-commit","title":"Aider git 提交：自动提交该不该","category":"code","keywords":["Aider git 提交","Aider 自动提交","Aider 配置"],"longtail":["Aider 自动提交 关闭","Aider 提交信息 自定义"],"tags":["Aider","git","CLI"],"content":"第一次用 Aider，我盯着终端看它每改一个文件就自己 `git commit` 一次，半小时仓库里多了 17 个 commit，提交信息全是英文一句话。一开始觉得省事，第三天回滚一个改动时才发现历史被切得太碎，找不回“改之前能跑”的那个点。Aider 的自动提交是设计特性，不是 bug，问题在于大多数人没配 dirty-commits。这篇写我怎么判断 Aider git 提交 该自动还是手动。\n\n## 默认行为与常用配置\nAider 默认每轮编辑后自动提交，提交信息由它生成。安装是 `pip install aider-chat`，启动 `aider --model deepseek/deepseek-chat`，用 `/add src/order.py` 指定文件，`/diff` 看改动，`/undo` 撤回上一轮。Aider 还有 `/git` 命令能看仓库状态，改文件前先跑一次，确认工作区是干净的。要关自动提交，启动加 `--no-auto-commits`，或者写进 `~/.aider.conf.yml`：\n```yaml\nauto-commits: false\ndirty-commits: false\ncommit-prompt: \"用中文写一行 conventional commit，不超过 50 字\"\n```\n`dirty-commits: false` 很关键，它保证工作区有未提交改动时 Aider 不硬提交，避免把别人的改动卷进你的 commit。Aider 配置 里这两行，是我踩过坑之后加的。\n\n## 什么时候开，什么时候关\n重构和调试阶段我关掉自动提交，改成每验证一步手动 `/commit`；写新功能时开着，因为小步提交正好符合我的节奏。判断标准只有一条：我能不能在一次提交的粒度内跑通测试。能，就自动；不能，就手动。第一次把 Aider 自动提交 关闭 时我还有点担心，跑了一周发现手动反而更可控。Aider 提交信息 自定义 之前，先想清楚 Aider 自动提交 关闭 之后谁决定提交时机，Aider git 提交 的节奏就是你的 review 节奏。关掉自动提交后，git log 干净很多，回滚也方便。我在每轮结束时会集中看一遍 diff，确认没有顺手改的无关文件。Aider 提交信息 自定义 成中文挺好用，但别超过 50 字，超过之后 git log 一行显示不全。\n\n一天下来手动模式大约 6 到 8 个 commit，自动模式是 20 个往上，差别不在数量，在可读性。开了自动提交也别让它在同一文件上连改五轮，五轮就是五个 commit，中间态没法用，我一般一轮只提一个文件。\n\n## 三个坑\n一是自动提交会把未完成代码写进历史，中断后你再回来，分不清哪个 commit 是半成品。二是 Aider 只提交它改过的文件，但如果你之前有未提交改动，容易和它的改动混在一起，`dirty-commits: false` 能挡一部分。三是提交信息默认英文，团队要求中文规范就提前配置，否则事后再改一遍很痛苦。\n\n另外大仓库开 repo map 会消耗不少 token，DeepSeek 一轮大约几毛钱，但长会话累积起来也不少；Aider 的 `/tokens` 能看当前用量。token 成本也要算：repo map 默认打开，大仓库一轮 4 万 token 起步，`--map-tokens 1024` 能压下来。提交信息模板我固定带模块名，比如 feat(order): 支持批量取消，回看时一眼认范围。\n\n## 总结\nAider git 提交 的取舍标准很简单：能一次跑通测试就自动，跑不通就手动。把 auto-commits 和 dirty-commits 写进配置文件，比每次命令行加参数可靠。历史干净，回滚才有意义。Aider 自动提交 不是不能用，是要知道什么时候不该用。","path":"articles/code/11-aider-git-commit.md"},{"id":"code-12-devin-alternative-budget","title":"Devin 平替 预算：每月20美元能买到什么活","category":"code","keywords":["Devin 平替","Devin 预算","AI 编程预算"],"longtail":["Devin 平替 预算方案","Devin 替代品 对比"],"tags":["Devin","预算","AI编程"],"content":"团队今年要压预算，老板问我 Devin 还要不要续。我把上季度账单翻出来算了一遍：Devin 每月起步 20 美元，按“智能体计算单元”计费，每单元 2.25 美元，一个中等 PR 大约吃 8 到 15 个单元，实际月账单在 80 到 120 美元之间。这篇 Devin 平替 预算 记录，是我们试了三条替代路线之后的结论，数据都来自上季度实际账单。\n\n## 先把 Devin 的账算清楚\nDevin 2.0 的入口价是每月 20 美元，包含少量额度，超出按 2.25 美元每单元计费，团队版 500 美元起。它的优点是任务闭环：给一个 issue，它自己读仓库、改代码、跑测试、开 PR。缺点是计费不透明，单元消耗和执行时间、重试次数有关，同样一个需求，它状态好的时候 9 个单元，卡住重试能烧到 20 个。我们上季度 6 个 PR 花了 133 美元，平均每个 22 美元。ACU 消耗和复杂度强相关，读 30 个文件的任务比读 5 个的贵三倍；任务描述里写清文件路径，平均能省 3 个单元。\n\n这笔钱值不值，取决于你有没有人 review。没人 review 的 PR 再便宜也是负债，这是我算完账最大的感受。\n\n## 三条平替路线的价格\n第一条是 Claude Code：Pro 每月 20 美元，Max 5x 每月 100 美元，按 5 小时窗口限流，复杂任务用 Max 更稳，我们实测一个同类 PR 的订阅成本接近 8 美元。第二条是 Codex CLI，ChatGPT Plus 20 美元自带额度，轻量任务够用，重任务容易撞限流。\n\n第三条是 Cline 加 API：插件免费，钱花在模型上，DeepSeek 一天调 40 次不到 3 元人民币，一个月 60 元上下，配合人工拆任务，一个 PR 成本 5 到 10 元。第四条路是 Windsurf Pro，每月 15 美元给 500 credits，适合多文件改动，但它不是全托管，PR 还得自己开。Devin 平替 预算方案 里我最推荐 Cline 这条，因为成本可控、上限取决于你怎么拆任务，而不是平台怎么计价。Devin 替代品 对比 下来，只有需要“完全托管、自动开 PR”的场景才值得为 Devin 付溢价。\n\n## 三个坑\n一是 ACU 计价不透明，做预算务必按上限估，别按平均值，我们第一次就超支 40%。二是低价方案的 token 费用会失控，尤其把整个仓库塞进上下文的时候，Cline 的 Max Requests 一定要设。三是人工 review 成本别忽略，Devin 的 PR 平均要看 25 分钟，平替方案 15 分钟，但总量多，月累计反而差不多。\n\n再补一条：团队并发上来了，Claude Code 的 5 小时窗口会互相挤，最好按人分配账号，别共享。还有额度周期，Devin 的额度按月清零，月中买的套餐别指望留到下月。\n\n## 总结\nDevin 平替 预算 的答案是：如果每月 20 到 100 美元，用 Claude Code 或 Cline 加 API；如果任务量大且需要全托管，再考虑 Devin 团队版。先把账按上限算清楚，再决定买哪条路。这份 Devin 平替 预算方案 按任务量分三档，Devin 替代品 对比 里最省心的还是 Cline。预算表我贴在团队 wiki 里，每季度按账单更新一次。按月摊到每个 PR，预算表一眼就能看懂，开会也不用现算。","path":"articles/code/12-devin-alternative-budget.md"},{"id":"code-13-sourcegraph-cody-code-search","title":"Sourcegraph Cody 代码搜索 技巧","category":"code","keywords":["Sourcegraph Cody","Cody 代码搜索","Sourcegraph 搜索语法"],"longtail":["Sourcegraph Cody 代码搜索 技巧","Cody 搜索私有仓库"],"tags":["Sourcegraph","代码搜索","Cody"],"content":"排查一个支付回调重复执行的 bug，本地 grep 只能搜一个仓库，而我们拆了 40 个微服务、约 800 万行代码，光定位回调入口就花了半天。后来改用 Sourcegraph Cody 代码搜索，同样一句查询，三十秒内定位到 3 个仓库、7 处调用。这篇把过滤器的顺序和语法写清楚。\n\n## 三组过滤器的正确顺序\nSourcegraph 搜索框支持 `repo:`、`file:`、`lang:`、`type:` 这些过滤器，关键是顺序：先用 `repo:` 圈定仓库范围，再叠 `file:` 或 `lang:` 收窄文件类型，最后才是正文关键字。比如找支付回调入口：`repo:^github\\.com/org/pay-.*$ file:\\.(java|kt)$ lang:java 回调`。反过来先写正文关键字，引擎会全量扫一遍再过滤，慢十倍不止。\n\n正则要包在斜杠里，比如 `/callback[a-z]*Handler/`，比纯文本模糊匹配准得多。查历史改动用 `type:diff` 加 `after:2026-01-01`，能直接看到谁在哪次提交里改了这段逻辑。`select:repo` 只返回仓库名，统计影响面时很好用，`count:1000` 可以把默认结果上限拉满。`repo:has.file(go.mod)` 这类谓词能把范围缩到有依赖清单的仓库，我常和 `lang:` 一起用。\n\nCody 代码搜索 还会读你当前打开文件的上下文，问“这个接口还有哪些调用方”时，命中率比纯搜索高。\n\n## 结果怎么读、权限怎么算\n搜私有仓库的前提是账号在团队实例里有对应权限，Sourcegraph 会继承 GitLab 的访问控制，没权限的仓库搜不出来，也看不到片段。自建实例的索引不是实时的，新提交到可搜大约 5 分钟延迟，急查新代码就加 `type:diff` 限定最近提交。Cody 搜索私有仓库 时，跨仓库的结果建议先看仓库列表，再逐仓库点进去核对，别直接照抄片段。\n\nSourcegraph Cody 代码搜索 技巧 里最实用的一条是组合搜索：把 `repo:` 的范围存成收藏，下次换关键字只改正文，省掉重复输入。Cody 聊天框里可以让它先搜再答，问“payCallback 在哪些仓库被调用”时，先搜索再让模型总结，比直接问准。\n\n## 三个坑\n一是正则写太宽会触发慢查询，单次搜索超过 10 秒会被掐断，报超时不是没结果。二是索引延迟容易误判“代码没搜到”，先确认最近提交时间。三是权限没配好会搜出空结果，别急着怀疑语法。\n\n另外要提醒：Cody 的免费版和专业版已于 2025 年 7 月 23 日下线，现在个人能用的是企业版或换别的工具，别再照旧教程去开通。Sourcegraph Cody 代码搜索 技巧 里，Cody 搜索私有仓库 前先确认实例地址和账号，否则搜出来是空的。自建实例的索引维护成本也要算进去，40 个仓库每天增量索引大约占用一台 8 核机器。四是搜索结果只展示命中的几行，别拿片段当完整上下文，点进文件再看 30 行，这三条我每周都会碰到一次。习惯之后，搜索比 grep 快的不是一点半点。\n\n## 总结\nSourcegraph Cody 代码搜索 的核心是三组过滤器的顺序：repo 圈范围、file/lang 收类型、内容最后写。把常用查询存成收藏，配合 type:diff 查历史，比 grep 快一个量级。","path":"articles/code/13-sourcegraph-cody-code-search.md"},{"id":"code-14-doubao-marscode-api-debug","title":"豆包 MarsCode 接口调试：四步定位502","category":"code","keywords":["豆包 MarsCode","MarsCode 接口调试","MarsCode API 测试"],"longtail":["豆包 MarsCode 接口调试 步骤","MarsCode 云函数 调试"],"tags":["豆包MarsCode","接口调试","云函数"],"content":"联调时本地一切正常，部署到线上就报 502，前端同学把截图甩过来，我第一反应是去翻服务器日志。后来用 豆包 MarsCode 的 DevTools 把整条请求链路重放了一遍，十分钟定位到是云函数冷启动超时。这篇把 MarsCode 接口调试 的四步流程写下来。\n\n## 四步把请求重放一遍\n第一步，在 MarsCode IDE 左侧打开云开发面板，进入 API 测试工具。第二步，按线上报错的请求填四样东西：Method、URL、Headers、Query 参数，Body 选 JSON 并把示例报文贴进去。第三步，点发送，重点看三处：响应状态码、响应体里的错误字段、响应耗时。第四步，把这次请求保存成用例，改一个变量再发一次，确认问题能稳定复现。\n\n我那次 502 的响应耗时是 3.2 秒，而本地是 180ms，差距直接指向冷启动。MarsCode API 测试 好用的地方是它跟云函数日志在同一界面，发完请求立刻能看到对应实例的日志，不用在两个系统之间跳。\n\n如果报错信息看不懂，把响应体和日志一起丢给侧边栏的 AI，让它用中文解释可能原因，再按它给的排查顺序逐条验证。\n\n## 云函数的调试细节\nMarsCode 云函数默认有冷启动，首次调用要 1 到 3 秒，网关超时设的是 3 秒，刚好卡在边界上。定位方法是连续发三次同一请求：第一次慢、后两次快，基本就是冷启动。解决办法要么把超时调到 5 秒，要么加一个定时预热，每 5 分钟打一次。\n\nMarsCode 云函数 调试 还可以用环境变量区分本地、预发、线上三套配置，切换环境不用改代码。部署前记得在 API 测试工具里把三套环境的同一接口各跑一遍，我吃过一次预发正常、线上 502 的亏，原因就是环境变量少了数据库地址。云函数日志默认保留 7 天，排完把关键请求 ID 存下来，下次复现省事。\n\n接口文档也能顺手生成：对着请求和响应各发一次，让它生成 JSON Schema，前端直接拿去当类型定义。\n\n## 三个坑\n一是把冷启动当 bug 修，改了半天代码其实是超时配置问题。二是测试用例里存了生产环境的 token，同事分享用例时把凭证带出去了，建议用环境变量占位。三是环境变量改了不重新部署，云函数读到的还是旧值，表现为“代码明明改了却没生效”。\n\n把这套 豆包 MarsCode 接口调试 步骤 存成模板，第二次遇到 504 套一遍 豆包 MarsCode 接口调试 步骤，省时间。同样的顺序也适用于 MarsCode 云函数 调试。CORS 预检请求也会 502，先看 OPTIONS 请求。另外 API 测试工具发的是外网请求，内网接口要提前加白名单。我一般把复现步骤写进用例备注，交接时省一半沟通。\n\n## 总结\n豆包 MarsCode 接口调试 的四步是填请求、看三处、存用例、对日志。把冷启动、环境变量、CORS 三个高频原因排掉，大部分线上 502 都能在十分钟内定位。","path":"articles/code/14-doubao-marscode-api-debug.md"},{"id":"image-01-midjourney-v7-character-consistency","title":"Midjourney v7 角色一致性实战","category":"image","keywords":["Midjourney v7 角色一致性","--oref","--cw"],"longtail":["Midjourney v7 角色一致性怎么调","--oref 和 --cref 区别"],"tags":["Midjourney","角色一致性","AI 绘画"],"content":"做 12 格连载条漫，最崩溃的不是分镜，是第 7 格主角突然换脸。我上个月接了个虚拟博主的项目，前 3 张用图生图还能糊弄，到第 5 张鼻子塌了、手臂也粗了一圈。后来把流程换成 v7 这套角色参数，返工率从七成压到一成以内，这篇把Midjourney v7 角色一致性怎么调的笔记一次写清。\n\n## --oref三步锁脸\n\n第一步攒素材：一张正脸、一张四分之三侧脸、一张半身，白底 1024×1024 最好，别用美颜过的图，磨皮会把痣和下颌线一起抹掉。第二步在 /imagine 末尾加--oref图链 --ow 800，--ow 的范围是 0~1000，默认只有 100，想锁脸基本要拉到 700 以上。第三步提示词只写场景、光线、服装，脸型、眼睛、发型全部交给参考图，两边都描述会互相打架。\n\n实测 --ow 800 是甜点值，脸够像还能换姿势；拉到 1000 衣服和构图一起被锁死，4 张里 3 张是同一个站姿；降到 400~600 适合远景和背影，反正远景看不清五官。每次只动一个参数，出 4 张对比再决定下一步，别一口气换三个条件。\n\n多人同框时--oref只能锁一个主体，第二个人常被画成参考图的影子。我试过同时挂两个--oref，结果只认最后一张，最后还是拆成两张单人图再合成，--cw 0 用来只保发型、放开服装。这个坑我踩过一次，白排了 12 张图。\n\n## --oref 和 --cref 区别\n\n先说--oref 和 --cref 区别：v6.1 里 --cref 图链--cw 100 锁脸锁衣，--cw 0 只锁脸，发型服装相对自由；v7 把权重逻辑换成 --ow 之后，新项目我直接上--oref，素材是带帽子和配饰的旧图，才退回 v6.1 用--cw 0 把帽子摘掉。两套参数别混着写，混用会互相抵消。\n\n踩过的三个坑：一是 --ow 拉满还硬要换姿势，4 张全是同一站姿，白跑 20 分钟；二是参考图带了水印和袖口小 logo，三张成图全继承下来，只能重拍素材；三是同时加 --sref 想统一画风，风格权重会分走脸的部分，--sref 100 时脸明显变路人，压到 20 再固定 seed 才稳住。\n\n## 批量出图的耗时账\n\n一套 12 格我分两轮跑：第一轮用 --draft 出草稿，每批 4 张约 10 秒，先看构图和姿势，选中再放大精修；第二轮才开正式质量，只跑选中的 4 张。整个项目从改稿 3 小时压到 40 分钟，最后只有 2 张手部需要局部补画。\n\nMidjourney v7 角色一致性怎么调，我的排查顺序是素材→--ow→seed，不要反过来。脸不像先查素材角度，姿势不对再降权重，画面发灰最后才动 seed。这套参数卡我贴在显示器边上：正脸、白底、--ow 800、固定 seed，四个条件缺一个都容易翻车。\n\n## 总结\n\n锁脸就三件事：素材干净、提示词不描述五官、--ow 从 800 起试。换姿势先降权重，迁移旧图记得--cw 0。成稿后固定 seed，微调只改场景词，脸才不会漂。另外别在同一个页面反复换--oref链接，缓存会让权重乱跳，新开一个 /imagine 链接更稳。这套Midjourney v7 角色一致性流程照抄参数就能跑，剩下的交给选图。","path":"articles/image/01-midjourney-v7-character-consistency.md"},{"id":"image-02-stable-diffusion-3-5-inpainting","title":"Stable Diffusion 3.5局部重绘","category":"image","keywords":["Stable Diffusion 3.5 局部重绘","denoising strength","蒙版羽化"],"longtail":["SD3.5 局部重绘参数怎么调","SD3.5 换手重绘"],"tags":["Stable Diffusion","局部重绘","ComfyUI"],"content":"给一组汉服写真换手，原图左手插兜看不出问题，右手却是六根手指。我在 ComfyUI 里用Stable Diffusion 3.5 局部重绘修手，20 张修好 17 张，剩下 3 张只能重拍角度，这篇把SD3.5 局部重绘参数怎么调讲透。16GB 显卡跑 1024×1024、批量 4 张约 90 秒，比 SDXL 慢一截，但手指结构和布料纹理稳得多。\n\n## 参数表与操作步骤\n\n1. 原图接 Load Image 和 SD3.5 专用的 InpaintModelConditioning 节点，蒙版只涂手部，边缘多留 8~12 像素。\n2. 蒙版羽化设 8，太大手会糊，太小接缝冒白边。\n3. denoising strength从 0.45 起试，换手用 0.5~0.55，改表情 0.35~0.4，改整件衣服到 0.6。\n4. 步数 28、CFG 4.5、采样器 dpmpp_2m，尺寸 1024×1024。\n\n提示词写清\"右手、五根手指、自然下垂\"，英文的 left hand 比中文\"左手\"更不容易误解。这三个入口调完，再谈采样器和步数才有意义。\n\n蒙版手绘时我用 20 像素画笔描三遍：先描轮廓、再向外扩 3 像素、最后修指尖。SD3.5 的 inpaint 节点只认纯白和纯黑，灰色过渡会带出半透明噪点。这个坑我踩过一次，蒙版边缘发灰，重绘后手指像蒙了一层雾，重新二值化才干净。这套SD3.5 局部重绘参数怎么调的起手式其实就是蒙版。\n\n## 蒙版和强度的关系\n\nInpaintModelConditioning 对蒙版边界很敏感，蒙版羽化为 0 时接缝处会浮出一圈灰边，所以我把羽化固定成 8，再用denoising strength调改造幅度。实测 0.6 是分水岭：低于它只改纹理，高于 0.7 会连周围皮肤毛孔一起重画，人脸忽然变年轻。整只手重绘，我会把附近 2 厘米皮肤一起框进蒙版，给模型留过渡区。\n\n两个坑：一是 SD3.5 Large 的 bf16 权重在 16GB 卡上会 OOM，换 fp8 才跑得动，但 fp8 下戒指高光会丢；二是中文写\"左边的手\"常被理解成画面左侧，用英文 left hand 最稳。SD3.5 换手重绘时我会把 denoise 压到 0.5，再补一段手部描述，成功率比默认参数高一截。\n\n## 与 SDXL 的对照\n\n同一张图分别用Stable Diffusion 3.5 局部重绘和 SDXL 换手：SDXL 4 张里 2 张手指粘连，SD3.5 4 张里 1 张有问题；耗时从 55 秒涨到 90 秒，但省掉一轮返工。改表情时我把denoising strength降到 0.38，蒙版只框嘴巴和下巴，眼神不会被带着一起变。\n\n对照下来，SD3.5 在小面积精细修补上更稳，SDXL 在大面积换背景时更快。我的用法是手指、五官交给 SD3.5，换衣服、换天空还用 SDXL，两套模型在 ComfyUI 里各存一个模板，切换只改 loader。SD3.5 换手重绘的经验也一样，别拿一个模型解决所有问题。\n\n批量修图时我把 20 张排进队列，每张只换 seed 和左右手描述，蒙版与强度不动。有一次忘记换 seed，20 张修出 20 只一模一样的手，白跑一小时；从那以后我把 seed 写在提示词旁边的便签上，改完一张划掉一个。\n\n## 总结\n\n换手 0.5、改表情 0.35、换衣 0.6，蒙版羽化 8，步数 28，CFG 4.5，16GB 显存上 fp8，24GB 以上优先 bf16。蒙版多框一点过渡区，提示词用英文写左右手。这套Stable Diffusion 3.5 局部重绘流程慢一点，但省下的返工时间值回票价。","path":"articles/image/02-stable-diffusion-3-5-inpainting.md"},{"id":"image-03-flux1-dev-low-vram-quantization","title":"Flux.1 dev 低显存 量化：三档取舍","category":"image","keywords":["Flux.1 dev 低显存 量化","GGUF","T5 编码器"],"longtail":["Flux.1 dev 8G 显存怎么跑","Flux GGUF 量化版本怎么选"],"tags":["Flux","低显存","ComfyUI"],"content":"宿舍那台 4060 只有 8GB 显存，第一次加载 Flux.1 dev 原版直接黑屏。后来把模型换成GGUF的 Q4_K_S，再把 T5 文本编码器单独换成 fp8 版，才在 ComfyUI 里跑起来。这套Flux.1 dev 低显存 量化方案我用了三个月，1024×1024 单张 35~50 秒，峰值显存 7.6GB。\n\n## 三档量化怎么选\n\nQ4_K_S 约 6.8GB，是 8GB 卡唯一稳的选择，画质损失最小但手指和细毛发容易糊，配 20 步、guidance 3.5、euler 加 sgm_uniform 刚好。Q5_K_M 约 8.2GB，12GB 卡跑得动，细节好一档，出图慢 6 秒左右。Q8_0 和 fp8 要 12GB 以上，16GB 卡能让编码器和 UNet 常驻，省掉反复加载的等待。\n\n三档我用同一段提示词各跑 10 张，Q4 和 Q8 的肉眼差别主要在远景，人物特写几乎一致。所以Flux GGUF 量化版本怎么选，先看显存余量，再看你要不要放大局部。\n\n除了主模型，VAE 也别忽略。Flux 的 ae.safetensors 只有 300MB 左右，但 fp16 版解码 1024 图会多吃 1.2GB 显存，换 fp8 VAE 能再挤出一点余量。T5 编码器和 VAE 都换成 fp8 之后，8GB 卡才有余量开 2 张批处理。\n\nFlux.1 dev 8G 显存怎么跑在老卡上还有一招：把分辨率降到 768 出底图，再用一点五倍放大模型拉到 1152，整体比 1024 直出慢 10 秒，但不会爆显存。\n\n## 显存账与避坑\n\nFlux 的显存大头不是 UNet 而是 T5-XXL，原版 fp16 要 9GB 以上，必须换 t5xxl_fp8 或GGUF版，否则 8GB 卡永远卡在加载那一步。坑有三个：一是打开 --lowvram 后出图从 40 秒涨到 2 分钟，8GB 卡宁可用 Q4 也别开；二是 Q2_K 看着能跑，人脸直接塌成塑料，别为省 2GB 牺牲成品率；三是 ComfyUI 的GGUF加载节点没装会报 Node not found，先补 Unet Loader GGUF再谈出图。\n\n另外T5 编码器别和 UNet 同时塞满显存，我习惯先加载编码器出提示词向量，再切换主模型，峰值能压到 7.6GB。\n\n## 速度和画质的折中\n\n同一提示词，Q4 单张 35 秒、Q5 42 秒、fp8 38 秒（12GB 卡），但 Q4 在 8GB 卡上是唯一不爆显存的。Flux.1 dev 8G 显存怎么跑的答案就是 Q4_K_S 加 fp8 文本编码器、1024 分辨率单张出，别开批处理。\n\n我现在 8GB 卡用 Q4 出草稿，重要图借 12GB 卡跑 Q5，两套参数在 ComfyUI 里存成模板。Quant 版本升级时先跑 3 张对比再换，不然容易在交付前夜发现画质掉了一档，Flux.1 dev 低显存 量化的坑大多出在临时换模型上。\n\nFlux GGUF 量化版本怎么选时别只看文件名，Q4_K_S 和 Q4_K_M 的差别在关键层保留精度，后者大 0.4GB 但手指更稳，8GB 卡关掉其他程序可以优先试 K_M。\n\n换模型后记得清 ComfyUI 的缓存，不然旧工作流会继续引用上一版权重。我踩过这个坑：以为换了 Q5，出图还是 Q4 的画质，查了半天是节点缓存没刷新。\n\n跑稳之后我把常用参数写成了批处理脚本，出图前先打印当前显存占用，超过 7.2GB 就把批处理改成 1。T5 编码器换成 fp8 之后，提示词超过 200 字时显存还会涨 0.3GB，写长提示词前先删掉重复描述。\n\n## 总结\n\n8GB 卡：Q4_K_S 加 t5xxl_fp8、guidance 3.5、20 步，单张 35 秒；12GB 卡换 Q5_K_M。别开 lowvram，别碰 Q2。显存不够本质是分辨率问题，1024 顶不住就先出 768 再放大，这套Flux.1 dev 低显存 量化组合够日常商用。","path":"articles/image/03-flux1-dev-low-vram-quantization.md"},{"id":"image-04-jimeng-ai-ecommerce-hero-image","title":"即梦 AI 电商主图：白底出图六坑","category":"image","keywords":["即梦 AI 电商主图","白底主图","局部重绘"],"longtail":["即梦 AI 电商主图怎么做","即梦 AI 商品图白底"],"tags":["即梦","电商主图","AI 设计"],"content":"开饰品店的朋友要 6 张白底主图，外包报价 300 元一张，我拿即梦图片 3.1 做了一版，从修图到出图 25 分钟搞定。先把即梦 AI 电商主图怎么做这件事拆成三步：抠图、换底、补光影，流程固定成模板后闭眼也能复制。\n\n## 三步出图\n\n1. 原图上传即梦\"图片编辑\"，先智能抠图，发丝边缘用画笔补 2~3 笔。\n2. 选背景替换，提示词写\"纯白背景、柔和顶光、商品下方浅灰投影\"，比例 1:1，输出 2000×2000。\n3. 局部重绘修掉原图价签和反光，重绘强度 0.35，蒙版多框 5% 边缘。\n\n同一款耳环一次出 4 张，挑 2 张换角度补拍，一天能铺 30 个 SKU。白底主图别直接拿原图套模板，先看商品本身的高光位置，再让 AI 顺着原有光线打光，出片才不假。\n\n抠完图别急着换底，先在透明背景上检查轮廓，尤其吊坠镂空处，AI 有时会把窟窿填成金属。这个坑我踩过：6 张里 1 张吊坠变形，返工才发现原图只有 800 像素，放大到 2000 后细节全丢。这套即梦 AI 电商主图的检查步骤花不了 2 分钟，却能省一轮返工。\n\n## 白底图的合规细节\n\n电商平台主图白底占比普遍要求 80% 以上，生成后要检查四周有没有被阴影压灰。我吃过两个亏：一是提示词写\"高级感\"，背景出现浅灰渐变，白底不达标；二是商品 logo 被改形，字母 R 变成 P，只能后期贴回原图 logo。免费积分每天够出 30~40 张 1:1 图，商用前核对授权说明。\n\n另外，局部重绘不要碰商品主体，只修价签、灰尘和多余反光，重绘强度超过 0.5 会把金属纹理改平。这套即梦 AI 商品图白底的规范我按 2000×2000、300dpi 导出，单张压到 500KB 以内再上传，避免平台二次压缩糊成一片。\n\n## 批量参数与案例\n\n6 张主图里 2 张银饰、4 张珍珠，我准备三套参数：银饰加\"金属反光、冷白背景\"，珍珠加\"柔和光、米白背景\"，再把白底主图统一成同一色温，避免列表页看着忽冷忽暖。\n\n整套比外包省 600 元，交付从 3 天压到半天。即梦 AI 电商主图怎么做的关键不是提示词多花哨，而是把抠图、背景、阴影拆开做，哪一步不达标就单独重跑那一步。这套即梦 AI 商品图白底流程也适合箱包和鞋类，换商品材质词即可。\n\n交付前再抽一张放大看字母和金属边缘，AI 偶尔会把品牌字母连笔，白底上特别显眼；另一处坑是投影方向，光从左边来、影子却朝左，一眼假。这两项检查完再打包，省得店主收货又退回来。\n\n## 总结\n\n抠图补发丝、背景写光位、投影别省、局部重绘 0.35 修杂物，最后检查白底占比和 logo。即梦出图快，但文字细节和商用授权必须人工过一遍，批量上传前最好抽 2 张放大检查。","path":"articles/image/04-jimeng-ai-ecommerce-hero-image.md"},{"id":"image-05-kling-image-to-image-chinese-style","title":"可灵 图生图 国风插画：转绘强度 0.55 实测","category":"image","keywords":["可灵 图生图 国风插画","转绘强度","负面提示词"],"longtail":["可灵 图生图 国风插画怎么调","可灵转绘强度多少合适"],"tags":["可灵","图生图","国风插画"],"content":"汉服店主给我 8 张平铺图，想要水墨风插画做详情页。真人照片直接转国风最容易翻车，脸被画成塑料是常事，领口绣花也会糊成一团。\n\n我用可灵 2.5 的图生图跑了两轮，把转绘强度定在 0.55，8 张里 6 张能直接用。这篇记录可灵 图生图 国风插画怎么调的参数和踩坑。\n\n## 参数与提示词\n\n参考图放原片，转绘强度 0.55，比例 3:4，一次出 2 张。提示词写\"水墨淡彩、工笔勾线、宣纸质感、大面积留白、人物五官保留原貌\"，负面提示词加\"3D、塑料、现代建筑、浓妆\"。\n\n转绘强度 0.5 以下保留原图太多，像加了层滤镜；0.65 以上脸开始变形，眼距忽宽忽窄。有人问我可灵转绘强度多少合适，我一般让他在 0.5~0.65 之间按风格试，别一次拉满。\n\n参考图别选逆光和强阴影的片子，模型会把阴影当花纹画进衣服里。我试过一张窗边侧光片，转绘后右肩多出一片青灰色块，只能换图重跑，这个坑值 20 分钟。\n\n## 三种风格分开调\n\n工笔风强度 0.6，提示词加重\"细线条、淡赭石色\"；水墨风 0.55，\"墨色晕染、飞白、宣纸\"；敦煌风 0.5，\"土红、青绿、壁画斑驳\"。三种风格分开存参数，别指望一套提示词通吃。\n\n可灵 图生图 国风插画怎么调，我的经验是先定风格再调强度，别一边改风格一边改强度，否则每次都不知道是哪个参数起的作用。负面提示词里固定写\"3D、塑料\"，能少一半翻车。\n\n## 三个坑与交付\n\n第一坑：强度拉到 0.7 想更国风，五官全糊只能重跑；第二坑：水墨风全身像，发丝和衣带会糊成一片，改半身构图才干净；第三坑：免费额度出图带平台水印，商用前确认会员权益。\n\n8 张图从接单到交稿 40 分钟，店主拿去做详情页头图，比找画师 300 元一张省不少。可灵转绘强度多少合适，用\"人脸不变形、衣纹有笔触\"当判断标准，宁可多跑两次也别一次拉满。\n\n批量交付前我会先按同一提示词出 6 张，挑 2 张微调，其余统一参数，避免 8 张图像 8 个画师画的。转绘强度这套数值换题材要重测，汉服和旗袍的衣纹密度不一样，别照抄。\n\n会员导出分辨率也要问清：免费额度给 1024 宽，做详情页头图够用，做印刷就得开会员。先把用途问清楚再充值，别买完发现用不上，这是另一个常见的坑。\n\n交付前我还会把成图丢回可灵做一次 1.05 倍的轻度放大，边角衣纹会实一点；这步别超过 1.2 倍，否则笔墨的飞白会被抹平。\n\n## 总结\n\n0.55 起步，按风格在 0.5~0.65 之间微调，半身优先，负面提示词拦塑料感。可灵快在出图，慢在试强度，先出 2 张确认脸没变形，再批量跑剩下的，这套可灵 图生图 国风插画流程就能稳定交付。","path":"articles/image/05-kling-image-to-image-chinese-style.md"},{"id":"image-06-nano-banana-editing-prompts","title":"Nano Banana 修图 提示词：四段模板","category":"image","keywords":["Nano Banana 修图 提示词","提示词模板","多轮编辑"],"longtail":["Nano Banana 修图 提示词怎么写","Nano Banana 局部修图"],"tags":["Nano Banana","AI 修图","提示词"],"content":"上周要把 12 张手机拍的咖啡图做成菜单页，背景乱、杯子歪，客户只给两天时间。\n\n我用 Nano Banana 逐张改，一条提示词只改一处，平均 2 轮到位。这篇把Nano Banana 修图 提示词怎么写的四段式模板和三个反例写清，照抄能省一半返工。\n\n## 四段式模板\n\n第一段写保留：保留杯子形状、拉花图案、桌面木纹。第二段写改动：把背景换成浅灰水泥墙。第三段写光线：左上方柔光，杯子右侧留接触阴影。第四段写禁止：不要改杯身文字，不要加多余道具。\n\n这个提示词模板一次别超过两件事，改背景和改光线分两次发。写的时候用具体名词和数值方向，比如\"边缘向右延伸 10 厘米\"，比\"稍微左移\"可靠得多。如果只是去个路人，直接走Nano Banana 局部修图更省事。\n\n四段式写顺手后，我把提示词模板按品类存了 4 套：咖啡、烘焙、鞋包、饰品。每套只改前三段的名词，禁止段通用，改一个词就能换场景，比每次从零写快得多。\n\n多轮编辑的顺序建议从大到小：先换背景，再改光线，最后修细节。反过来先修细节，背景一换又冲掉了。这个坑我在第一版菜单图上踩过，顺序错了重来 3 遍。\n\n## 三个反例\n\n反例一：写\"把图变高级\"，模型只会叠滤镜，等于没改。反例二：一次让它换背景、去水印、加倒影、调色，四件事同时上，杯子把手直接消失。\n\n反例三：中文写\"微微左倾\"，模型把整张图旋转，改成\"杯身保持竖直、桌面水平线倾斜\"才对。多轮编辑时每轮只改一个元素，改完立刻另存原图备份，否则第三轮会把第一轮的结果也覆盖掉。\n\n## 局部修图与额度\n\nNano Banana 局部修图不需要画蒙版，直接说\"只改右上角那片墙面\"即可，但边缘 5 像素内可能被连带重绘。免费版有次数限制、生成图带水印，批量商用前先确认额度。\n\nNano Banana 修图 提示词怎么写的要点是具体名词加数值方向，别用形容词。我把提示词模板存进备忘录，12 张图从 3 小时压到 40 分钟，返工 2 张，这套做法换到鞋包类目同样能用，只是材质词要换。\n\n另提醒一句，生成图里若出现别人的 logo 或人脸，商用前要确认商标与肖像授权。AI 改图很容易把原图包装上的小字也带进来，这个坑比参数调错更贵，我见过同行因此整组详情页下架重做。\n\n同一套四段式也能用来在图上加文字，但中文要写清位置和字号，比如\"右下角加两行小字，字号是主标题的三分之一\"，不写清楚字号它会放大到占满画面。\n\n## 总结\n\n保留、改动、光线、禁止四段走，一轮只改一件事，方向用左、右、竖直这类硬词。这套Nano Banana 修图 提示词模板快在自然语言，慢在贪多，克制比技巧重要。","path":"articles/image/06-nano-banana-editing-prompts.md"},{"id":"image-07-comfyui-workflow-reuse","title":"ComfyUI 工作流 复用：3 个子图","category":"image","keywords":["ComfyUI 工作流 复用","子图","API 格式"],"longtail":["ComfyUI 工作流怎么复用","ComfyUI 工作流导出后打不开"],"tags":["ComfyUI","工作流","效率"],"content":"组里 5 个人各有一套 ComfyUI 流程，参数散在十几个节点里，换项目就得重连一遍，谁请假别人接不了手。\n\n上个月我把常用链路拆成 3 个子图做成模板，改一次全线生效，一周省下 4 小时重复劳动。要把ComfyUI 工作流怎么复用做扎实，靠的不是记性好，是结构。\n\n## 拆子图的步骤\n\n1. 选中采样相关节点，右键 Convert to Subgraph，命名\"采样核心\"，把步数、CFG、采样器暴露成输入。\n2. 参考图、蒙版、提示词各做一组输入接口，用红黄蓝三色标注。\n3. 用 Save (API Format) 导出 JSON，存进团队共享目录，文件名带版本号 v2.3。\n4. 换模型时只改子图里的 loader，外层链路不动。\n\n子图拆完先自己跑 10 张确认结果和原链路一致，再把 JSON 发给同事。导出时选API 格式，JSON 里别留本地图片的绝对路径，这套ComfyUI 工作流 复用才算完成一半。\n\n拆子图时不要把模型加载器也封进去，否则换模型还得进子图改。我把 loader 放在外层，子图只留采样和 latent 两个环节，换模型只动一个节点，ComfyUI 工作流 复用才真正省时间。\n\nAPI 格式导出后建议再用脚本跑一遍，确认 JSON 里的字段名没被节点更新改掉。上周有个工作流在同事机器上出全黑图，查下来是 VAE 节点版本不同，字段名被改过了。\n\n## 复用的三种场景\n\n同一套出图流程换 3 个模型（SDXL、SD3.5、Flux），只改 loader 和采样器；给同事发工作流先确认对方节点版本；批量跑 200 张，用组节点加旁路开关切参数。子图拆得越细，复用越灵活。\n\nComfyUI 工作流怎么复用的答案不是保存成模板就完了，而是把会变的部分全部暴露成接口，固定部分封进子图。我通常把 20 个节点压到 3 个子图、18 个可见接口，改图时间从 20 分钟降到 5 分钟。\n\n## 打不开的坑\n\nComfyUI 工作流导出后打不开是最常见的报错，导入后一片红框、提示缺节点：对方没装 ComfyUI-Manager 或版本落后两个大版本。导出时附一份节点清单截图，让对方先 Install Missing Custom Nodes 再重启。\n\n还有一种ComfyUI 工作流导出后打不开的情况是模型路径写成绝对路径，换电脑全失效，统一改到 extra_model_paths.yaml。第三个坑是子图里的 seed 被固定，批量出 20 张一模一样，导出前记得改成 randomize。\n\n收益我也算过：以前每接一个项目重搭 40 分钟，现在打开模板 5 分钟，一个月 8 个项目就是 4 个多小时。还有个小坑，子图命名带中文时有些版本导出会乱码，统一改成英文加下划线。\n\n团队协作时把工作流和节点版本一起写进 README，新同事按图索骥装一遍就能跑，省得每次在群里问对方装的哪个版本。\n\n## 总结\n\n拆子图、暴露参数、存API 格式 JSON、附节点清单，四步做完这套ComfyUI 工作流 复用才算稳定。模板每月更新一次版本号，别让旧节点拖垮新流程。","path":"articles/image/07-comfyui-workflow-reuse.md"},{"id":"image-08-dalle3-text-layout-poster","title":"DALL·E 3 文字排版 海报：4 字标题","category":"image","keywords":["DALL·E 3 文字排版 海报","文字排版","留白"],"longtail":["DALL·E 3 文字排版怎么生成","DALL·E 3 中文海报"],"tags":["DALL·E 3","海报","文字排版"],"content":"帮咖啡店做中秋海报，预算不高，我先用 DALL·E 3 出了 8 版，想省掉找设计师排字的环节。\n\n结论很直接：4 个字以内成功率七成，超过 6 个字基本全错。这篇记录DALL·E 3 文字排版怎么生成的现实边界，省得你重复走弯路。\n\n## 提示词写法\n\n把要出现的字用引号包起来，写明\"标题四字、黑体、居中、字号占画面三分之一、留白充足\"。尺寸选 1024×1536 竖版，比 1792×1024 横版的文字稳。\n\n案例：\"秋日上新\"四个字，5 次生成里 3 次可读，笔画缺一两处后期能补；英文和数字明显更准，SALE 50% 一次就成。DALL·E 3 文字排版 海报想一步到位不现实，先把短标题跑通，再谈副标题。\
