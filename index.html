/* ---------------- 工具函数 ---------------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catName = id => (CATS.find(c => c.id === id) || {name:'未分类'}).name;
const LS = 'stellara_nav_articles_v1';

function customArticles(){
  try { const a = JSON.parse(localStorage.getItem(LS) || '[]'); return Array.isArray(a) ? a : []; } catch(e){ return []; }
}
function allArticles(){ return ARTICLES.concat(customArticles()); }

/* 极简 Markdown */
function md(src){
  let t = String(src || '').replace(/\r\n/g,'\n');
  const blocks = [];
  t = t.replace(/```([\s\S]*?)```/g, (_,c)=>{ blocks.push('<pre><code>'+esc(c.replace(/^\n|\n$/g,''))+'</code></pre>'); return '\u0000B'+(blocks.length-1)+'\u0000'; });
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = t.split('\n'), out = [];
  let para = [], list = null;
  const flushP = ()=>{ if(para.length){ out.push('<p>'+inline(para.join(' '))+'</p>'); para=[]; } };
  const flushL = ()=>{ if(list){ out.push('<'+list.tag+'>'+list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+'</'+list.tag+'>'); list=null; } };
  for (let i=0;i<lines.length;i++){
    const ln = lines[i];
    if (/^\u0000B\d+\u0000$/.test(ln.trim())) { flushP(); flushL(); out.push(blocks[+ln.trim().replace(/\u0000B|\u0000/g,'')]); continue; }
    if (!ln.trim()) { flushP(); flushL(); continue; }
    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushP(); flushL(); const lv=h[1].length===1?2:Math.min(4,h[1].length); out.push('<h'+lv+'>'+inline(h[2])+'</h'+lv+'>'); continue; }
    if (/^\s*[-*+]\s+/.test(ln)) { flushP(); if(!list||list.tag!=='ul'){flushL(); list={tag:'ul',items:[]};} list.items.push(ln.replace(/^\s*[-*+]\s+/,'')); continue; }
    if (/^\s*\d+\.\s+/.test(ln)) { flushP(); if(!list||list.tag!=='ol'){flushL(); list={tag:'ol',items:[]};} list.items.push(ln.replace(/^\s*\d+\.\s+/,'')); continue; }
    if (/^\s*>/.test(ln)) { flushP(); flushL(); out.push('<blockquote>'+inline(ln.replace(/^\s*>\s?/,''))+'</blockquote>'); continue; }
    para.push(ln.trim());
  }
  flushP(); flushL();
  return out.join('\n');
}

/* ---------------- 路由 ---------------- */
const state = {view:'tools', cat:'all', q:'', artCat:'all', artId:null};
function nav(){
  const items = [['tools','工具库'],['articles','教程文章'],['about','说明']];
  $('#nav').innerHTML = items.map(([k,n])=>`<button data-go="${k}" class="${state.view===k?'on':''}">${n}</button>`).join('');
}

function render(){
  nav();
  const app = $('#app');
  if (state.view === 'tools') app.innerHTML = viewTools();
  else if (state.view === 'articles') app.innerHTML = viewArticles();
  else if (state.view === 'article') app.innerHTML = viewArticle(state.artId);
  else app.innerHTML = viewAbout();
  window.scrollTo({top:0,behavior:'instant'});
}

/* ---------------- 工具库 ---------------- */
function viewTools(){

  return `

    <div class="eyebrow">AI TOOL DIRECTORY</div>
    <h1>把 <span>42 款 AI 工具</span>按真实用途摆好，<br>再配 ${allArticles().length} 篇能照着做的教程</h1>
    <p class="lead">不堆"大全"，只留实测过、愿意再打开的。每个分类 6 款，点开即用；每篇教程都带参数、步骤和踩过的坑。</p>
    <div class="stats">
      <div class="stat"><b>42</b>工具卡片</div>
      <div class="stat"><b>7</b>大分类</div>
      <div class="stat"><b>${allArticles().length}</b>篇教程</div>
      <div class="stat"><b>0</b>外部依赖</div>
    </div>
  </section>
  <div class="latest"><span class="lb">最新更新</span>${allArticles().slice().sort((a,b)=>(b.mtime||0)-(a.mtime||0)).slice(0,6).map(a=>`<a href="a/${esc(a.id)}.html">${esc(a.title)}</a>`).join("")}</div>
  <div class="toolbar">
    ${chips}
    <label class="search">🔍<input id="q" placeholder="搜索工具名或用途…" value="${esc(state.q)}"></label>
  </div>
  <div class="grid">
    ${list.length ? list.map(t => `
      <div class="card">
        <a class="card-main" href="tool/${esc(t.s||'')}/index.html">
          <span class="tagline">${catName(t.c)}</span>
          <h3><i>${esc(t.n.slice(0,1))}</i>${esc(t.n)}</h3>
          <p>${esc(t.d)}</p>
        </a>
        <a class="go" href="${esc(t.u)}" target="_blank" rel="noopener">打开官网 →</a>
      </div>`).join('') : '<div class="empty">没有匹配的工具，换个关键词试试</div>'}
  </div>`;
}

/* ---------------- 文章列表 ---------------- */
function viewArticles(){
  const q = state.q.trim().toLowerCase();
  const arts = allArticles().filter(a => (state.artCat==='all'||a.category===state.artCat) &&
    (!q || (a.title + (a.keywords||[]).join(' ')).toLowerCase().includes(q)));
  const chips = [{id:'all',name:'全部'}].concat(CATS).map(c => {
    const n = allArticles().filter(a=>a.category===c.id).length;
    return `<button class="chip ${state.artCat===c.id?'on':''}" data-artcat="${c.id}">${c.name}${c.id==='all'?' '+allArticles().length:' '+n}</button>`;
  }).join('');
  return `
  <section class="hero">
    <div class="eyebrow">TUTORIALS · 100</div>

    <p class="lead">每篇只解决一个具体问题：参数怎么填、哪一步会翻车、用什么数字验收。点开即读，无需登录。</p>
  </section>
  <div class="latest"><span class="lb">最新更新</span>${allArticles().slice().sort((a,b)=>(b.mtime||0)-(a.mtime||0)).slice(0,6).map(a=>`<a href="a/${esc(a.id)}.html">${esc(a.title)}</a>`).join("")}</div>
  <div class="toolbar">
    ${chips}
    <label class="search">🔍<input id="q" placeholder="搜索标题或关键词…" value="${esc(state.q)}"></label>
    <button class="btn" id="btnImport">＋ 批量导入 Markdown</button>
  </div>
  <div class="panel import" id="importBox">
    <div class="hint" style="margin-bottom:10px">支持两种方式：① 直接粘贴多篇 Markdown（用 <code>---</code> 分隔，每篇带 frontmatter）；② 选择多个 .md 文件。文章保存在本机浏览器，不上传服务器。</div>
    <textarea id="importText" placeholder="---\ntitle: 标题\nkeywords: 词1, 词2\ncategory: chat\ntags: 标签1, 标签2\n---\n\n正文…"></textarea>
    <div class="toolbar" style="margin-bottom:0">
      <button class="btn primary" id="doImport">导入粘贴内容</button>
      <input type="file" id="fileImport" accept=".md,.markdown,.txt" multiple style="display:none">

  <div class="article-list">
    ${arts.length ? arts.map((a,i) => {
      const inner = `<span class="n">${String(i+1).padStart(3,'0')}</span>

      return a.custom
        ? `<div class="art-row" data-art="${esc(a.id)}">${inner}</div>`
        : `<a class="art-row" href="a/${esc(a.id)}.html">${inner}</a>`;
    }).join('') : '<div class="empty">没有匹配的文章</div>'}
  </div>`;
}

/* ---------------- 文章详情（含中部广告位） ---------------- */
function viewArticle(id){
  const a = allArticles().find(x => x.id === id);
  if (!a) return '<div class="empty">文章不存在</div>';
  if (!a.custom && !a.content) { location.href = 'a/' + a.id + '.html'; return ''; }
  const html = md(a.content);
  const parts = html.split('</p>');
  const mid = Math.max(1, Math.floor(parts.length * 0.45));
  const withAd = parts.slice(0, mid).join('</p>') + '</p>' + adSlot() + parts.slice(mid).join('</p>');
  return `
  <section class="article">
    <button class="back" id="back">← 返回列表</button>
    <h1>${esc(a.title)}</h1>
    <div class="meta">
      <span>${catName(a.category)}</span>
      <span>·</span>
      <span>${esc((a.keywords||[]).join(' / '))}</span>
      ${a.custom ? '<span>·</span><span>本机导入</span>' : ''}
    </div>
    <div class="content">${withAd}</div>
  </section>`;
}
function adSlot(){
  /* 广告位：仅文章中部。接 AdSense 时把下方注释替换成你的 <ins> 代码 */
  return `<div class="ad-slot" data-ad="article-mid">
    <div>广告位（文章中部）<small>AdSense / 广告联盟代码插入点 · 建议 728×90 / 移动端 320×100</small></div>
    <!-- 在这里粘贴广告代码 -->
  </div>`;
}

/* ---------------- 关于 ---------------- */
function viewAbout(){
  return `
  <section class="hero">
    <div class="eyebrow">ABOUT</div>
    <h1>这个站点是怎么做的</h1>
    <p class="lead">单文件 HTML，无后端、无外部依赖，双击即可打开；文章数据可直接改 JS 数组，也能在页面里批量导入 Markdown。</p>
  </section>
  <div class="panel">
    <h3>结构</h3>
    <ul>
      <li>工具数据在 <code>TOOLS</code> 数组：分类 c / 名称 n / 简介 d / 链接 u，复制一行就能加新工具。</li>
      <li>文章数据在 <code>ARTICLES</code> 数组：id、title、category、keywords、tags、content（Markdown 原文）。</li>
      <li>导入的文章存进浏览器 localStorage，换电脑不跟随；要长期保存请写回 <code>ARTICLES</code>。</li>
    </ul>
    <h3>广告位</h3>
    <ul>
      <li>只在文章中部渲染，顶部/底部/侧边栏都没有广告容器。</li>
      <li>接 AdSense：把 <code>adSlot()</code> 里的占位 div 换成你的 <code>&lt;ins class="adsbygoogle"&gt;</code> 并加脚本即可。</li>
    </ul>
    <h3>SEO</h3>
    <ul>
      <li>已内置 title / description / keywords / canonical / OG / JSON-LD。</li>
      <li>文章页标题随内容变化（document.title），便于搜索引擎按文章收录。</li>
    </ul>

}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) { state.view = go.dataset.go; state.q=''; if(state.view==='articles') state.artCat='all'; render(); return; }
  const cat = e.target.closest('[data-cat]');
  if (cat) { state.cat = cat.dataset.cat; render(); return; }
  const ac = e.target.closest('[data-artcat]');
  if (ac) { state.artCat = ac.dataset.artcat; render(); return; }
  const row = e.target.closest('[data-art]');
  if (row) { state.artId = row.dataset.art; state.view='article'; render(); return; }
  if (e.target.id === 'back') { state.view='articles'; render(); return; }
  if (e.target.id === 'btnImport') { $('#importBox').classList.toggle('on'); return; }
  if (e.target.id === 'pickFile') { $('#fileImport').click(); return; }
  if (e.target.id === 'doImport') { importText(); return; }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { state.q = e.target.value; const v = state.view; render(); const q = $('#q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
});

/* ---------------- 导入 ---------------- */
function parseFront(text){
  const m = /^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/.exec(text.trim());
  if (!m) return null;
  const meta = {};
  m[1].split('\n').forEach(line => {
    const i = line.indexOf(':');
    if (i > 0) meta[line.slice(0,i).trim()] = line.slice(i+1).trim();
  });
  const arr = v => String(v||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  return {
    id: 'c_' + Math.random().toString(36).slice(2,9),
    title: meta.title || '未命名文章',
    category: meta.category || 'util',
    keywords: arr(meta.keywords),
    tags: arr(meta.tags),
    content: m[2].trim(),
    custom: true
  };
}
function addArticles(list){
  const cur = customArticles();
  const seen = new Set(cur.map(a=>a.title));
  let n = 0;
  list.forEach(a => { if (a && !seen.has(a.title)) { cur.unshift(a); seen.add(a.title); n++; } });
  localStorage.setItem(LS, JSON.stringify(cur));
  const msg = $('#importMsg'); if (msg) msg.textContent = '已导入 ' + n + ' 篇';
  setTimeout(()=>{ state.view='articles'; render(); }, 400);
}
function importText(){
  const raw = ($('#importText')||{}).value || '';
  const chunks = raw.split(/\n\s*---\s*\n(?=---)/); // 简单切分，兼容一篇一变
  let list = [];
  if (/^---/.test(raw.trim())) {
    const parts = raw.split(/\n(?=---\s*\n)/).filter(s=>s.trim());
    list = parts.map(parseFront).filter(Boolean);
  }
  if (!list.length) { const one = parseFront(raw); if (one) list = [one]; }
  if (!list.length) { alert('没有解析到文章。请确认包含 --- frontmatter --- 与正文。'); return; }
  addArticles(list);
}
document.addEventListener('change', (e) => {
  if (e.target.id !== 'fileImport') return;
  const files = Array.from(e.target.files||[]);
  Promise.all(files.map(f => f.text().then(t => parseFront(t)))).then(list => {
    const ok = list.filter(Boolean);
    if (!ok.length) { alert('文件里没有解析到 frontmatter'); return; }
    addArticles(ok);
  });
});

/* ---------------- 启动 ---------------- */
$('#year').textContent = new Date().getFullYear();
const hash = (location.hash||'').replace(/^#\/?/,'');
if (hash === 'articles') state.view='articles';
else if (hash === 'about') state.view='about';
else state.view='tools';
render();
