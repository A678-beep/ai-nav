n\n分辨率也有影响：1024×1536 竖版比 1792×1024 横版文字成功率高，但打印 A3 会糊。我的做法是先出竖版，再在 PS 里拼到 300dpi 画布，标题字单独补。\n\nDALL·E 3 文字排版 海报的成本我算过：8 版初稿不到一顿饭钱，但别指望它生成整套视觉。字体和字号层级还是得靠人，模型只负责构图和底图，这两件事分开才不内耗。\n\n## 排版层级与后期\n\nDALL·E 3 不懂字号层级，主标题和副标题常挤在一起。我的做法是让它只生成主标题，副标题和价格在 Photoshop 里加，字体用思源黑体，行距 1.5 倍。\n\n生成时要求\"上方三分之一留空\"，后期就有一块干净区域放活动信息。这套DALL·E 3 中文海报的留白不是浪费版面，是给价格和日期留位置，我一般把留白区域留满三分之一。\n\n## 两个坑与交付细节\n\n第一坑：长句必翻车，\"中秋团圆礼盒限时特惠\"这种 10 字标题生成 4 次全是乱码，最后裁成\"中秋礼盒\"四字才过。\n\n第二坑：中文字形被替换，比如\"月\"字少一横，缩略图看不出来，放大到 200% 才露馅。DALL·E 3 文字排版 海报的正确姿势是短标题加后期补字，中文字体排版这块别让模型硬扛。\n\n这套DALL·E 3 中文海报流程，8 版初稿用了 20 分钟，后期排版 15 分钟，比找设计师快一天，但前提是你接受\"AI 出底图、人排字\"的分工。\n\nDALL·E 3 文字排版怎么生成的最优解其实是两段式：模型出图，人排字，中间用留白区过渡。文字排版交给思源黑体，比硬让模型写 10 个字稳得多。\n\n我还试过把中文标题写成拼音让模型拼，失败率更高，字母会漏。真正能救的是把标题拆成 2~4 个字做一张图，再用 PS 图层蒙版拼。这个坑我踩了 3 次，后来直接改用模板。\n\n遇到必须放长标题的单子，我会让 DALL·E 3 先出无字底图，再在 PS 里排 6 到 10 个字，字距和行距都自己控，效果比硬生成稳定得多。\n\n## 总结\n\n四字标题、引号包裹、竖版构图、预留留白区，长句直接放弃。DALL·E 3 给的是构图和素材，文字排版还得靠后期兜底，这套分工才稳。","path":"articles/image/08-dalle3-text-layout-poster.md"},{"id":"image-09-ideogram-2-typography","title":"Ideogram 2.0 字体设计：10 组对照","category":"image","keywords":["Ideogram 2.0 字体设计","Typography","Style Reference"],"longtail":["Ideogram 2.0 字体设计怎么用","Ideogram 中文 字体"],"tags":["Ideogram","字体设计","海报"],"content":"做音乐节海报要一套花字标题，我试了 10 组提示词，Ideogram 2.0 的 Design 风格最稳。\n\n它中文字库弱，但英文花字几乎不翻车。Ideogram 2.0 字体设计怎么用，我的答案很简单：把它当英文字体生成器，中文另想办法。\n\n## 10 组对照结论\n\n同一句 SUMMER NIGHT，加\"typography, bold display font, 1970s poster style\"出复古粗体；加\"hand-lettered, marker pen\"变手写；加\"elegant serif, gold foil\"变轻奢。\n\n风格词越具体越好，比例选 3:4，一次出 4 张。Typography关键词放提示词最前面，权重比塞在句尾稳。免费额度每天 10 张左右，够跑两三组对照，先定风格再批量。\n\n配色也要一起想：粗体海报配高饱和背景容易糊，我会让提示词带 contrast、dark background、neon accent，出图后在 PS 里把文字提亮两档，这种细节模型不会替你做。\n\nTypography这块它比 DALL·E 强，长单词也能一次写对；但字号层级仍要靠后期，别指望一张图生成完整版式。海报正文我在 Figma 里排，生成图只当主视觉。\n\n## 风格一致性\n\n一套海报要 3 张字体统一，我用Style Reference固定一张母版，后续只换引号里的文字，权重保持默认。\n\nIdeogram 2.0 字体设计要做成系列，就把母版图的风格 ID 存下来，下次直接套。至于Ideogram 中文 字体，实测提示词里写中文会缺笔画、字符粘连，6 字中文标题成功率不到两成，中文标题建议后期用思源系列补。\n\n## 两个坑与交付细节\n\n第一坑：生僻英文单词会被拆成两个词，NYCTOPHILE 变成 NYC TOPHILE，换成常见词或拆音节写才稳。\n\n第二坑：文字越多字越小，正文级别的字会挤成一团，只保留标题就好。3 张一套的海报从找字体到定稿 1 小时，比翻字库快。Ideogram 2.0 字体设计怎么用的经验就一条：把它当字体预览器，不当排版工具。\n\nStyle Reference的权重别过度依赖，同一张母版用超过 6 张后风格开始收敛，颜色越来越像；遇到这种情况换一张母版再继续，否则一套图会变成同一张的复制品。\n\nIdeogram 中文 字体的另一个问题是竖排，生僻字直接变方块，横排短词还能凑合。要做中文字体海报，先把字拆成 2 字一组生成再拼，别整句丢进去。\n\n还有个小坑：免费额度别全花在重跑上，同一提示词先出 4 张挑最好的。提示词里带中文标点时，模型偶尔把标点画成横线，去掉标点再生成。\n\n同一提示词跑 4 张，Ideogram 2.0 的构图漂移比新版本明显，主标题有时贴边；出图后先在 100% 比例下看标题有没有被裁，再决定要不要重跑。\n\n字体设计的活最后都要落到版式，别把生成图直接当成品，留 10 分钟在 Figma 里对齐网格，海报的完成度会差一截。\n\n## 总结\n\n英文花字用它，中文标题别硬碰。风格词具体、比例 3:4、Style Reference锁系列，画面只留标题。10 组对照里 8 组可用，Ideogram 2.0 字体设计这件事掌握到这就够日常海报用了。","path":"articles/image/09-ideogram-2-typography.md"},{"id":"image-10-tongyi-wanxiang-product-background","title":"通义万相 商品换背景：光影匹配的 3 步做法","category":"image","keywords":["通义万相 商品换背景","光影匹配","抠图"],"longtail":["通义万相 商品换背景怎么用","通义万相 商品图背景替换"],"tags":["通义万相","电商","商品图"],"content":"咖啡器具店要上 12 张场景图，棚拍报价一张 150 元，预算扛不住。\n\n我用通义万相 2.5 的商品图功能换背景，重点解决\"阴影不落地\"这个老问题。这套通义万相 商品换背景的流程跑完，12 张图 1 小时交付。\n\n## 三步做法\n\n1. 上传白底商品图，先自动抠图，检查杯柄、壶嘴这些细窄处的边缘。\n2. 背景提示词分两段写：环境写\"原木桌面、窗外绿植虚化\"，光线写\"右侧窗光、左前方补光、商品底部 30% 灰影\"。\n3. 输出 1024×1024 或 2K，光影不对只重跑背景，商品主体保持不动。\n\n拍白底图时让商品离背景 30 厘米以上，避免原图带阴影，否则换背景后新旧两层影子会打架。这个坑我吃过：12 张里 3 张底部有双层影子，只能回原图重抠。\n\n光影匹配还看色温：暖光场景别配冷调商品，我在提示词里写柔光箱 5500K，让背景和商品落在同一色温上，再在 PS 里微调曲线，不然后期越调越假。\n\n## 光影匹配的关键\n\n商品图假不假，八成看阴影。我会在提示词里明确\"接触阴影紧贴商品底部、投影方向与光源一致\"，并让桌面带轻微反光。光影匹配做得好，商品就像原本放在那个场景里。\n\n金属和玻璃要单独补\"环境反光、透光边缘\"，否则抠图痕迹很明显。光位和材质词分开写，改的时候只动一段，别整段重写。\n\n## 两个坑与交付细节\n\n第一坑：提示词只写\"温馨背景\"，环境色调和商品冷暖冲突，铜色咖啡壶配了发蓝的背景，返工 4 张。\n\n第二坑：透明玻璃杯换背景后边缘出现白边，得把抠图羽化降到 1 像素重来。通义万相 商品换背景怎么用的经验就是先定光、再定景。\n\n通义万相 商品换背景怎么用这套方法搬到服饰上要改词：衣服重点在褶皱和垂感，桌面换成地板或纯色背景，投影拉长，别照搬咖啡壶那套参数。\n\n输出尺寸建议直接选 2K，1024 图在详情页放大后会糊；2K 生成慢一倍，但省掉后期锐化。抠图羽化别超过 2 像素，玻璃杯边缘会留白边。\n\n最后一坑：免费额度按天刷新，批量出图最好一次排完；中途换浏览器登录容易丢历史记录，把参数截图存本地更保险。\n\n另外商品有包装膜时，反光会被 AI 放大成一块高光斑，先在原图上用污点修复去掉反光再上传，换背景后边缘干净很多；这套顺序我固定在 PS 里做完再进通义万相。\n\n同样的通义万相 商品图背景替换流程换到鞋类，把材质词改成皮革和橡胶底即可。\n\n## 总结\n\n抠图看细节、提示词拆成环境和光线、阴影方向跟光源走，透明和金属材质单独处理。通义万相 商品图背景替换的思路也适用于家电和饰品，换一套材质词即可，1 小时 12 张比棚拍省一半预算。","path":"articles/image/10-tongyi-wanxiang-product-background.md"},{"id":"image-11-sdxl-lora-training-dataset","title":"SDXL LoRA 训练 数据集：四十分钟出图","category":"image","keywords":["SDXL LoRA 训练 数据集","kohya_ss","过拟合"],"longtail":["SDXL LoRA 数据集怎么准备","SDXL LoRA 训练参数"],"tags":["SDXL","LoRA","训练"],"content":"给一个宠物 IP 训专属 LoRA，客户只给 24 张手机照片。\n\n我用kohya_ss训 SDXL，12GB 显存 40 分钟跑完全程，出图相似度够交付。关键不在步数，在数据集清洗，这篇记录SDXL LoRA 训练 数据集的完整流程。\n\n## 数据集准备\n\n24 张里 18 张正脸特写、6 张侧脸，统一裁成 1024×1024，去掉重复和模糊片，最后剩 20 张。用 WD14 打标，手动把毛色、项圈这些固定特征写进 caption，背景统一改成 simple background。\n\nSDXL LoRA 数据集怎么准备就一条：同一主体、不同角度、干净背景，别混进别的衣服和光照。20 张精修图比 50 张杂图好用，这是数据集的第一原则。\n\n打标别偷懒，WD14 只给通用标签，毛色、项圈颜色这种 IP 特征要手写，并且统一大小写。SDXL LoRA 数据集怎么准备的另一半是分类：正脸、侧脸、全身分开建文件夹，训练时按 6:3:1 分配 repeat。\n\n训练前先跑 1 张测试图确认底模能出正常结果，别拿一个装坏的 SDXL 底模训 40 分钟。kohya_ss的日志里 grad_norm 突然飙升说明学习率太高，降到 5e-5 重来。\n\n这套SDXL LoRA 训练 数据集的准备占了整个项目七成时间，别嫌麻烦。\n\n## 训练参数\n\nrepeats 1，epoch 10，batch size 1，UNet 学习率 1e-4、text encoder 5e-5，network_dim 32、alpha 16，优化器 AdamW8bit，混合精度 fp16，显存峰值 11.4GB，4090 上 40 分钟。kohya_ss的配置文件存一份，下个项目改两行就能复用。\n\n训完先用 0.7 权重试，1.0 容易过拟合。过拟合的典型表现是背景和姿势全被记死，换个场景就崩，别等交付才发现。\n\n## 两个坑与交付细节\n\n第一坑：数据集混进不同光照和服装，模型学成\"缝合怪\"，出图四不像，只能删图重训。\n\n第二坑：epoch 拉到 20 想更准，结果过拟合更严重。SDXL LoRA 训练参数别一次调太多，先跑 10 epoch 看 loss 曲线再决定。训完配触发词测试，8 张里 6 张稳定再交付，这套流程换到人物 IP 上把 caption 换成服装和发型即可。\n\nSDXL LoRA 训练参数里最容易被忽略的是 text encoder 学习率，设高了会把触发词学死，5e-5 比较稳。batch size 用 1，显存不够就开 gradient checkpointing。\n\n出图测试的坑我也踩过：只测正脸，交付后客户拿侧脸一跑全崩。后来固定测 8 个角度，过 6 个才交，多花的 10 分钟比返工便宜。\n\n过拟合的另一个信号是颜色偏暖或偏冷，模型把训练图的光照也记住了。把数据集里 2 张色温异常的图去掉，过拟合明显减轻。\n\n最后别在训练集里放带水印的图，SDXL 会把水印当成主体特征学进去，出图右上角永远多一块灰斑。\n\n数据集的文件夹结构建议按 10_主体命名，kohya_ss会直接读 repeat 数；混着放的话 repeat 只能统一设 1，训练轮次就得靠 epoch 补，效率掉一半。\n\n出图对比时固定 seed，换 LoRA 权重只改一个变量，才能判断问题出在数据集还是参数。\n\n测试图我也会存一份带触发词和 LoRA 权重的命名，下次复现不用猜。\n\n## 总结\n\n20 张干净图、统一 caption、dim 32、epoch 10、0.7 权重起步。数据集质量决定上限，参数只决定下限，kohya_ss跑一遍就能摸清手感，这套SDXL LoRA 训练 数据集流程复制到别的项目也适用。","path":"articles/image/11-sdxl-lora-training-dataset.md"},{"id":"image-12-controlnet-openpose","title":"ControlNet OpenPose 姿势实战","category":"image","keywords":["ControlNet OpenPose 姿势","姿势控制","detect_hand"],"longtail":["ControlNet OpenPose 姿势怎么控制","SDXL OpenPose 双人"],"tags":["ControlNet","OpenPose","SDXL"],"content":"健身账号要一组双人拉伸动作图，模特档期排不开。\n\n我用 SDXL 加 OpenPose 生成，关键是把两个人的骨架分开控制。这套ControlNet OpenPose 姿势流程固定成模板，单张 25 秒出图，姿势准确率比纯文生图高得多。\n\n## 关键点与权重\n\n先用 ControlNet Aux 的 OpenPose Preprocessor 从参考视频抽帧提骨架，双人图必须勾选detect_hand和 detect_body，否则手指一团糊。姿势控制的第一步永远是把骨架图提干净，背景杂物会让预处理器多识别出多余的骨架点。\n\n生成尺寸 832×1216，权重 0.8、起始 0、结束 0.8；权重拉到 1.0 会把构图锁死，换背景都换不动。\n\n姿势控制还有个笨办法：先用真人照片提取骨架，再对比生成图的关键点连线，重合率低于七成就是权重不够。这个检查花 1 分钟，能省一轮重跑。\n\ndetect_hand打开后预处理器会多出两只手的关键点，双人图里容易把闲着的第三只手也画出来，把 hand 阈值调到 0.3 能过滤一部分误识别。\n\n## 双人控制\n\n两个人物各接一组 OpenPose，用蒙版编辑器划左右区域，提示词分别写\"左侧女性、右侧男性\"，服装颜色分开描述。双人图最常见的问题是其中一个抢掉另一个的姿势，解决办法是拉开强度差：主体人物 0.85，次要人物 0.65。\n\ndetect_hand在双人图里特别重要，两只手的骨架点如果重叠，模型会画出第三只手。遇到这种情况把两个 OpenPose 节点的 mask 区域缩紧，别让边界交叠。\n\n## 两个坑与交付细节\n\n第一坑：参考图和生成图比例不一致，骨架被拉伸，长腿变短腿，先把尺寸统一成 2:3 再提取。第二坑：手部关键点缺失时手会糊成肉团，补一张手部特写单独重绘。\n\nControlNet OpenPose 姿势怎么控制的诀窍是骨架干净、权重留余地。这套SDXL OpenPose 双人流程跑 10 张，8 张可用，2 张手部返工。\n\nControlNet OpenPose 姿势怎么控制的完整链路是：参考图、骨架、生成、对比、修，环环相扣。中间任何一步用错尺寸，后面全白费。\n\nSDXL OpenPose 双人场景我一般开两个 ControlNet 叠加，一个管主体一个管配角，权重 0.85 和 0.65 分开设，别用一个节点硬扛两种姿势。\n\n小坑：从视频抽帧时选正面机位，侧拍抽出来的骨架缺半边胳膊；抽帧间隔 0.5 秒足够，太密只会让显存爆掉。\n\n生成前先确认 SDXL 底模的宽高比，832×1216 对竖版双人最顺；如果提示词里要换背景，把 ControlNet 结束步从 0.8 降到 0.7，给模型留出改背景的空间。\n\n骨架图存成 512×768 就够，分辨率太高会让预处理器把衣褶误判成关节。这条我踩过，换了三张参考图才对。\n\n如果参考视频只有手机竖屏，先把骨架图裁成 2:3 再提取，省得后面反复调比例。\n\n## 总结\n\n权重 0.8 起步、结束 0.8、比例统一 2:3、双人分区控制，手部单独补。ControlNet OpenPose 姿势管的是骨架不是细节，别把权重拉满，也别拿它救烂参考图。","path":"articles/image/12-controlnet-openpose.md"},{"id":"image-13-meitu-whee-id-photo","title":"美图 WHEE 证件照：白底蓝底一寸二寸尺寸对照","category":"image","keywords":["美图 WHEE 证件照","换底色","抠图"],"longtail":["美图 WHEE 证件照怎么制作","WHEE 证件照能换底色吗"],"tags":["美图 WHEE","证件照","抠图"],"content":"帮同事 5 个人做入职材料，要求白底一寸照，有人只有手机自拍，照相馆排队排到下周。\n\n我用美图 WHEE 的证件照功能批量处理，上传到导出平均 3 分钟一张。这套美图 WHEE 证件照流程省掉了跑照相馆的时间，也省了每人 40 元。\n\n## 尺寸与底色\n\n一寸 295×413，小一寸 260×378，二寸 413×579，社保卡规格 358×441，按 300dpi 导出，单张压到 100KB 以内方便上传。白底用于简历和入职，蓝底多用于考试报名，红底少见。\n\n选好规格后一键换底色，再手动修发际线边缘。换底色前先确认平台要求，有些单位只认白底，别等交材料才返工。\n\n原图要求其实不低：正脸、无遮挡、光线均匀，手机自拍最好摘掉眼镜，镜片反光会让抠图边缘发灰。我试过一张戴墨镜的照片，AI 直接把墨镜画成眼睛。\n\n尺寸对照表里还有一个容易漏的：小二寸 413×531，常用于签证；护照照 33×48 毫米，比例和证件照不同，别拿一寸照硬套。\n\n## 操作步骤与边界\n\n上传正脸原图，保持双眼平视、露出双耳，AI 自动抠图并把头部居中。抠图这一步决定成败，原图背景越干净，发丝边缘越自然。\n\n换底色后检查肩膀两侧有没有残留背景。美化强度降到 30% 以下，别开瘦脸和大眼，证件照只需要干净自然。美图 WHEE 证件照怎么制作的完整顺序就是选规格、抠图、换底色、微调、导出。\n\n## 两个坑与交付细节\n\n第一坑：美颜开太狠，人脸识别比对不通过，同事被门禁拦了两次，最后重做。\n\n第二坑：头发丝边缘抠图毛边，深色衣服配白底最明显，放大到 200% 手动补 3~5 笔就好。WHEE 证件照能换底色吗，能换，但换完要按原规格重新导出，别直接拉伸。\n\n美图 WHEE 证件照怎么制作的另一种路径是先裁后换：上传后先按规格裁掉多余背景，再抠图换底，头肩比例更准；自动居中偶尔把头顶裁掉，手动往上挪 5% 就行。\n\nWHEE 证件照能换底色吗这个问题的隐藏坑是色值：部分考试要求纯红底，WHEE 的红色偏暗，换完要对比色卡，不合适就调 HSL 提亮红色。\n\n批量做的时候把每个人的原图和成品分文件夹存，文件名带姓名和规格，5 个人做完只花了 15 分钟。\n\n导出前把整组照片并排看一遍，头肩比例和背景白度不一致最容易露馅；我会统一亮度到 95% 左右，避免一张偏灰一张刺眼，交材料时更整齐。\n\n如果要打印，导出选 300dpi 的 JPG，别用 PNG，打印店系统对 PNG 的色彩配置经常不认。\n\n## 总结\n\n选规格、一键换底色、修发际线、美颜 30% 以下、300dpi 导出。美图 WHEE 证件照这套流程 5 个人 15 分钟搞定，比照相馆省 200 元，前提是原图正脸清晰、光线均匀。","path":"articles/image/13-meitu-whee-id-photo.md"},{"id":"image-14-recraft-vector-icons","title":"Recraft 矢量图标：24 个图标统一","category":"image","keywords":["Recraft 矢量图标","SVG","Style Reference"],"longtail":["Recraft 矢量图标怎么导出 SVG","Recraft 图标风格统一"],"tags":["Recraft","矢量图标","图标设计"],"content":"后台改版要 24 个功能图标，外包报价 1 个 80 元。\n\n我用 Recraft 生成一套线性图标，再手工统一线条，3 小时交付。Recraft 矢量图标的产出质量比想象中可控，前提是先立规范、再批量出。\n\n## 生成与统一\n\n选 Icon 风格、线性描边，提示词写\"user profile, outline icon, 2px stroke, rounded cap, 24x24 grid\"，逐个生成后导出SVG。SVG的好处是拿到的就是路径，改颜色不用重新生成。\n\n24 个图标分 6 组，每组用同一张母版当Style Reference，保证圆角和线条粗细一致。Style Reference定下来之后，后面 20 多个图标都套同一张，别中途换母版。\n\n图标命名也纳入规范：统一用功能名加下划线，比如 user_profile、order_list，交付时前端按名字批量替换，别用 icon1、icon2，后期根本对不上。\n\nRecraft 矢量图标怎么导出 SVG的完整流程是生成、选 Vector、Download SVG、Figma 里检查填充；导出前把填充色改成 currentColor，前端换主题色不用改文件。\n\n## 导出与后期\n\nSVG导出后丢进 Figma 检查节点数，超过 200 个节点的图标手工简化，不然前端加载会卡。\n\n描边 2px、圆角 2px、视觉重心居中这三条定死，改图标时只动轮廓不动规范。Recraft 图标风格统一靠的不是模型，而是前置规范，我一般先定 3 个母图标再铺开。\n\n## 两个坑与交付细节\n\n第一坑：同一批图标线条粗细差 0.3px，摆一起明显不齐，导出前统一改 2px 描边。\n\n第二坑：带文字的图标生成后文字变成乱码路径，中文标注只能后期加。还有个小细节，Recraft 矢量图标怎么导出 SVG要选 Export as SVG，存成 PNG 再转矢量就白做了。\n\nStyle Reference之外，Recraft 的项目也能锁定风格，把 24 个图标放进同一个项目，出图风格漂移会小很多。\n\nRecraft 图标风格统一还有一个土办法：把 24 个图标拼成一张对照图，眼睛扫一遍就能发现哪几个线条不对，改完再拆开导出。\n\n小坑：SVG里的描边如果被转成填充层，改描边粗细就麻烦，生成时固定 outline stroke 才不踩；网格别用 2 倍，24×24 是通行标准。\n\n图标多了以后建一个元数据表，记录每个图标的含义和使用位置，交付给前端时省掉来回确认的时间。\n\n线性图标和面性图标别混用，一套 24 个里混进 2 个填充图标，视觉上会突然变重；要混就按功能分区，导航用线性、操作按钮用面性，前提是先跟产品对齐。\n\n导出前把所有图标放进同一个 24×24 的画板，描边对齐像素网格，切图时不会出现半像素模糊；这套检查我写成 Figma 插件清单，每次交付前过一遍。\n\n图标数量多时先做 3 个母版定调，再批量生成，最后只留 24 个里最好的那版；剩余额度留给返工，别一次全部生成完。\n\n## 总结\n\n先定描边和网格规范，再用Style Reference批量生成，导出SVG后统一节点数。Recraft 矢量图标出图快，但规范得人来立，这套流程免费额度每天 50 积分，24 个图标约用掉 30 积分。","path":"articles/image/14-recraft-vector-icons.md"},{"id":"image-15-photoshop-generative-fill-chinese","title":"Photoshop 生成式填充 中文：扩图三招","category":"image","keywords":["Photoshop 生成式填充 中文","中文提示词","生成式图层"],"longtail":["Photoshop 生成式填充中文提示词怎么写","PS 生成式填充 扩图"],"tags":["Photoshop","生成式填充","扩图"],"content":"电商 banner 原来是 3:2，投放位要 16:9，重拍来不及。\n\n我用 Photoshop 的生成式填充扩图，中文提示词写了 3 轮才稳定。这套Photoshop 生成式填充 中文的写法，重点是把\"要什么\"写具体。\n\n## 三步扩图\n\n1. 用裁剪工具往左右各扩 15%，留出生成区，确认选区边缘不压主体。\n2. 生成式填充里输入中文：\"左侧延伸灰色水泥墙，光线从右上方来，保留原有阴影方向\"，生成 3 个变体。\n3. 选最自然的一个，生成式图层叠加，接缝处用修复画笔过渡。\n\nPS 版本也影响生成质量，2025 之后的生成式填充换过模型，同样的中文提示词结果差别不小；团队协作时把版本号写进文件名，避免对不上。\n\n生成式图层支持再次编辑，双击图层能重新输入提示词，我习惯保留 3 个变体图层，最后再合并，方便回头改。这套Photoshop 生成式填充 中文流程我用了两个月才顺手。\n\n## 中文提示词写法\n\n中文能用，但要具体到材质、方向和光源。写\"加一点氛围感\"没有效果，写\"背景延伸出浅灰色墙面，顶部有柔和顶光\"才会动。中文提示词一次别描述超过两件事，先扩背景再加道具，分两次生成。\n\n2K 以下生成更快，4K 素材先用低分辨率试位置。生成式图层的好处是非破坏性，不满意随时关掉重来，别直接合并图层。\n\n## 两个坑与交付细节\n\n第一坑：扩图边缘出现重复纹理，尤其木纹和地砖，扩之前把选区往外多留 10%，并让提示词写\"自然过渡、无重复图案\"。\n\n第二坑：生成式填充消耗生成点数，一次点 3 个变体算 3 次，额度用完只能等刷新。Photoshop 生成式填充中文提示词怎么写的经验是名词加方位加光线，PS 生成式填充 扩图的顺序是先扩后修。\n\nPhotoshop 生成式填充中文提示词怎么写还有一条：把保留和生成分开说，先写要保留主体，再写延伸内容，比一句话塞两件事稳。\n\nPS 生成式填充 扩图的接缝处理，我一般用 30% 不透明度的修复画笔顺纹理刷两遍，再用 Camera Raw 统一色温，别整体锐化。\n\n小坑：扩图完成别急着裁掉透明边，导出前按投放尺寸二次裁切，否则平台会自动加白边；中文提示词别带高清两个字，模型会过度锐化。\n\n扩图前先把原图层复制一份锁住，生成出错时直接回滚；另外文案区容易被生成的墙面纹理盖住，在 PS 里加一层蒙版把文字区擦出来，比重新生成省点数。\n\n## 总结\n\n选区留足、中文写材质与光位、一次只加一样东西、接缝手动修。这套流程 20 分钟出 3 版，比重新拍省两天。Photoshop 生成式填充 中文的用法说到底就是补图，别指望它一次生成整张新图。","path":"articles/image/15-photoshop-generative-fill-chinese.md"},{"id":"util-01-perplexity-academic-search","title":"Perplexity 学术 检索：三个提问模板","category":"util","keywords":["Perplexity 学术 检索","学术文献检索","引用核对","文献综述"],"longtail":["Perplexity 文献综述","Perplexity 引用核对"],"tags":["学术检索","文献综述","引用核对"],"content":"上个月帮师妹改一篇 6000 字的文献综述，她用 AI 搜了 40 条参考文献，我抽查 10 条就有 3 条查不到 DOI。问题不在工具，而在检索式写得太像聊天。后来我把自己那套 Perplexity 学术 检索 的流程拆成三个提问模板，她照着跑完，文献准备从半天压到 45 分钟。\n\n## 第一步：把范围锁进学术库\n\n输入框下面有一排 Focus 选项，选 Academic；模型切 Pro，注意免费账号每 4 小时只有 5 次 Pro 检索，别浪费在寒暄上。提问别写成需求，我固定用来源限定、年份、方向、综述这四段结构，例如先限定到预印本库、2024 年之后、扩散模型视频生成。Sources 面板里手动关掉论坛、新闻和电商域名，只留教育机构、组织和 PDF。每条结论后面的角标必须点开，把 DOI 丢进浏览器验证，我实测 20 条里有 2 条作者对不上原文。同一问题连续追问三轮，它会补上第一轮漏掉的文献，但引入无关来源的概率也会上涨。还有一个缺点：角标主要对网页来源生效，上传 PDF 后生成的回答不带页码，核对起来更费劲。\n\n## 第二步：三个模板直接抄\n\n模板 A 做综述提纲：「对比 2023 到 2025 年这个方向的 5 篇综述，列出共识、分歧和对应来源编号」。模板 B 拆实验设置：「把这三篇论文的数据集、批大小、学习率、显存整理成一张表」。模板 C 逼它承认不知道：「这句话的原始出处是哪篇论文哪一页，没有就直说没有」。上周用 A 加 B 写一篇 3000 字综述初稿，出提纲 8 分钟，补细节 40 分钟。Perplexity 文献综述 的短板也明显：知网和中文期刊基本搜不到，中文材料还得回学校图书馆补。另外每篇进 Sources 的文献只看标题、年份和实验设置，别被摘要里的漂亮措辞带跑，一份初稿我通常要删掉三分之一检索结果。\n\n## 第三步：两个必须记住的避坑点\n\n避坑一：引用幻觉。它会给出格式完美、DOI 却不存在的条目，英文综述类提问尤其高发，我抽样下来错误率约 15%，所以 Perplexity 学术 检索 出来的每条引用都得再核一遍，宁可少写三条也不能错一条。避坑二：额度。免费版每 4 小时 5 次，写到一半断供很尴尬，我的做法是开工前先把检索一口气跑完，把来源列表单独存成文档，后面只做 Perplexity 引用核对，不再搜。Perplexity 引用核对 这件事看着笨，省下的却是整段返工的时间。\n\n## 总结\n\nPerplexity 学术 检索 省的是翻二十页搜索结果的时间，不是替你读论文。三个模板加上逐条核 DOI，一篇综述的文献准备能稳定压到一小时左右。这半年 4 篇 Perplexity 文献综述 都是这么跑出来的。如果只是课程论文，免费额度加三个模板就够了，不用急着开 20 美元的 Pro。记住两句话：数字回原文，引用见 PDF。","path":"articles/util/01-perplexity-academic-search.md"},{"id":"util-02-notebooklm-podcast","title":"NotebookLM 播客 生成：中文双人对谈","category":"util","keywords":["NotebookLM 播客 生成","中文播客","音频概览","自定义提示词"],"longtail":["NotebookLM 中文播客","NotebookLM 自定义播客提示词"],"tags":["播客生成","音频概览","知识库"],"content":"把 60 页的技术白皮书压成通勤路上能听的 12 分钟音频，这件事我用 NotebookLM 播客 生成 做了 40 多次，中英文都试过，踩的坑比教程多，今天只讲能复现的参数和流程。\n\n## 建库前先做三件事\n\n每个笔记本最多放 50 个来源，单个来源上限约 50 万词，但我实测把一份 60 页白皮书拆成 3 个 PDF 反而索引得更准。上传后先用提问让它给一段 200 字摘要，确认识别正常；扫描版 PDF 没有文字层，读进去是空的，得先 OCR。来源不要混放播客脚本和新闻报道，音频概览会把两者当成同一个作者的观点来对谈。上传顺序也影响索引，先传目录和结论章节再补附录，生成的音频结构会清楚很多。我习惯把每份材料的标题改成作者加年份加主题，音频提到来源时不容易串。另一个细节：来源全英文时它会生成英文播客，中文材料占比要过半才稳定输出中文。\n\n## NotebookLM 播客 生成 的实际参数\n\n点右侧音频概览里的自定义按钮，NotebookLM 自定义播客提示词 我固定写四件事：用中文、双人对谈、一人提问一人举例、语速中等，再加一句不要直接念百分比，实测 45% 会被念成百分之四十五，听感很差。一次生成约 8 到 12 分钟，3 万词以内的材料 2 到 4 分钟出结果。免费版每天有次数限制，批量做之前先拿一份短材料试音色。长材料可以在提示词里注明只讲结论和数字，篇幅能压到 8 分钟出头。音色目前中文可选的不多，语速别调快，1.1 倍以上断句会乱。生成完可以进交互模式追问，音频会停下来回答，适合边听边记。\n\n## 避坑清单\n\n避坑一：它会给播客补数字，原文明明只写增长显著，音频里能说出增长 38%，所有数字回原文核。避坑二：NotebookLM 自定义播客提示词 别超过 3 条要求，塞 8 条它会顾此失彼，连结构都乱。避坑三：人名和英文缩写必念错，生成前把关键术语替换成中文写法。避坑四：中文断句偶尔怪，重要结论另外导一份文本对照听。避坑五：音频概览只基于上传的来源，缺的背景数据它不会自己补。避坑六：同一份来源连续生成两次，两位主持人的分工可能对调，别把顺序当固定结构。NotebookLM 中文播客 我一直只当预读，正式引用还是回原文。\n\n## 总结\n\nNotebookLM 播客 生成 适合把必须读但不想读的材料转成通勤内容，文档越干净效果越好。每天通勤听两篇 12 分钟音频，一周能过完一份白皮书。听完花 30 秒把三点结论记进笔记，不然一周后全忘。只想判断一份报告值不值得看时，听前 3 分钟就够。记住三条：先 OCR、来源别混、数字回原文；NotebookLM 中文播客 当预读，别当结论。","path":"articles/util/02-notebooklm-podcast.md"},{"id":"util-03-otter-meeting-transcript-cn","title":"Otter 会议 转写 中文：说话人分离实测","category":"util","keywords":["Otter 会议 转写 中文","中文转写","说话人分离","会议纪要"],"longtail":["Otter 中文会议转写","Otter 说话人分离"],"tags":["会议转写","语音识别","会议纪要"],"content":"周三跨部门周会 1 小时 42 分钟，这次我用 Otter 会议 转写 中文 的流程处理完，转写稿丢给同事做纪要，她光改标点改了 20 分钟。会议录音丢进去 3 分钟出稿，但中文的处理链路比英文长得多，下面是我用了 8 个月的设置和改法。\n\n## 上传前的三个设置\n\n免费版每月 300 分钟、单次对话上限 30 分钟，一小时会议会被拆成两段；Pro 年付折合每月约 8.33 美元、每月 6000 分钟。导入时语言选简体中文，别用自动识别，中英混说时自动识别会整段切成英文。Otter 说话人分离 要在设置里打开说话人标签，参会超过 6 个人会串号，建议按议题分段录。Pro 的 6000 分钟按月清零，月底没用完就浪费，团队账号比个人划算。开会前 5 分钟做一次 10 秒测试录音，回放确认声卡选的是耳机麦克风，而不是笔记本自带阵列。别在手机端边录边开省电模式，后台被系统杀掉会丢掉最后 10 分钟。\n\n## Otter 会议 转写 中文 实测准确率\n\n拿 25 分钟产品评审录音实测：普通话标准、近场麦克风时准确率约 92%；线上会议有回声降到 85%；带口音 78% 左右。标点是最明显的短板，Otter 出的是没有句读的长句，我的做法是导出纯文本后用本地模型补标点，再人工过一遍人名。公司名、产品代号提前加进自定义词汇表，能救回一半专有名词，这步很多人跳过。Otter 中文会议转写 的另一个问题是数字，涉及金额的句子错误率明显更高，语速放慢能扳回三四个百分点。我统计过 5 场会议，标点缺失带来的返工时间平均每场 18 分钟。\n\n## 避坑与合规\n\n避坑一：录音默认上传云端，涉及薪资、客户名单的会别用，或换本地方案。避坑二：免费版 30 分钟上限到了会静默切段，重要会议别踩点。避坑三：共享链接默认有链接就能看，转写稿常含内部信息，导出后立刻改权限。避坑四：Otter 说话人分离 在 7 人以上容易串号，会前让每人说一句名字能帮它对齐。避坑五：抢话的会议里两句话会被粘成一句，这种段落标上待回听，别硬猜。导出格式记得选纯文本，Word 里的说话人标签会变成表格，后期处理更麻烦。\n\n## 总结\n\nOtter 会议 转写 中文 的定位是省掉听录音的时间，不是直接出终稿。语言固定中文、提前加词表、录完立刻补标点，一小时会议的整理时间能从 50 分钟压到 15 分钟。三件事别忘：分段录、改权限、敏感会议不上云；Otter 中文会议转写 更适合内部初稿，对外发布的纪要还得自己顺一遍。全英文会议的准确率能到 95%，中文反而更挑音质。","path":"articles/util/03-otter-meeting-transcript-cn.md"},{"id":"util-04-readwise-reader-summary","title":"Readwise Reader 摘要：高亮回链","category":"util","keywords":["Readwise Reader 摘要","Ghostreader","高亮回链","每日回顾"],"longtail":["Ghostreader 摘要","Readwise 每日回顾"],"tags":["阅读管理","摘要","高亮"],"content":"信息流里 80% 的长文我只想留三段结论，所以摘要功能我用得极狠。Readwise Reader 摘要 这套用法跑了快一年，从摘要比原文还长，调到能直接贴进周报，关键在三个设置。\n\n## 打开之前先清版\n\n网页用阅读模式去掉导航和广告，否则摘要会花一整段复述相关阅读。PDF 先点清洁视图，双栏论文的脚注会混进正文，摘要里就会冒出莫名其妙的参考文献编号。图片型 PDF 没有文字层，Ghostreader 摘要 会直接提示内容过短，这种先做 OCR。代码块多的技术文要留意，摘要会跳过代码，只看注释容易误读。图片说明也常被当成正文，出现一段没有上下文的文字，读摘要时要能分辨。付费墙残留同样会污染摘要，抓不到正文时先手动滚到底部加载。\n\n## Readwise Reader 摘要 的三档用法\n\n默认 Summarize 输出 3 到 5 句，英文 4000 词长文约 6 秒出结果。我固定三档：一句话 30 字结论、150 字五条要点、500 字带引用位置的精读笔记。第二档用自定义指令写成用中文输出 5 条要点、每条约 30 字、保留原文数字和年份；第三档要求每条要点标注对应的小标题，方便跳读。英文论文的公式编号会被写成乱码，摘要里看到方括号编号直接跳过。摘要生成后点保存，会进 Readwise 每日回顾，和原文高亮一起复习。点摘要里的句子能跳回原文位置，这是它比复制粘贴强的地方。三档不必每次都跑满，资讯类只用第一档，论文才用第三档，不然时间全耗在摘要上。第一档我常直接粘进待办清单，只留结论和一条依据。\n\n## 避坑三条\n\n避坑一：摘要会丢限定条件，在某个条件下成立常被删掉，涉及数字和结论的段落必须回原文看，我至少抓过 6 次这种误读。避坑二：自定义指令改完只对下一篇生效，想长期用要存成模板；30 天试用到期后 Ghostreader 摘要 会停。避坑三：摘要不区分段落主次，引言和结论给的空间一样大，有用的结论常被压到最后一句。避坑四：摘要语言跟界面语言走，界面英文时得明确要求用中文输出，不然是机翻味。避坑五：摘要字数越多出错概率越高，500 字那一档要看得更细。摘要不能代替精读，这一点必须先认清。\n\n## 总结\n\nReadwise Reader 摘要 的定位是筛要不要精读，不是替代阅读。先清洁视图，再用三档指令，最后让摘要回到 Readwise 每日回顾 里复习，一天 20 篇长文的处理时间从 2 小时降到 40 分钟。同一天的摘要集中复习比零散看有效，我把回顾时间固定在早上 8 点。凡是带数字的摘要，回原文确认一次，PDF 表格还是自己看。","path":"articles/util/04-readwise-reader-summary.md"},{"id":"util-05-immersive-translate-paper","title":"沉浸式翻译 论文：PDF 双语对照与术语表设置","category":"util","keywords":["沉浸式翻译 论文","双语对照","术语库","PDF 翻译"],"longtail":["沉浸式翻译 PDF 翻译","沉浸式翻译 术语库"],"tags":["论文阅读","PDF 翻译","术语管理"],"content":"一篇 18 页的英文论文，我原来开着三个窗口对照，现在一份双语 PDF 搞定。沉浸式翻译 论文 这套流程我试了 30 多篇，术语表是拉开差距的那一步，改论文那两周每天读两篇，速度基本决定了进度。\n\n## 三种打开方式\n\n浏览器装扩展后，网页按 Alt+A 出双语对照。PDF 直接拖进浏览器打开，右键选翻译，输出左右对照的网页版，18 页论文约 40 秒出结果。另一种是上传到网页版做沉浸式翻译 PDF 翻译，生成可下载的双语 PDF，免费版按月给页数额度，Pro 月付 69 元放开。我一般用第一种，公式和图表位置保留最完整；第二种适合发给导师看，排版干净。PDF 超过 50 页建议先分章，整本一次性翻译容易在中段丢页。免费版月额度大约 30 页 PDF，Pro 按月续，别在月底批量下论文。拖进去之后先等右侧大纲加载完再点翻译，不然公式区域会错位。\n\n## 术语表是重点\n\n设置里的术语库，把 attention 固定成注意力、ablation 固定成消融实验，一次建 30 到 50 条，之后所有论文沿用，前后译名不会打架。实测 30 条术语能覆盖一篇论文九成专业词。沉浸式翻译 术语库 支持导入表格，同门之间可以共用一份。沉浸式翻译 术语库 还能按学科建多份，切项目时记得切换，否则生医词汇会混进机理论文。术语条目最好中英对照写，只写英文有时匹配不到复数形式。模型选 DeepSeek 或 GPT-4o 这一类，学术长句的断句明显比默认免费模型顺。读方法章节用沉浸式翻译 双语对照，读引言可以直接只看译文，不用来回滚。沉浸式翻译 论文 真正省时间的地方是查引用，双语并排不用翻页。\n\n## 避坑与校对\n\n避坑一：双栏 PDF 的公式会被拆成乱码，公式页建议看原文，别信译文里的符号。避坑二：术语表优先级高于模型，一条错译会污染全篇，建完先在 2 页样张上验证。避坑三：免费额度按字符算，一篇 18 页论文约 4 万字符，多篇并发容易中途降级成低质量模型。避坑四：译文不保证数字准确，实验参数表必须逐个对原值，et al. 这类缩写常被译成人名的一部分。避坑五：中文译文会做单位换算，英制转公制后数值可能对不上，引用前看一眼原文。图表标题基本不翻，需要中文标注时手动截取。\n\n## 总结\n\n沉浸式翻译 论文 的提升集中在读方法和查引用两个环节，双语对照省掉切窗口，术语表保证前后一致。18 页论文的阅读时间从 3 小时压到 90 分钟，公式页仍然回原文。先建 30 条术语，再谈速度，沉浸式翻译 PDF 翻译 的免费额度也够每周读三五篇。","path":"articles/util/05-immersive-translate-paper.md"},{"id":"util-06-mem-note-linking","title":"Mem 笔记 关联：300 条旧笔记怎么串起来","category":"util","keywords":["Mem 笔记 关联","向量检索","笔记管理"],"longtail":["Mem 笔记检索","Mem 自动关联"],"tags":["笔记管理","知识库","向量检索"],"content":"我在 Mem 里存了 300 多条零散笔记，关键词搜索经常搜不到要的东西，直到用关联面板按语义翻出三年前的一条会议记录。Mem 笔记 关联 靠的不是文件夹，而是向量相似度，写法跟传统笔记软件完全反过来，这篇讲怎么让它自己找上门。\n\n## 先决定笔记的颗粒度\n\nMem 的自动关联吃的是单条笔记的语义，一条只放一个观点，超过 300 字就拆成两条。导入旧笔记走 Markdown，标题写成完整句子，比如客户 A 更在意交付周期，比只写客户 A 更容易被匹配到。我实测 300 条笔记首次索引约 10 分钟，索引没跑完时关联面板是空的，别急着判断没效果。每天的日记也建议拆成待办、决策、观察三类，不然后面检索全是流水账。同一个项目的前缀统一，用项目名开头，向量命中会更稳。另一个经验是给每条笔记补一句为什么记录，这句解释的信息量最大。Mem 自动关联 只看语义相似度，不看你把笔记放在哪个目录下。\n\n## Mem 笔记 关联 怎么触发\n\n写新笔记时右侧会自动浮出相关笔记和推荐标签，先看 3 条推荐里有没有命中旧记录，再决定要不要补标签。用命令面板输入 /ask 可以直接问上次讨论定价是在哪条笔记，它会给出答案和来源笔记，响应约 3 秒。问题要带上下文，问定价不如问 B 客户对年付折扣的顾虑，命中率能差一倍。标签别建太细，三层以内就够，Mem 笔记检索 主要靠语义，标签只是辅助。中文笔记里混几个英文专有名词，命中率还能再提一点。Mem 自动关联 的推荐只在写作当下出现，过去后再难复现，看到有用的直接点收藏。\n\n## 五个容易踩的坑\n\n避坑一：Mem 的问答会引用过期笔记，重要结论必须点开来源看日期。避坑二：免费额度有限，笔记过千条后同步排队明显，批量导入放在晚上。避坑三：客户隐私整段贴进去等于交给向量索引，敏感内容改成代号。避坑四：自动关联的结果按时间衰减，旧笔记容易被埋下去，重要的手动置顶。避坑五：多设备同时编辑同一条会覆盖，手机上只读不写。\n\n## 总结\n\nMem 笔记 关联 解决的是记了但找不到的老毛病，前提是颗粒度够小、标题写成完整句子。300 条笔记索引 10 分钟之后，找一个旧结论从 5 分钟缩到 10 秒。每周花 10 分钟清理标签，比事后翻记录省事得多。搜索结果默认按相关度排，时间久的笔记靠前，找旧结论时把时间范围缩小。Mem 笔记检索 的上限取决于你写得多具体，先跑通 50 条再谈全量迁移。","path":"articles/util/06-mem-note-linking.md"},{"id":"util-07-suno-lyrics-check","title":"Suno 歌词 检测：违禁词与版权风险实测清单","category":"util","keywords":["Suno 歌词 检测","歌词审核","AI 音乐"],"longtail":["Suno 中文歌词","Suno 敏感词过滤"],"tags":["AI 音乐","歌词","版权"],"content":"写好的歌词丢进 Suno，最气的是等 1 分钟结果出来是纯音乐，或者副歌里某个词被吞掉。这类问题九成能在提交前查出来，我把流程固化成四步，每首歌花 3 分钟，省下的是重新生成的时间和积分。\n\n## Suno 歌词 检测 先扫四样\n\n一是敏感词：Suno 敏感词过滤 的规则不公开，我自建了 60 个词的清单，暴力、违禁药物、真实人名和部分地名都在里面，命中后常见结果是整段变器乐或直接生成失败。二是长度：歌词框上限约 1000 字符，两段主歌加副歌通常会超，超了会静默截断最后一段。三是版权：整段照搬现成歌曲的歌词，成功率很低，还容易触发审核。四是结构标签：Suno 识别方括号里的 Verse、Chorus、Bridge，中文标签不认，写成中文会被当成歌词唱出来。中文里绕开的写法一样会被拦，副歌里出现真实医院名我试过两次，两次都变成纯音乐。歌词里出现药品名、地名同样会被拦，我把 60 个词按严重程度分三档，红色词直接不用。\n\n## 中文歌词的参数\n\n我固定用英文结构标签配中文歌词，4 到 6 个标签最稳，多了它会开始重复副歌。每段 4 句、副歌重复两次，实测这种结构出歌成功率明显更高。Suno 中文歌词 的发音问题集中在多音字，得地了经常被唱成轻声，改词比调参数有效。语速快的说唱别一次塞 8 句，拆成两段生成再拼接更可控。免费版每天 50 积分只够 10 首，Pro 每月 10 美元 2500 积分，批量做之前先用 1 首试结构。Suno 中文歌词 我一般先做 30 秒试听版，结构对了再生成完整版。风格标签写 Pop、Ballad 这类英文词，中文风格描述识别很差。把这份清单存成模板，每次写完歌词照打勾，能省一轮返工。生成后如果副歌被吞，先把那段改成同义表达再试一次，别原样重跑。\n\n## 避坑与积分的账\n\n避坑一：生成失败也扣积分，免费账号每天只够 10 首，歌词有问题等于白烧。避坑二：Suno 歌词 检测 查不出押韵和断句问题，中文歌先自己念两遍。避坑三：别用明星名字做歌名或歌词，容易触发审核。避坑四：Suno 敏感词过滤 有时会吞掉整个副歌，导出后一定完整听一遍。避坑五：同一段词换 3 个风格标签，效果差距比改歌词还大。避坑六：歌词里出现方括号外的括号会被念出来，缩写也要展开写。\n\n## 总结\n\nSuno 歌词 检测 这步花 3 分钟，能省掉反复重生成的时间和积分。扫敏感词、控长度、用英文结构标签、确认版权，四件事做完再点生成。歌词可以重写，积分和耐心不行。先拿 1 首试结构，再批量跑。","path":"articles/util/07-suno-lyrics-check.md"},{"id":"util-08-real-esrgan-upscale","title":"Real-ESRGAN 图片 放大：显存与耗时","category":"util","keywords":["Real-ESRGAN 图片 放大","图片超分","显存占用"],"longtail":["Real-ESRGAN 显存占用","Real-ESRGAN 模型选择"],"tags":["图片超分","开源工具","显存优化"],"content":"上周把一张 800×600 的产品图放到 3200×2400 做展会物料，客户要求边缘不能糊。试了四个模型，最后是 Real-ESRGAN 的 4x-UltraSharp 加切片参数救回来的，一张 6 秒，显存峰值 4.8G。\n\n## 模型怎么选\n\n官方包里 RealESRGAN_x4plus 适合照片，x4plus_anime_6B 适合插画和二次元，4x-UltraSharp 锐化更狠、适合产品图和文字。我用 RTX 3060 12G 实测：800×600 放 4 倍，x4plus 约 6 秒一张、显存峰值 4.8G；anime_6B 约 4 秒；小模型 2 秒但细节明显弱。8G 以下显存必须加切片参数，不加会直接爆显存。Real-ESRGAN 模型选择 没有万金油，人像用 x4plus 更自然，带文字的海报用 UltraSharp。Real-ESRGAN 显存占用 主要看输出尺寸，4096 以上的图建议先切块。4x-NMKD-Siax 这类针对压缩视频的模型适合截图修复，夜景用它比 x4plus 干净。官方脚本换模型只改 -n 后面的名字，权重放在 weights 目录，不用重装环境。\n\n## Real-ESRGAN 图片 放大 的命令行参数\n\n命令是 python inference_realesrgan.py -i 输入目录 -o 输出目录 -n RealESRGAN_x4plus -s 4 -t 512 --outscale 4。重名文件会覆盖，输出目录先清空。批量跑把 -i 指向文件夹，别一张张排队。想让边缘更干净加 --pre_pad 10；文字图加人脸增强反而会把人像皮肤磨平，慎用。一张 1024 的图放 4 倍后是 4096，PSD 里再缩回 50% 反而更锐。放大后先导 PNG，JPG 再压一次边缘就回来了。脚本支持 --suffix 参数，批量处理时给输出加后缀避免覆盖；python 环境建议 3.10 以上、torch 装 2.x。显存 4G 的笔记本开 -t 256，800 像素宽的图约 20 秒。输入图超过 2000 像素时先缩到 2000 再放大，速度能快三成；输出的 PNG 一张 4000 像素的图有 20MB 左右，硬盘别省。模型文件合计约 130MB，x4plus 和 anime_6B 两个都下也不占空间。显存 4G 的卡用 -t 128 也能出图，只是慢一倍，别直接放弃；插画放大后色彩会偏艳，交付前手动降 3 点饱和度。人脸图先用 x4plus 跑一张看发丝，再决定要不要 UltraSharp。输入分辨率太低时先做一次轻度降噪，噪点少了放大结果更干净，导出的 PNG 再用无损压缩过一遍，体积能小 30% 左右。\n\n## 四个坑\n\n避坑一：人脸别盲目开人脸增强，老人和侧脸会被磨成塑料。避坑二：JPG 输入先转 PNG，反复压缩的伪影会被放大成噪点。避坑三：4 倍不是越大越好，超过原图 8 倍属于凭空编细节，印刷按 300dpi 反推尺寸。避坑四：Real-ESRGAN 显存占用 在 6G 卡上跑 4 倍 4K 图会中断，先切 512 的块再拼。避坑五：模型权重文件要单独下载，默认只有 x4plus 一个。避坑六：输出目录别放中文路径，个别版本会报编码错误。把 4 倍输出再缩到 2 倍尺寸用，细节也比原图直接放大好。Real-ESRGAN 图片 放大 我一般先用两张对比，选完模型再批量。\n\n## 总结\n\nReal-ESRGAN 图片 放大 的效果七成取决于模型和输入质量，参数只是兜底。Real-ESRGAN 模型选择 比调参数重要，产品图选 UltraSharp，插画选 anime_6B，显存不够就切 512 的块。800×600 到 3200×2400 只要 6 秒，比外包重绘便宜太多。但别指望它救回一张已经糊掉的原片。","path":"articles/util/08-real-esrgan-upscale.md"},{"id":"util-09-ai-video-watermark-removal","title":"视频 去水印 AI：逐帧跟踪与镜头修复实测","category":"util","keywords":["视频 去水印 AI","视频去水印","跟踪遮罩"],"longtail":["剪映 去水印","水印 版权风险"],"tags":["视频处理","去水印","剪映"],"content":"客户送来一段 30 秒素材，角落压着平台的半透明水印，要求保留原画质。我试了三个方案，最后用剪映的跟踪遮罩加局部修复搞定，代价是 45 分钟。视频 去水印 AI 这类活没有一键方案，下面按背景复杂度给结论。\n\n## 视频 去水印 AI 的三种方案\n\n一是整帧 AI 消除，剪映的消除笔或 Premiere 的内容识别填充，水印在纯色背景上好用，背景有纹理就糊成一块。二是跟踪加模糊，加马赛克或高斯模糊，30 秒视频要逐段调跟踪点，水印压在移动物体上基本会漂。三是遮挡重绘，用水印附近的干净区域做贴片，能动但费时间。1080p、30 秒的素材，方案一约 8 分钟，方案二 20 分钟，方案三 45 分钟。背景越干净，AI 越省事；人物、毛发、水面这几类基本只能靠手工。剪映 去水印 的自动跟踪只在物体匀速移动时准。水印在画面中间、背景是渐变时，方案一直接重绘比贴片自然。同一段素材我先用方案二做了 20 分钟版本，客户说边缘抖动，最后才回到方案三。\n\n## 我的操作步骤\n\n1. 剪映导入后复制一层，上层加矩形蒙版框住水印，羽化 2 到 3 像素。2. 给蒙版打关键帧跟踪，每 5 到 8 帧微调一次，水印不跟物体走就别开自动跟踪。3. 下层用画面修复功能，或者镜像一块干净背景盖上去。4. 导出选 H.264、码率 20Mbps 以上，避免二次压缩把补丁边缘压出块。逐帧看一遍，水印边缘有 1 像素残留就重来。水印 版权风险 要提前问清楚，平台水印通常带作者信息。关键帧密度不够时先放慢预览到 25% 速度再打点，比凭感觉点准。平台水印一般有轻微位移，蒙版每 100 帧要检查一次。\n\n## 避坑与边界\n\n避坑一：水印压在人脸上，任何 AI 都会重绘出陌生五官，只能换素材。避坑二：平台水印去掉再商用涉及侵权，客户素材要先确认授权链条。避坑三：反复导出的视频码率掉到 8Mbps 以下，噪点会被当成细节放大。避坑四：剪映 去水印 的消除笔是逐帧计算的，长视频分段处理更稳。避坑五：水印 版权风险 不只是平台，素材里的人物肖像也要授权。避坑六：导出前复制一份工程，修复层盖住原片后不好回退。如果是固定位置的水印，剪映里给蒙版套一个预设，下次直接复用。全片修完再统一调一次锐化，补丁的边缘会更融。\n\n## 总结\n\n视频 去水印 AI 本质是局部重绘加时间轴对齐，不是魔法。背景简单 8 分钟能搞定，人物和复杂纹理只能手工贴片。30 秒素材留 45 分钟，导出码率别低于 20Mbps。版权这事提前问清楚，比事后补授权便宜。","path":"articles/util/09-ai-video-watermark-removal.md"},{"id":"util-10-local-pdf-qa","title":"本地 PDF 问答：7B 模型离线建库全流程","category":"util","keywords":["本地 PDF 问答","本地知识库","Ollama"],"longtail":["Ollama 本地部署","PDF 扫描件 OCR"],"tags":["本地部署","知识库","隐私"],"content":"公司内网的合同和研报不能传云端，我搭了一套本地 PDF 问答 环境：180 份 PDF 灌进本地知识库，用 Ollama 跑 7B 模型，问这份合同违约金怎么算能定位到第 12 页。整套装完 40 分钟，机器是 16G 内存加 8G 显存的台式机。\n\n## 装什么、占多大\n\nOllama 拉 qwen2.5:7b-instruct，模型文件约 4.7G，8G 显存刚好跑满；再装 AnythingLLM 桌面版，把大模型指向 Ollama，向量模型用内置的 nomic-embed-text，约 274MB。Ollama 本地部署 的坑在下载，几个 G 的文件走公司网要十几分钟。PDF 直接拖进工作区，切块设 1000 字符、重叠 200，180 份 PDF 建库约 12 分钟。全程断网也能问，数据不出机器。8G 显存是及格线，16G 内存是底线，再低会频繁换页。AnythingLLM 个人用桌面版就够，团队版要另配数据库，多花两小时。向量模型换 bge-m3 中文检索更准，显存多占 1G 左右。\n\n## 问法与准确率\n\n问题要带指向，2023 年那份采购合同的违约金比例是多少，比单问违约金命中率高得多。每个回答会附 3 到 5 个引用片段，点开核对页码，答错时多数是检索片段不对而不是模型胡说。我测了 60 个问题：合同条款类答对 52 个，跨文档对比类只对 31 个，因为它只检索片段、不做全表汇总。单问耗时 6 到 10 秒，长文档首问 20 秒左右。PDF 扫描件 OCR 质量直接决定上限，先跑一轮 OCR 再入库。本地 PDF 问答 更适合查条款、查定义，不适合让模型做统计。跨文档对比类我先让它列文档清单再逐个问，正确率能提到 45 个左右。上周查一份 2022 年的框架协议，7 秒给出条款原文，同事手动找了 40 分钟。\n\n## 五个避坑点\n\n避坑一：扫描版 PDF 没有文字层，不 OCR 就是空文档，问什么都说找不到。避坑二：7B 模型中文长文档容易答非所问，把切块降到 800 字符、召回调到 5 会好一些。避坑三：14B 模型要 16G 显存，8G 卡硬上会爆，别信教程说能跑。避坑四：Ollama 本地部署 的模型更新会重置对话，重要问答结果单独存档。避坑五：PDF 扫描件 OCR 出来的错字会被检索放大，专有名词最好建一个纠正词表。避坑六：回答里的页码是切块位置不是 PDF 页码，核对时按内容搜更快。切块 800 字符的召回率比 1000 好一点，代价是建库慢两分钟；索引没跑完时强行提问会一直转圈。涉密等级高的文件单独建工作区，别和普通资料混在一起；Ollama 本地部署 完先在 11434 端口做连通确认，不然后面报错找不到原因。\n\n## 总结\n\n本地 PDF 问答 的性价比在于数据不出机器，代价是准确率和速度不如云端。8G 显存跑 7B、180 份 PDF 12 分钟建库、单问 6 到 10 秒，日常查条款够用。扫描件先 OCR，复杂汇总还是手动做。机器低于这个配置，别硬上 14B。如果只是偶尔查几份文件，用云端工具更省事；本地方案适合天天查、资料还敏感的人。","path":"articles/util/10-local-pdf-qa.md"},{"id":"util-11-offline-speech-to-text","title":"离线 语音转文字：Whisper 模型选型与显存","category":"util","keywords":["离线 语音转文字","Whisper","本地转写"],"longtail":["faster-whisper 转写","Whisper 中文标点"],"tags":["语音转文字","Whisper","离线工具"],"content":"一段 2 小时 13 分的采访录音，我用 faster-whisper 的 large-v3 跑完用了 19 分钟，全程没联网。代价是 3G 的模型文件和 8G 显存，下面把选型和参数摊开，都是重复验证过三次以上的结论。\n\n## 离线 语音 转文字 的模型怎么选\n\nlarge-v3 模型约 3G，中文准确率最好，RTX 3060 上约 7 倍实时；medium 1.5G，CPU 也能跑，i5 上 1 小时音频约 35 分钟；small 480M，适合会议速记但中文错字明显。纯 CPU 环境我推荐 medium 加 int8 量化，内存至少 8G。显存 6G 以上直接上 large-v3，别在模型上省钱。离线 语音转文字 的瓶颈其实是模型体积和下载速度，3G 文件首次要下 20 分钟。内网机器提前用 U 盘拷模型目录，能省一半时间。显存只有 6G 时 large-v3 用 float16 会紧，换 int8 精度略掉但能跑。medium 在 M1 芯片上跑 1 小时音频约 12 分钟，比同价位 CPU 快一倍。\n\n## 命令与参数\n\n命令是 python -m faster_whisper 音频.mp3 --model large-v3 --language zh --compute_type float16 --beam_size 5。中文标点靠提示词，写一句以下是普通话会议记录、请加标点，断句会明显改善，Whisper 中文标点 的坑基本都在提示词这一步。长音频加 VAD 切分，静音超过 2 秒自动断开，转写时间还能省 15%。输出格式选 SRT 带时间戳，方便回听定位。faster-whisper 转写 的速度取决于显卡，CPU 上换 int8 大概慢 3 倍。多人会议要另接说话人分离，Whisper 本身不标注谁说的。访谈类素材把 beam_size 降到 3 速度更快，错字几乎不变；输出 SRT 后字幕偏移超过 0.5 秒就重跑 VAD。同样 2 小时 13 分的录音，商用云端按分钟计费要 60 多元，本地只花电费。\n\n## 五个避坑点\n\n避坑一：模型文件 3G 是硬门槛，第一次运行卡在下载别以为是死机。避坑二：中英混说时 language 固定 zh，英文词会被音译成汉字，专有名词事后替换。避坑三：显存不足会静默降级到 CPU，速度掉 5 倍以上，任务管理器里看着像卡住。避坑四：离线 语音转文字 不处理背景音乐，带 BGM 的录音先做人声分离。避坑五：Whisper 中文标点 在问句上常漏问号，导出后搜索替换一遍。避坑六：默认模型缓存在用户目录，C 盘小的先改缓存路径。模型放 SSD 上加载快一倍，机械硬盘第一次加载要 40 秒；第一次跑 large-v3 会额外下载 1G 的配置，别断网。批量转 10 个文件写个循环脚本，晚上挂着跑，第二天收 SRT；Whisper 中文标点 在连续口语里会把逗号全吃掉，导出后按 8 到 12 字补回来。字幕帧率要和剪映工程一致，25 帧和 30 帧混用会错位。\n\n## 总结\n\n离线 语音转文字 的稳定组合是 faster-whisper 加 large-v3 加固定中文提示词，2 小时 13 分录音 19 分钟出稿。隐私敏感的场景值这个时间，模型选大不选小。标点靠提示词，说话人分离另外想办法。faster-whisper 转写 长音频记得开 VAD，省时又省显存。第一次搭建先用 10 分钟音频跑通全流程，再上长录音；输出目录统一放 D 盘，C 盘空间不够会中途失败。","path":"articles/util/11-offline-speech-to-text.md"},{"id":"util-12-ai-detection-rewrite","title":"AI 检测 降重：人工改写与句式拆分","category":"util","keywords":["AI 检测 降重","AIGC 检测","人工改写"],"longtail":["知网 AIGC 检测","论文 AIGC 率"],"tags":["论文写作","AIGC 检测","降重"],"content":"一个 8000 字的毕业设计说明，知网 AIGC 检测出来 68%，导师要求降到 10% 以下。这次 AI 检测 降重 我用了三个晚上改到 9%，过程不神秘，但机器改写工具基本没用，下面是我复盘的步骤和数字。\n\n## AI 检测 降重 到底看什么\n\nAIGC 检测主要看困惑度和句式规律：长句、并列结构、首先其次最后这类过渡词密度高，机器味就重。我拿 2000 字样章做过对比，把 42 字的长句拆成 3 句、删掉 6 个此外之后，同一段的疑似度从 71% 掉到 34%。所以核心是改句式，不是换同义词。知网 AIGC 检测 的报告会给分段疑似度，先挑高于 50% 的段落改，效率最高。检测一次约 15 分钟、按篇收费，改一版测一版很费钱。我把报告里的分段截图存下来，改完对照看，掉得慢的段落通常是文献综述。同组另一篇 5000 字从 74% 改到 14%，用了两晚，字数少不代表好改。\n\n## 具体改法\n\n第一步，每段先删掉开头的总结句，机器爱先给结论再解释。第二步，把通过什么实现什么改成我先把什么然后什么，再加入具体数值和操作细节，检测模型对低频具体信息更宽容。第三步，并列三连改成两句加一个转折，少用不仅而且。被动句也改成主动句，机器偏爱被判断的结构，我们测了 20 组数据才确认。第四步，全文朗读一遍，读起来喘不过气的句子全部断开。8000 字我改了 5 轮，每轮 40 分钟，人工改写 降重 比工具慢但稳。论文 AIGC 率 掉得最快的部分其实是文献综述和方法章节。\n\n## 五个避坑点\n\n避坑一：同义词替换工具越换越像机器，实测只降 3 到 5 个百分点。避坑二：网上付费降 AI 服务要上传全文，论文泄露风险极高，别用。避坑三：检测标准不公开，不同系统结果能差 20 个百分点，别只信一个结果。避坑四：知网 AIGC 检测 对图表说明和公式推导识别弱，这些段落别浪费时间去改。避坑五：论文 AIGC 率 降下来不等于质量过关，逻辑和引用该补还得补。避坑六：用 AI 润色再自己改，等于先把机器味洗一遍，反而更难降。8000 字改完 9%，导师复测 11%，两次差 2 个百分点属于正常波动。AI 检测 降重 之后还要单独查重复率，AIGC 率低不等于重复率低，改完的段落自己读一遍，语感不对就再拆一句。\n\n## 总结\n\nAI 检测 降重 没有一键方案，本质是把机器句式改回人话。删总结句、拆长句、加具体数据、去掉套路过渡词，8000 字三晚从 68% 到 9%。工具只能做初筛，最后一遍必须自己读出声。改完把专业术语核对一遍，别降重降成降质。如果导师只看分数，先问清楚用哪个系统检测，别白改一轮；改得慢的段落隔天再看，眼睛会骗人。","path":"articles/util/12-ai-detection-rewrite.md"},{"id":"util-13-ai-flowchart-generator","title":"AI 流程图 生成：代码导出可编辑矢量图","category":"util","keywords":["AI 流程图 生成","Mermaid","流程图"],"longtail":["Mermaid 流程图代码","Draw.io 导入 Mermaid"],"tags":["流程图","Mermaid","Draw.io"],"content":"给甲方讲审批流程，Visio 画了 40 分钟，对方一句这里要加个驳回就全乱。后来我改成先让模型输出 Mermaid 代码，再导进 Draw.io 微调，改一版 5 分钟。AI 流程图 生成 的价值在初稿，不在终稿。\n\n## 提示词怎么写\n\n提示词要给三样：角色、节点清单、连线规则。我的模板是你是流程顾问，把下面 9 个节点画成 Mermaid 流程图，矩形表示审批、菱形表示判断，驳回线回到上一节点，节点文字不超过 12 字。节点超过 20 个就分两张图，一张塞 30 个框谁也看不清。生成后先查语法，方括号和花括号错一个就渲染失败。层级超过 3 层用 subgraph 分组，比全平铺清楚。AI 流程图 生成 的初稿我一般只保留七成，异常分支模型总会漏。节点清单我按序号写，1 提交申请、2 主管审批，模型按序号连线的准确率比自然语言高。同样的流程，第一版让它自己理解需求，出来 14 个框；给清单后只有 9 个，正好。\n\n## 从代码到可编辑文件\n\nMermaid 流程图代码 复制到 Draw.io 的插入高级菜单里，会自动转成可拖拽的图形，比图片强的地方是每个框还能改。也可以存成 .mmd 文件本地渲染，方便做版本管理。导出选 SVG 或 PDF，PNG 在 200% 缩放下字会糊。中文字体在 Draw.io 里统一设成思源黑体 12 号，不然渲染出来是宋体加粗。Draw.io 导入 Mermaid 的版本要新一点，旧版遇到中文节点会丢标签。Mermaid 里中文括号和冒号都是语法字符，节点文字要用引号包起来。泳道图我用 Draw.io 手画两条泳道再粘节点，比纯代码省 20 分钟。泳道图 Mermaid 支持有限，跨部门流程建议手画泳道再贴节点。\n\n## 五个避坑点\n\n避坑一：模型会漏掉异常分支，驳回、超时、撤单这三条线必须自己补。避坑二：节点名太长会把框撑变形，超过 12 个字拆成两行加换行符。避坑三：Mermaid 版本不一时中文渲染效果对不上，本地固定一个版本。避坑四：AI 流程图 生成 出来的箭头方向常常反了，判断框的出口要一个个对。避坑五：Draw.io 导入 Mermaid 后字体是默认值，导出前统一改，不然甲方看到的是乱码字。避坑六：模型生成的判定框经常和下一个节点直连，少一层驳回，要逐个点开确认。流程图发给甲方前自己用手机看一遍，小屏上字小于 10 号就要拆图。同样的流程第二版把 9 个框合并成 7 个，甲方一次通过。\n\n## 总结\n\nAI 流程图 生成 的性价比在初稿，5 分钟出骨架，补分支和调排版还得自己来。提示词写清角色、节点和连线规则，导出 SVG 保持可编辑。Mermaid 流程图代码 存档之后改十版也不怕，改代码比挪框快。泳道复杂就回手绘，别硬套。","path":"articles/util/13-ai-flowchart-generator.md"},{"id":"video-01-kling-1-6-first-last-frame","title":"可灵 1.6 图生视频 首尾帧：两张图接5秒转场","category":"video","keywords":["可灵 1.6 图生视频 首尾帧","可灵1.6","首尾帧"],"longtail":["可灵首尾帧转场","可灵1.6图生视频参数"],"tags":["可灵","图生视频","首尾帧"],"content":"上周帮一个服装号做变装短片，实拍加剪辑要两天，这次用可灵 1.6 图生视频 首尾帧 做了 8 组，一个下午出完，甲方改了两版颜色也没返工素材。这篇只讲一件事：手里只有开场和收尾两张图，怎么让中间那几秒不融脸、背景不滑步。把首尾帧当普通图生视频用，十有八九会废。\n\n## 两张关键帧必须是同源\n\n可灵首尾帧转场最怕两张图不是一家人：一张正面逆光、一张侧脸顺光，模型只能硬融，中段脸会扭一下，肩线也跟着抖。我的做法是两张图都用图生图从同一张原图改出来：首帧拍正面半身，尾帧只改朝向和外套颜色，焦段不换，主体在画面里的占比都控制在 50% 到 60% 之间。分辨率两张都存 720p 以上，比例必须一致，16:9 就都 16:9，竖屏 9:16 就都 9:16，混着传大概率报错或者出黑边。\n\n## 参数与提示词越窄越稳\n\n入口在“图生视频 → 首尾帧”，模型选 1.6，先用 5 秒跑通。花费我这边是高品质 1080p 5 秒 35 灵感值、10 秒 70 灵感值，普通图生视频便宜不少，所以首尾帧不要拿来试参数。提示词只写运动，比如“人物从正面缓慢转身，衣摆跟着晃动，背景不动”；不要写“镜头切到”“闪白转场”，写了不执行，还会干扰中间帧的补法。可灵1.6图生视频参数里真正影响结果的只有时长和两张图的相似度，其他都是次要的。\n\n5 秒出片先拖到 2 秒附近检查：人脸有没有换、背景有没有滑步。8 组里有 2 组中段发灰，原因是我尾帧那张调了曝光，重做时把两张图色温拉齐就正常了。另外提示词里加了风吹头发，中间帧的发丝会自己动起来，比静止图自然。\n\n## 两个坑在版本入口和时长\n\n第一，版本入口。1.6 刚发布时图生视频面板里没有首尾帧上传位，首尾帧、运动笔刷、运镜是之后才补进来的；我在旧账号里找了十分钟，切到 2.x 模型才看见那个入口。找不到尾帧位别硬等，先确认模型版本。第二，时长别贪，10 秒档失败率明显更高，失败了灵感值照扣，变装这种动作 5 秒反而更利落。\n\n完整步骤可以照抄：两张同源关键帧、首尾帧模式、1.6 加 5 秒 1080p、提示词只写运动、出片检查 2 秒处。三个人一天能产 10 条变装，比实拍一天 2 条快得多。可灵 1.6 图生视频 首尾帧 适合同一主体的小幅动作和转场，换场景的活还是交回实拍。\n\n## 总结\n\n可灵首尾帧转场本质是在两张图之间猜运动，图越同源、提示词越窄，猜得越准。可灵1.6图生视频参数记住 5 秒、1080p、35 灵感值三个数就够开跑。可灵 1.6 图生视频 首尾帧 我还会继续做，但只做变装、回头、推门这类一个动作能讲完的段落。","path":"articles/video/01-kling-1-6-first-last-frame.md"},{"id":"video-02-runway-gen-4-camera-control","title":"Runway Gen-4 运镜 控制：锁死机位","category":"video","keywords":["Runway Gen-4 运镜 控制","Runway Gen-4","运镜提示词"],"longtail":["Runway运镜提示词","Gen-4镜头控制"],"tags":["Runway","运镜","Gen-4"],"content":"给一家咖啡店做探店片，镜头要绕桌子走半圈再推到杯口，实拍得上滑轨加两个人。我用 Runway Gen-4 运镜 控制 试了三版，最后靠三句英文提示词把机位锁住了，成片交付时店长以为是航拍稳定器拍的。运镜不是词越多越好，多写一个动词，画面就多一次不确定。\n\n## 一个镜头只给一个主运镜\n\nGen-4 的镜头语言基本写在提示词里，网页端没有 Gen-3 那排镜头按钮，所以我把它拆成“一个主动作加一个辅助动作”：主运镜 dolly in 推近或者 orbit 环绕选一个，辅助只允许极轻微的 pan。三句模板我固定在用：第一句写主体和动作，第二句写镜头怎么动、机位高度，第三句写环境里不能动的东西，比如 background stays still, glasses on the table do not move。所以 Runway Gen-4 运镜 控制 的第一原则是克制，一个镜头讲清一个运动方向。\n\n提示词上限 1000 个字符，镜头句一定要放最前面。有一次我把场景描述写在前面，模型把注意力全放在灯光上，绕桌走成了原地转圈。这版问题跟运镜词无关，是提示词顺序的锅。\n\n## 先用 5 秒 720p 定轨迹\n\nGen-4 必须有首帧图，纯文字生成不了。参数就三档：5 秒或 10 秒，720p（16:9 是 1280×720，竖屏 720×1280），24fps，六种比例可选。标准版按 12 积分一秒扣，5 秒 60 积分、10 秒 120 积分；Turbo 5 积分一秒，图快但稳定性差一点，运镜片我基本用标准版。套餐按 Standard 15 美元一个月 625 积分算，一个月能跑十条 10 秒镜头。\n\n流程是先用 5 秒确认轨迹，构图对了再上 10 秒重跑，别直接烧 120 积分。Gen-4镜头控制 的稳定性还跟首帧有关：首帧主体靠画面左侧三分之一、前景留个桌角或者门框当参照，环绕的时候画面才不飘。这套 Runway运镜提示词 我改成中文反而更抖，英文模型对镜头术语的理解更准。\n\n## 两个坑是运镜叠词和首帧畸变\n\n第一，别把 dolly in、orbit、zoom in 写在同一句。三个动作叠在一起，模型会同时放大又旋转，人脸被拉宽，广角畸变特别明显，看着像镜头在抖。第二，首帧图本身有畸变的话会被一路放大：手机广角拍的照片边缘是弯的，进 Gen-4 之后墙线越走越歪。我现在的做法是首帧先用相机端 50mm 焦段拍，或者用图生图修一版再喂进去。\n\n还有个隐性成本：改构图要整条重跑，没有局部重绘。所以分镜阶段就把机位定死，别指望后期救。\n\n## 总结\n\nRunway运镜提示词 我按这个顺序写：主体、镜头、静止参照，顺序换了效果就翻车。Gen-4 的运镜是描述出来的，不是调出来的：一句主体、一句镜头、一句静止参照，基本就够。Gen-4镜头控制 我只记两个数字，5 秒 60 积分、10 秒 120 积分，前者定轨迹、后者出成片。Runway Gen-4 运镜 控制 练熟以后，探店片我不再借滑轨，一台机器加一张首帧就能出绕桌镜头。","path":"articles/video/02-runway-gen-4-camera-control.md"},{"id":"video-03-sora-storyboard-prompt","title":"Sora 分镜 提示词：两秒处补一句就顺","category":"video","keywords":["Sora 分镜 提示词","Sora 2","storyboard"],"longtail":["Sora分镜时间轴","Sora提示词模板"],"tags":["Sora","分镜","提示词"],"content":"Sora 的 storyboard 面板第一眼很容易用错：很多人把它当成多写几段提示词，结果 10 秒里塞了 5 个动作，成片像快进。我给一支家居品牌做 3 条 10 秒素材时发现，真正的差别不在写多少，而在每句提示词落在时间轴的哪个点上。这篇讲清 Sora 分镜 提示词 的落点规则，不聊玄学。\n\n## 时间轴按动作切，不按秒数切\n\n一个 10 秒片段，我一般只放 3 到 4 个分镜点，平均 2.5 秒一个动作。比如 0:00 是全景推门进客厅，0:02.5 切到沙发上的猫抬头，0:05 手把咖啡放上桌，0:07.5 收尾定格在窗边光线。每次只改时间点后面那句提示词，前面的不动，这样模型改的是这一段发生什么，而不是整条重来。Sora 分镜 提示词 和普通文生视频最大的区别也在这：它改的是局部时间，不是整段重写。\n\n关键是把动作写成能在一个镜头里完成的单个动作。Sora分镜时间轴 一旦设了两段同时进行的事，比如人物走到窗边又坐下，模型会挑一个执行，另一件事直接消失。我第一版就吃了这个亏：写人物坐下打开电脑，成片里人坐下了，电脑一直在手里拿着。\n\n## 参数和成本先说清楚\n\nSora 2 在 ChatGPT 里用，Plus 20 美元一个月、Pro 200 美元一个月。生成 10 秒 720p 大概扣 180 积分，按 1 积分 2 美分算差不多 3.6 美元一条；5 秒 480p 只要 25 积分。分镜改一次等于再生成一次，所以我的做法是先用 5 秒 480p 把节奏跑顺，四个分镜点的动作都能看清，再上 10 秒 720p 出片。一套 Sora提示词模板 能省不少钱：主体、动作、镜头、光线四段式，换商品只改第一段。\n\n分辨率我一般停在 720p，1080p 只在需要放大裁切时用，贵得不成比例。导出前确认一遍时长和比例，Sora 对 9:16 的构图裁得很紧，人物贴边会被切头。\n\n另外，Sora 每次生成都要排队，Pro 的并发比 Plus 高，赶片子时我提前一晚把三条素材全排上。导出后顺手存一份原始文件，平台改版以后历史作品的位置会变。\n\n## 两个坑是水印和分镜密度\n\n第一，水印和元数据。Sora 导出的片子默认带平台水印，Plus 和 Pro 的差别也在这里，商单要先问甲方能不能接受；视频里还嵌了 C2PA 来源信息，别拿真人肖像或者知名 IP 形象去生成，平台会限流甚至拒绝。第二，分镜别太密，每段低于 1 秒，模型基本只出一两帧，画面像抽帧闪屏。真需要快切，在后期剪，不要在 storyboard 里硬写。\n\n## 总结\n\n分镜写的不是文案，是时间轴上的动作指令：一段一个动作、段间留 2.5 秒、先用低成本档跑节奏。Sora提示词模板 和 Sora分镜时间轴 我都存了固定版本，接新项目只改主体和光线描述。Sora 分镜 提示词 练熟以后，10 秒能讲完一个小场景，三条拼起来就是一支 30 秒短片。","path":"articles/video/03-sora-storyboard-prompt.md"},{"id":"video-04-heygen-avatar-lip-sync","title":"HeyGen 数字人 口型：中英混读别超过两成","category":"video","keywords":["HeyGen 数字人 口型","Avatar IV","数字人视频"],"longtail":["HeyGen口型对齐","HeyGen口型错位修复"],"tags":["HeyGen","数字人","口型"],"content":"上周给一家培训机构做课程引流片，讲师没空录，我用 HeyGen 数字人 口型 做了 2 分 40 秒的播报。第一版交付被退回，理由是嘴型慢半拍。这篇把错位的原因和修法讲清楚，重点是音频和文本谁先定，而不是换个形象。\n\n## 先定音频，再对口型\n\n数字人视频有两条链路：文本直接转语音再生成，和上传现成音频做口型。要口型准，我优先走第二条：配音先用 TTS 生成，切成单句，句尾留 0.3 到 0.5 秒静音，再把整条音频传给 HeyGen。这样口型跟着真实波形走，中途改一两个字也不会整段重来。\n\n口型本质是音素对齐，中文里 p、b、m 这几个闭唇音最容易被看出破绽。我把话术里的品牌名、产品名数了一遍，平均 40 秒出现 6 次，闭唇频繁的稿子容错率更低，所以主播画面我会略微侧一点，关键句放到推近之后再说。\n\n## 标点和语速决定对齐精度\n\n文本模式也有救，前提是句子够短。长句拆到 25 字以内，逗号当半拍、句号当整拍，语速压到 0.9 到 1.0 倍。中文 TTS 在 1.1 倍速下，数字人口型会明显追不上，尤其是了、呢、儿这类轻声音节。数字写成中文，2026 年写成二零二六年，英文缩写要么写全称要么换中文，一句话夹三个英文词，口型会跳一下再回来。\n\nHeyGen口型对齐 我一般在导出前逐秒抽查，重点看开头 3 秒的开口帧和每句结尾。HeyGen口型错位修复 说白了就是把音频切碎、把句子改短、把语速拉回 1.0，不是靠换 Avatar IV 型号解决的。这套流程做完，HeyGen 数字人 口型 的破绽基本只剩眨眼频率。\n\n交付前做 30 秒复检：数字人眨眼间隔跟语速绑定，语速压到 0.9 以后眨眼显慢，把首尾各裁 0.2 秒就正常。HeyGen口型对齐 只看开头、句中、片尾三段各 5 秒就够；个别字对不上，先查音频尾部静音有没有裁干净。HeyGen口型错位修复 到这步还没解决，就把整句拆成两句重新生成，别整条返工。\n\n## 两个坑在混读和授权\n\n第一，中英混读别超过两成。一句里超过三四个英文单词，口型会在中文音素和英文音素之间横跳，看着像卡顿。第二，时长和授权。Creator 套餐 29 美元一个月 600 积分，单条视频最长 30 分钟、1080p 无水印；超过 30 分钟要分段做，同一形象两段的位置和背景要截在同一帧，不然接缝一眼能看出来。自己上传的形象需要本人授权，预制形象也要看清商用条款，别拿明星脸蹭流量。\n\n## 总结\n\n口型是结果，音频是原因。先把配音定稿、把句子切短、把语速压回 1.0，再谈形象和背景。HeyGen 数字人 口型 想做到看不出是数字人，不靠更贵的套餐，靠的是稿子写得适合念。现在这套流程做 2 分 40 秒的片子，从改稿到出片 40 分钟，比我以前求讲师补录省一天。","path":"articles/video/04-heygen-avatar-lip-sync.md"},{"id":"video-05-elevenlabs-chinese-emotion","title":"ElevenLabs 中文 配音 情感：标签分行","category":"video","keywords":["ElevenLabs 中文 配音 情感","ElevenLabs v3","情感配音"],"longtail":["ElevenLabs中文配音","ElevenLabs情感标签"],"tags":["ElevenLabs","中文配音","情感"],"content":"一条 2 分 30 秒的探店解说，我用 ElevenLabs 中文 配音 情感 调了四版。前两版甲方只说听着像新闻，第三版把 stability 从 0.75 压到 0.45、按情绪重新分段之后，评论区开始有人说这声音有画面。差别不在音色，在分段和标签。\n\n## 情绪按段落给，不按句子给\n\nElevenLabs 的滑杆只有两个真正影响情绪：stability 和 style。中文解说我把 stability 放在 0.4 到 0.5，style 放在 0.35 到 0.45；stability 拉到 0.75 以上，整条会平得像播通知，压到 0.3 以下又会吃字、换气声变多。v3 模型支持情绪标签，比如 [excited]、[sighs]、[whispers]，但标签是给整段的，不是给某个词的。\n\n所以我的稿子按情绪单元切：一段 2 到 3 句，段首单独一行写标签，空一行再写正文。一条 2 分半的解说大概 5 个情绪单元：开头 [excited]、中间介绍菜品 [whispers]、报价 [serious]。ElevenLabs情感标签 用熟了以后，我把标签和正文写在两行，模型不会再犹豫该念谁。\n\n## 中文咬字的三个开关\n\n第一是数字。1.5 万要写成一万五千，2026 写成二零二六年，直接写阿拉伯数字会读成一点五万，听着外行。第二是标点，中文全角逗号每句最多两个，三个以上会变成三字一顿；长句用句号断开，比加逗号自然。第三是语速，中文 TTS 默认在 1.0 附近最稳，1.2 倍速下轻声和儿化会糊。\n\nElevenLabs中文配音 的字符计费要算清楚：Starter 5 美元一个月 3 万字符，Creator 22 美元一个月 10 万字符，一个汉字算一个字符。一条 3 分钟解说大约 800 字，10 万字符能做一百多条，比我请兼职配音便宜。\n\n一条 3 分钟解说的完整跑法是：稿子按情绪单元分段、段首写标签、合成后先只听断句，第二遍再调情绪。ElevenLabs中文配音 我固定用 Creator 套餐，10 万字符能做一百多条，够一个月的短视频。批量生产时把标签和正文分开存在表格里，换项目只改正文，标签复用。这套 ElevenLabs 中文 配音 情感 流程跑完，一条 3 分钟解说 25 分钟出音，返工最多的还是数字读法。\n\n## 两个坑是标签和授权\n\n第一个坑，标签写成中文、或者写在句子中间，模型会把它念出来，甚至用奇怪的语气读完整段。标签只能放在段首单独一行，并且用英文。第二个坑是声音克隆：克隆别人音色要拿到本人书面授权，平台会要求录制声明句；影视角色、明星的声线别碰，商用出问题不是删视频能解决的。\n\n另外提醒一句，导出前把每句开头的气口听一遍，标签切换处最容易多出半秒空白，剪辑时要手动收掉。\n\n## 总结\n\nElevenLabs 中文 配音 情感 的核心是分段，不是堆标签：先按情绪切段，再动 stability 和 style，最后才用 v3 标签修饰。ElevenLabs情感标签 我固定只留四种，多了反而乱。这套稿子模板现在做一条 3 分钟解说，从写稿到出音 25 分钟，返工率比之前低很多。","path":"articles/video/05-elevenlabs-chinese-emotion.md"},{"id":"video-06-suno-v5-chinese-lyrics","title":"Suno v5 中文 歌词 结构：副歌别超四句","category":"video","keywords":["Suno v5 中文 歌词 结构","Suno v5","歌词标签"],"longtail":["Suno中文歌词结构","Suno v5歌词标签"],"tags":["Suno","中文歌词","编曲"],"content":"给一个国风茶饮号做 60 秒卡点 demo，我用 Suno v5 中文 歌词 结构 跑了六版，前四版都死在副歌：唱到第三句开始赶拍，最后一句直接吞掉。第五版把副歌压到四句、每行控制在 9 个字，一次就过。中文歌词跟英文不一样，字数本身就是节奏。\n\n## 先用结构标签搭骨架\n\nSuno 认的是方括号英文标签：Intro、Verse 1、Pre-Chorus、Chorus、Bridge、Outro，每个标签单独占一行，标签之间空一行再写歌词。骨架我固定成：Intro 一句、Verse 1 四行、Pre-Chorus 两行、Chorus 四行、Verse 2 四行、Chorus 四行、Outro 一句。结构对了，模型才知道哪一段该重复。\n\nSuno中文歌词结构 最容易被忽略的是副歌重复：Suno 不会自动重复副歌，第二遍要把歌词原样再贴一次，只靠一个 Chorus 标签，出来的第二段经常是新旋律。v5 单曲能到 8 分钟，但中文短视频卡点我压在 90 秒内，前奏超过 8 秒完播率就掉。\n\n## 中文行数和字数决定唱不唱得下\n\n中文一个字一个音节，一行 12 个字塞进四拍里，必赶。我的标准是主歌每行 8 到 11 字、副歌 7 到 9 字，行尾押同一个韵母，ian、an、ang 混押也能听。韵脚统一以后，Suno v5歌词标签 里的 Chorus 记得加一句 high energy 之类的描述，情绪会更集中。\n\n具体步骤：先写副歌四行定韵脚，再往前补主歌，最后才加标签；不要先想编曲。生成后点开歌词对齐看哪一行被压缩，被吞的那行砍两个字重跑，比整首重写省积分。Pro 套餐 10 美元一个月，一首歌 10 积分左右，我一般留 5 次修改额度。\n\n我存了两套模板：一套 8 秒前奏加 16 小节主歌的流行结构，一套 4 小节循环的古风结构。做卡点视频时把 Chorus 放到第 18 秒，正好卡在第一个转场；做完整单曲就按主歌两遍、副歌三遍排。Suno中文歌词结构 先在纸上标好行数和韵脚再进 Suno，能省一半积分，副歌重复段落还要把歌词复制一遍，标签只写一次模型不会自动重唱。Suno v5 中文 歌词 结构 不对，音色再好也救不回来，所以我宁愿多花十分钟算字数。\n\n## 两个坑是中文标签和超长歌词\n\n第一，标签别写成中文：【主歌】【副歌】这种写法 Suno 不认，会被当成歌词念出来，一段说唱就毁了。第二，歌词框有字符上限，中文长歌词很容易贴满，我的经验是单首歌词控制在 500 字以内，超了就删掉 Bridge 或者砍掉第二遍主歌，别硬塞。\n\n还有个细节：标点别用全角省略号，模型会把省略号读成停顿，节奏直接拖垮。\n\n## 总结\n\nSuno v5 中文 歌词 结构 是给旋律画格子：标签定段落、字数定拍子、韵脚定记忆点。Suno v5歌词标签 我只用七个，中文歌词一行不超过 11 字，副歌绝对不超过四句。这套写法跑国风、流行都能用，60 秒卡点 demo 现在两版内定稿，不用再拿整首重抽。","path":"articles/video/06-suno-v5-chinese-lyrics.md"},{"id":"video-07-udio-mix-export","title":"Udio 混音 导出：先看清下载权限再动手","category":"video","keywords":["Udio 混音 导出","Udio","分轨导出"],"longtail":["Udio分轨导出","Udio混音响度"],"tags":["Udio","混音","导出"],"content":"2025 年 10 月 Udio 跟唱片公司和解之后，下载和分轨导出被官方收紧过一阵，我账号里的 WAV 按钮灰了整整两周。所以现在讲 Udio 混音 导出，第一步不是打开 DAW，而是先确认你手里的套餐到底给不给下载。这篇按我目前能跑通的流程写。\n\n## 段落拼接决定混音的底子\n\nUdio 一次生成 32 秒，一首完整的歌要靠 Extend 一段段接。我的接法是：主歌 32 秒、副歌 32 秒、再来一段尾奏，接缝放在鼓点第二拍之后，留 2 拍空白，回 DAW 里用 riser 或者一记军鼓盖过去，听不出断点。拼接前先把每段的音量对齐，Udio 不同段落电平能差 3 到 4 dB，不先归一化，后面压缩会很难受。\n\n套餐上，Standard 是 10 美元一个月 2400 积分，Pro 是 30 美元 6000 积分，积分按次扣，我一般先跑鼓和和声，副歌留到状态最好那几条里挑。\n\n## 回 DAW 做三件事\n\n第一件是分轨。如果你的套餐开放 Udio分轨导出，优先拿鼓、贝斯、人声四条；拿不到就只能在 Udio 里做段落音量，把混响重、人声远的段落替换掉。第二件是侧链：底鼓一起来贝斯就压 2 到 3 dB，AI 生成的贝斯通常太满，不压会糊成一团。第三件是响度：短视频平台按 -14 LUFS 拉平，我把总线做到 -14 LUFS、峰值 -1 dBTP，导出时按 WAV 44.1kHz、24bit 存一份母版。\n\nUdio混音响度 这块别信耳朵，挂一个响度表，同一批素材九条里有七条原始响度在 -9 到 -11 LUFS，直接上传会被平台压得更扁。\n\n真正跑一遍大概是：32 秒主段加 32 秒尾奏，接缝放在第二拍后面，拼完先归一化到 -14 LUFS，再进 DAW 挂侧链，贝斯压 3 dB，最后导 WAV。Udio混音响度 一定要看表，我这条原始是 -10.5 LUFS，压到 -14 以后人声靠前了很多。这套 Udio 混音 导出 流程跑顺以后，30 秒片头 50 分钟出片；Udio分轨导出 拿到的鼓轨如果偏后，往前推 3 毫秒就齐。只有 MP3 的时候先降噪再压响度，不然底噪会被一起抬起来，导出前把段落间的电平差抹平，后面能少返工。\n\n## 两个坑是权限和相位\n\n第一个坑是权限：Udio 现在的下载、Stems 开关跟着套餐和账号状态走，很多人以为买了 Pro 就能导，结果按钮是灰的。导出前先点一下，别等混完才发现拿不到文件。第二个坑是分轨相位，AI 分出来的底鼓和贝斯有时差 5 到 10 毫秒，叠起来低频会虚，回 DAW 里把底鼓往前挪 3 毫秒基本能对齐。\n\n商用素材还要看授权范围，AI 生成的旋律被平台判定相似的情况不少，发布前过一遍版权检测比事后申诉省事。\n\n## 总结\n\nUdio 混音 导出 的顺序是：先确认下载权限，再谈段落拼接和响度。Udio分轨导出 能开就用，开不了就用 Udio 里的段落编辑凑，回 DAW 补侧链和响度。这套流程现在做一条 30 秒播客片头，从生成到出母版 50 分钟，接缝处不仔细听已经听不出来。","path":"articles/video/07-udio-mix-export.md"},{"id":"video-08-capcut-auto-caption-calibration","title":"剪映 自动字幕 校准：识别完先做这三步","category":"video","keywords":["剪映 自动字幕 校准","剪映专业版","字幕时间轴"],"longtail":["剪映自动字幕断句","剪映字幕时间轴"],"tags":["剪映","自动字幕","字幕校准"],"content":"一条 5 分钟的口播，剪映自动识别出 42 条字幕，错别字 11 处、断句 5 处不对、整体还比语音早了半拍。手动一句句改要半小时，按下面的顺序校正，10 分钟能收工。这篇讲剪映 自动字幕 校准 的三步，全是界面里能点到的东西。\n\n## 先批量替换，再逐句听\n\n识别完先别动时间轴，打开字幕列表，把固定错词一次性换掉。中文口播里最常见的错法是同音字：然后识别成然和、账号识别成帐号、黏成粘。用查找替换把 6 到 8 个高频词处理完，剩下再逐句听。数字和英文单独处理：2026 写成二零二六，AI 写成 A I 会被拆成两个字母，直接整条改成中文。\n\n剪映自动字幕断句 的默认逻辑是按语音停顿切行，一句话说快了就断在词中间。我一般把每行压到 14 个字以内，遇到把的你、了吗切到行首的情况，手动合并再重切。这一遍只改文字，不碰时间。\n\n## 时间轴按帧微调\n\n文字全部干净以后，再校时间。剪映字幕时间轴的偏移是整条一起动的，选中全部字幕块，用左右方向键整体提前 0.05 秒，也就是两三帧，嘴和字基本就同步了。个别句还要单独拉：气口长的地方把字幕块尾部缩 2 帧，观众不会觉得跳。\n\n导出前检查三处：片头第一句、每段转场后的第一句、片尾最后一句。这三处最容易出现字幕压着转场走。\n\n口播里的错词很集中：然后、就是、这个、账号几类占一半以上。我建了一张自己的替换表，把然后改成接着、就是直接删、账号统一写法，识别完套表跑一遍，42 条字幕里能修掉 8 条。字幕时间轴 是最后一步，先改字再动时间，顺序反了等于白调。剪映 自动字幕 校准 做多了会发现，真正花时间的不是改字，是判断哪句该删：重复语气词删掉，字幕条数能少三成，观众反而更顺。导出前记得关掉旧字幕轨，避免双轨重叠。\n\n## 两个坑是名额和断行\n\n第一个坑，剪映专业版的自动字幕不是无限用的，我这边每月只有 1 次免费识别机会，超出要开 SVIP，连续包年 499 元。所以长视频别拿来试，先剪 30 秒样片确认识别质量。第二个坑，长句自动断行会把词切断，尤其是四字词，断在中间观众读着别扭，宁可缩短整句。\n\n另外中英混读的段落，识别结果经常把英文单词拆成字母，这种句子直接整条替换成中文更省时间。\n\n## 总结\n\n剪映 自动字幕 校准 的正确顺序是：批量替换错词、重排断句、最后整体偏移时间轴。剪映自动字幕断句 和 剪映字幕时间轴 这两步分开做，比一边改字一边拖时间快一倍。现在 5 分钟口播从识别到出片，我固定 10 分钟收工。","path":"articles/video/08-capcut-auto-caption-calibration.md"},{"id":"video-09-descript-text-editing","title":"Descript 文本剪辑：删一个词画面短三帧","category":"video","keywords":["Descript 文本剪辑","Studio Sound","转录校对"],"longtail":["文本剪辑删口癖","Descript转录校对"],"tags":["Descript","文本剪辑","播客"],"content":"40 分钟的访谈录完，我第一件事不是听音频，是把文件拖进 Descript 转成文字。删掉 2100 个字的废话之后，成片 18 分钟，画面跟着文字一起被剪短了。这就是 Descript 文本剪辑 有意思的地方：你改的是文档，动的是时间线。这篇讲我固定用的删法和两个必须避开的坑。\n\n## 先删口癖，再删内容\n\n导入后选中文转录，等它跑完，先开填充词删除：嗯、啊、那个、就是说这类会被自动标灰。机器删不准的地方手动补，我一般按“语气词、重复句、跑题段”三轮删，第一轮就能砍掉 15% 的时长。删的时候留意段落之间的气口，连续删句会黏在一起，每段结尾留 0.3 秒静音，听着才自然。\n\n文本剪辑删口癖 的关键是别一次删太狠。我有一次把受访者一句“其实吧”删了，他后半句的因果关系就没了，观众听着莫名其妙。现在遇到拿不准的语气词先留着，整片听一遍再决定。\n\n## 参数、字幕和导出\n\nDescript 的转录额度按套餐走：Hobbyist 每月 10 小时，Creator 30 小时，不够可以 2 美元一小时加购。中文片子的转录质量一般，Descript转录校对 我一般放在剪辑前做完，边剪边校对容易漏。Studio Sound 对人声降噪很有效，但音乐和环境声重的素材别开，会把人声修得发闷。\n\n这套 Descript 文本剪辑 流程里，导出是最后一步，前面对了后面才顺。导出前确认三件事：1080p 还是 4K、字幕要不要烧进画面、水印和片尾。4K 导出在低套餐里有限制，我一般先导 1080p 给客户看，定稿再换 4K。\n\n上个月一条 38 分钟的产品访谈，转录出来 9600 字，三轮删完剩 5200 字，成片 21 分钟。Descript 的时间线跟着文字走，删掉一句，视频轨道自动收 1.5 秒左右，所以删之前先把 B-roll 和字幕轨锁上，不然字幕会跟着一起被切。批量处理我会用搜索框输入语气词逐个跳转，比在时间线上拖快很多，也更容易判断哪句该留。\n\n## 两个坑是误删和标点\n\n第一个坑，文字删了画面就没了，补 B-roll 要提前规划。删掉 20 秒的跑题段，画面会突然跳，这时候得在时间线上插一段产品镜头或者空镜。第二个坑，中文全角标点和半角标点混用，搜索替换会失效，转录出来的逗号有时全角有时半角，批量替换前先统一。\n\n另外，Descript 的撤销是全局的，删多了按一次能回来，但连续操作十几次之后容易乱，我的习惯是每剪 5 分钟存一个版本。Descript转录校对 这步别省，省下来的时间会在返工时加倍还回去。\n\n## 总结\n\nDescript 文本剪辑 的爽点是把剪辑变成改稿：删字、删句、删段，时间线自己收。文本剪辑删口癖 三轮删完，40 分钟素材能压到 20 分钟以内，画面和声音不会不同步。我现在的流程是转录、删口癖、校对标点、Studio Sound、导出 1080p，一条访谈 3 小时收工。","path":"articles/video/09-descript-text-editing.md"},{"id":"video-10-tencent-zhiying-broadcast","title":"腾讯智影 播报：标点换成换行语气立刻顺","category":"video","keywords":["腾讯智影 播报","数字人播报","智影会员"],"longtail":["智影播报稿排版","腾讯智影数字人"],"tags":["腾讯智影","数字人播报","口播"],"content":"给一家做工业设备的企业写周报视频，90 秒的稿子，老板只提了一个要求：别像念文件。我用腾讯智影 播报 试了两版，同一个数字人、同一个音色，第一版整段贴进去念得像通知，第二版把长句拆行、标点换掉，语气立刻活了。差别全在稿子的排版。\n\n## 一行一句，标点当停顿用\n\n数字人播报的停顿只认标点，不认空格。我的排版规则是：一行一句，每行不超过 20 个字；逗号换半拍，句号换整拍，想强调的句子单独成行。稿子里“本周完成三条产线巡检”这种长句，拆成“本周完成三条产线巡检。发现问题两处。”念出来就有人味了。\n\n智影播报稿排版 还有一个细节：英文缩写和型号要改成中文读法，AGV 小车念成 A G V 小车会很生硬，写成自动导引车；数字写成中文，2026 年写成二零二六年。这些改法不用重新生成，改完文本再合成一次即可。\n\n## 参数、时长和价格\n\n免费账号每天大约有 5 分钟生成时长，导出 720P 带平台水印；要无水印 1080P 就得开会员，我开的是 99 元一个月的档位。数字人播报时长按会员档位算，高级数字人会员每月 20 分钟，专业会员 60 分钟；企业周报一周一条 90 秒的片子，一个月 6 分钟，免费额度其实够用。\n\n界面里选形象、选音色、贴稿子、合成，四步就能出一版。数字人的手势可以关，播报类视频我建议关掉，手势太密反而像客服机器人。腾讯智影数字人 我常用办公室背景那一套，绿色背景抠像边缘会有毛边，导出前放大看一眼头发丝。\n\n合成前先导 15 秒样片试听，听停顿和重音，不对就改文本再合成，别整段重跑。腾讯智影数字人 的节奏跟稿子绑得很死，稿子顺了，点头和表情也更自然。公司内部周报我用免费额度，对外宣传片才开会员导 1080P。腾讯智影 播报 的稿子我一般提前一天排好，第二天合成，避免临时改字改出多音字错误。\n\n## 两个坑是水印和多音字\n\n第一个坑，免费版 720P 带水印，客户看到水印会以为没做完；对外的片子直接开会员导 1080P。第二个坑，多音字，银行念成银航、重要念成重（chong）要，合成前把多音字词替换掉，或者在稿子里换个说法，比事后返工快。\n\n另外单条播报有字数限制，长稿拆成两段生成再拼，接缝处补一个空镜，不然能听出两段音色有细微差别。\n\n## 总结\n\n腾讯智影 播报 的核心不是数字人，是稿子：一行一句、标点控停顿、缩写和数字按读法改写。智影播报稿排版 花 10 分钟，成片能省 3 次返工。这套流程现在做 90 秒企业周报，从写稿到导出 40 分钟，老板终于没再说过像念文件。","path":"articles/video/10-tencent-zhiying-broadcast.md"},{"id":"video-11-whisper-local-transcription-accuracy","title":"Whisper 本地 转写 准确率：四个开关","category":"video","keywords":["Whisper 本地 转写 准确率","faster-whisper","large-v3"],"longtail":["Whisper本地转写","Whisper准确率优化"],"tags":["Whisper","语音转写","WER"],"content":"8 小时的访谈录音，我用 faster-whisper 的 large-v3 在本地转，第一遍 WER 测出来 13%，改完四个参数之后压到 8%，标点也正常了。Whisper 本地 转写 准确率 这件事，模型选对只占一半，另一半在解码参数和 VAD 上。这篇把我测过的数字摊开讲。\n\n## 环境和模型先固定\n\n显卡 3060 12GB，faster-whisper 用 int8 量化，large-v3 模型只吃 4.5GB 显存，一小时音频 4 分钟转完；不量化的话显存要 10GB 左右，速度慢一倍。模型文件 2.9GB，下载放本地目录，断网也能跑，这点比在线转写省心。\n\n第一版用的是默认参数，中文输出没有标点，人名全错，WER 13%。这属于正常水平，中文视频场景本来就比朗读难，多人抢话、电话录音还会更高。\n\n选模型也有经验：中文内容优先 large-v3，别用 large-v3-turbo，turbo 快三倍但中文 WER 会高 2 到 3 个百分点，访谈类素材不划算。转写前先把音频转成 16kHz 单声道 wav，用 ffmpeg 一条命令就能转，采样率不对也会掉准确率。\n\n## 四个开关\n\n一是 language 写死 zh，别让它自动检测，自动检测会把夹英文的段落判成日语。二是 vad_filter 开 True，并把 min_silence_duration_ms 调到 500，不然一段话中间换气就被切成两句。三是 initial_prompt 只放 20 个字以内的热词，比如人名、产品名，写太长模型会反复念提示词。四是 condition_on_previous_text 设 False，长音频里它能减少越错越离谱的连锁。\n\nbeam_size 我给 5，再高收益不明显。Whisper本地转写 跑完先看 srt 的时间轴，超过 15 秒一句的要手动切，播放器会跟不上。Whisper准确率优化 我还做过一组对照：同一段 10 分钟音频，繁体输出的 WER 比简体高 1 个百分点，所以输出后统一转简体再校对。\n\n批量跑的时候我会写个小脚本遍历目录，输出同名 srt 和 txt 两份，txt 统一转简体再交给编辑。Whisper 本地 转写 准确率 的提升有一半来自前期音频处理，噪声大的素材先过一遍降噪再喂模型，比反复调参数有效。\n\n## 两个坑是 VAD 和幻觉\n\n第一个坑，VAD 切得太狠会把句首的“那”、句尾的“吧”削掉，听起来像吞字，min_silence 别低于 300 毫秒。第二个坑，静音段落容易触发幻觉，模型会自己编一句“请订阅频道”，长音频里必须过滤掉。\n\n校对时我把 WER 高的段落单独标出来重听，问题一般集中在电话录音和多人抢话的地方。热词表建议每个月维护一次，新项目的人名、型号变化很快。\n\n最后提醒一句，8 小时音频别一次性喂进去，切成 30 分钟一段跑，内存和显存都稳，哪段出错也好重跑。\n\n## 总结\n\nWhisper 本地 转写 准确率 不是玄学：模型、量化、VAD、热词四件事定完，中文日常对话能稳定在 8% 左右。Whisper本地转写 加 Whisper准确率优化 这套组合，8 小时访谈一晚上能出初稿。剩下的错字还得人过一遍，机器到 8% 基本就到头了。","path":"articles/video/11-whisper-local-transcription-accuracy.md"},{"id":"video-12-topaz-video-restoration","title":"Topaz 视频 修复：先降噪再补帧最后放大","category":"video","keywords":["Topaz 视频 修复","Topaz Video AI","补帧放大"],"longtail":["Topaz视频修复顺序","Topaz补帧参数"],"tags":["Topaz","视频修复","补帧"],"content":"手里有一批 2008 年的 DV 素材，720×576、25 帧，客户要求放到 1080p 展板上循环播。直接放大最省事，也最容易翻车：噪点被一起放大，人脸像糊了一层砂纸。Topaz 视频 修复 的正确顺序是先降噪、再补帧、最后放大，这篇讲每一步的具体参数和耗时。\n\n## 第一步降噪和去隔行\n\nDV 素材是隔行的，先跑一遍去隔行，不然补帧会把交错的横纹当成运动。降噪模型用 Iris，强度别拉满，我一般放在 40 到 50；拉满会把皮肤纹理磨掉，人脸变塑料。这一步输出用 ProRes 或者高码率 H.265，别直接压 MP4，后面还要二次处理。\n\n旧素材常见的抖动和色偏也在这步处理，稳定器开到轻度就够，开重了画面边缘会被拉扯变形。\n\n素材如果有严重的色彩断层，先在第一步确认走 SDR 还是 HDR，别为了 HDR 标签硬转，转完肤色会偏。每步输出文件名带版本号，V1 去隔行、V2 补帧、V3 放大，客户要回退随时能找到。\n\n## 第二步补帧，第三步放大\n\n补帧用 Apollo，25 帧补到 50 帧，慢动作镜头才有细节；运动幅度大的镜头换成 Chronos，光流更稳。补帧完成再放大，模型选 Proteus，先 2 倍放到 1440×1152 再裁到 1080p，比一步放 4 倍干净。\n\nTopaz视频修复顺序 反过来就翻车：先放大再补帧，光流会拿噪点当运动点，画面边缘出现果冻感。Topaz补帧参数 我固定两个：补帧前把输出帧率锁在源素材的整数倍，放大时降噪强度比第一步低 10 个点。\n\n补帧参数里还有个容易忽略的选项：保留原始帧，勾上之后不会出现整段画面都像重新画过的塑料感。\n\n## 参数、耗时和价格\n\n软件现在改成订阅制，2025 年 10 月之前还能 299 美元买断，之后只能按年订阅。3060 跑 6 分钟 576p 素材放大加补帧，大约 40 分钟出一条；显存 8GB 起步，4K 输出建议 12GB 以上。输出选 H.265、码率 20Mbps 左右，展板播放够用，文件也不会太夸张。\n\n## 两个坑是电影感和过度修复\n\n第一个坑，24 帧的电影感补到 60 帧会变肥皂剧，剧情片慎用高帧率，纪录片和监控素材才适合补帧。第二个坑，AI 修复会把人脸修得比原片年轻，客户可能不认，修复前先出 10 秒样片给对方确认。\n\n另外带 Logo 和字幕的素材，放大后边缘会发虚，字幕建议重新压一层，别让模型去猜字。\n\nTopaz补帧参数 改完先跑 10 秒样片再批量，Topaz 视频 修复 跑批时建议关掉预览，预览也吃显存，一边预览一边渲染速度会掉两成。\n\n## 总结\n\nTopaz 视频 修复 的顺序比参数重要：去隔行降噪、补帧、放大，三步分开跑，中间存 ProRes。Topaz视频修复顺序 记住“先干净、后流畅、再清晰”，6 分钟 DV 素材 40 分钟能出 1080p。这套流程做老素材翻新，返工率比一步放大低很多。","path":"articles/video/12-topaz-video-restoration.md"},{"id":"video-13-jimeng-video-extend","title":"即梦 视频 延长：每次续 5 秒接缝别超一帧","category":"video","keywords":["即梦 视频 延长","即梦AI","视频延长"],"longtail":["即梦视频延长衔接","即梦延长积分"],"tags":["即梦","视频延长","分镜"],"content":"一条 15 秒的产品片，拍完发现结尾少了个举杯动作，重搭场景要两天。我用即梦 视频 延长 在原来的 10 秒片段后面续了 5 秒，导出后跟实拍素材混剪，客户没看出哪段是生成的。这篇讲清楚延长入口在哪、每次续多少、接缝怎么藏，以及积分怎么算。\n\n## 先存末帧，再谈延长\n\n即梦的视频单次生成 5 秒或 10 秒，分辨率 480p、720p、1080p 三档，24 帧。延长不是把提示词再写一遍，而是让模型顺着上一段的最后一帧往下接。所以第一段生成完，我第一件事是把最后一帧截图存下来，作为下一段的首帧图上传；直接在时间线上点续写，衣服颜色和光线经常对不上。\n\n每次延长 5 秒，一条链最多续 3 次，10 秒的首段能拉到 25 秒左右。我的习惯是每次只续一个动作：举杯、转身、放下杯子，动作越少接缝越稳。提示词写承接关系，比如承接上一段，人物继续抬右手把杯子送到嘴边，别写新场景、新角色。\n\n## 接缝的检查方法\n\n接缝最怕的是第一帧和上一段的最后一帧不是同一张图。我的做法是把上一段导出的末帧和当前段第 1 帧并排放，逐帧比对，差半格距离就重生成，别指望剪辑能盖住。即梦视频延长衔接 做得干净，成片基本看不出拼接点。\n\n积分要算清楚：5 秒 720p 一条大概 20 积分，1080p 翻倍，每天签到 60 积分，会员 69 元一个月送 1080 积分。即梦延长积分 按段扣，第三次延长失败积分照扣，所以我先在 480p 上试接缝，动作对得上再切 1080p 重跑。即梦AI 的会员积分到账是即时的，月初跑量大也不怕断。\n\n上周那条举杯动作，第一版我直接点续写没换首帧，接缝处袖口颜色从深灰跳成浅灰，重跑时把末帧截图传上去就顺了。这套即梦 视频 延长 的流程我现在固定三步：存末帧、传首帧、写承接动作。\n\n## 两个坑是劣化和失败\n\n第一个坑，连续延长三次画面会变糊、色彩漂移，第三次尤其明显，人脸噪点一眼能看出来；我的上限是两次，第三次宁可重新生成一段再剪。第二个坑，积分扣了任务却失败，网络卡的时候会这样，重试前先刷新任务列表，别连着点三次。\n\n还有一个实际限制：延长不能改分辨率，480p 续出来的段变不了 1080p，试错要在低分辨率档做完，定稿再从头跑一条 1080p 的。\n\n## 总结\n\n即梦 视频 延长 的关键是控制变量：末帧当首帧、一次一个动作、最多续两次、低分辨率试错。即梦视频延长衔接 我固定用截图比对，接缝藏不住就重来，不硬剪。即梦延长积分 一个月下来大概 500 到 700，会员额度基本够用。","path":"articles/video/13-jimeng-video-extend.md"},{"id":"video-14-luma-ray2-physics","title":"Luma Ray2 物理 效果：机位锁死加慢动作","category":"video","keywords":["Luma Ray2 物理 效果","Ray2","物理效果"],"longtail":["Ray2物理效果","Luma物理提示词"],"tags":["Luma","Ray2","物理效果"],"content":"客户要一条咖啡倒进杯子的特写，实拍得借高速摄影机，我用 Luma Ray2 物理 效果 跑了三版定稿。第一版液体像果冻，第二版杯口穿模，第三版把机位锁死、动作放慢、提示词只写材质和受力，质感立刻对了。物理类镜头，模型怕的不是复杂，是镜头乱动。\n\n## 物理效果靠首帧和受力描述\n\nRay2 原生 5 秒、10 秒，1080p，24 帧，擅长的物理是布料、液体、碰撞这类受力关系明确的东西，前提是画面里只有一个主运动。提示词我固定三段：主体和材质（陶瓷杯、深烘咖啡液）、受力和方向（液体沿杯壁旋转、泡沫浮起）、环境静止（桌布不动、背景虚化）。\n\n首帧用静态图：一张咖啡杯摆在桌上的照片，比纯文字开场稳得多，杯子的位置、桌布的褶皱、光位都已经定好，模型只需要往画面里加运动，穿模概率低一截。Ray2物理效果 好不好，七成看首帧信息量。\n\n## 固定机位加慢动作\n\n拍物理镜头我从不加运镜。dolly in、orbit 这些词一进去，模型会把注意力分给镜头，液体和杯壁的接触面就开始崩。固定机位加 slow motion 的描述，出来的画面反而有高速摄影的质感。\n\n时长上 5 秒比 10 秒稳，10 秒到后半段液面容易静止甚至倒流。真需要长镜头就用两段 5 秒接，接缝放在液体落下的那一帧。Luma物理提示词 里我常写 high-speed camera、slow motion、120fps look，但一句话只写一个，写多了画质会糊。\n\n上周那条咖啡镜头，第二版杯口穿模，原因是首帧里杯子和桌沿贴得太近，模型算不清边界，重拍一张杯子离桌沿两指宽的照片就过了。Luma物理提示词 里我现在只留三种描述：材质、受力方向、时间放慢，其他全删。复现这类 Luma Ray2 物理 效果 时，首帧拍摄距离别超过半米，太远了细节算不出来。\n\n## 价格和两个坑\n\nDream Machine 的 Lite 套餐 9.99 美元一个月送 3200 积分，Ray2 一条 5 秒 1080p 大约 100 积分，一个月能出 30 条左右，够一个小账号试错；积分不够可以 4 美元买 1200 积分。\n\n第一个坑，物理词堆太多会穿模，我写过液体飞溅、泡沫喷出、杯盖弹开，杯子直接消失，一句话只写一个物理事件。第二个坑，手部接触面，倒咖啡的手出镜时手指和杯柄经常长在一起，能不要手就不要手，或者让手停在画面边缘。商用授权也确认一下，AI 画面用在品牌广告里，素材来源说明和平台条款都要看一眼。\n\n## 总结\n\nLuma Ray2 物理 效果 的稳定公式：静态首帧、固定机位、慢动作、单个物理事件。Ray2物理效果 好不好，看受力关系写得够不够具体，不是词多不多。这套流程做饮品、布料类产品镜头，5 秒一条，试错成本比实拍低得多。","path":"articles/video/14-luma-ray2-physics.md"},{"id":"video-15-iflytek-multi-role-dubbing","title":"讯飞 配音 多角色：每句标好角色名再合成","category":"video","keywords":["讯飞 配音 多角色","讯飞配音","多角色配音"],"longtail":["讯飞多角色配音","讯飞配音发音人"],"tags":["讯飞","配音","多角色"],"content":"8 分钟的儿童故事，6 个角色，以前得找三个人分角色念。现在用讯飞 配音 多角色 功能，一个下午出完整音频，旁白、妈妈、小狐狸、老树的音色全不一样。难点不在音色库，在稿子怎么排：一句一个角色，标错一行，整段就得重配。\n\n## 稿子按角色分块\n\n我的稿子格式是角色名加冒号加台词，一行一句，角色切换就换行。多角色配音 功能支持给每段单独指定发音人，段落切得越干净，合成越不容易串音。旁白用中年男声，妈妈用温柔女声，小狐狸用偏高音的童声，语速分别 0.9、1.0、0.95，靠语速也能区分角色。\n\n讯飞配音发音人 库里同性别音色有几十个，别挑太像的；两个角色音色接近，听众分不清谁在说话，故事就乱了。8 分钟故事大概 2600 字，单条合成上限 1 万字符，一条就能跑完，不用分段。\n\n## 停顿和情感参数\n\n多角色对话最容易被听出来的是间隔。我在每句后面留一个空行，或者用 500 毫秒的停顿标记，对话才不像抢话。情感选项里旁白选平静、小狐狸选活泼，但情感和语速叠加容易吞字，语速超过 1.1 倍时把情感调回中档。\n\n多音字还是老问题：行长、重要、着火，合成前搜一遍，换成不会读错的写法。讯飞多角色配音 我一般先合 3 句试听，确认音色和间隔再整篇跑，不然改一个字就要重导整段。\n\n上次 8 分钟故事合成到第 5 分钟，老树的音色突然变了，原因是我中途改了一句台词又重选了一次发音人。现在我会在开始前把 6 个角色的音色和语速写成表格，讯飞 配音 多角色 的合成页面对照表格填，改稿只改台词不碰设置，讯飞配音发音人 选定后整篇都不动。\n\n## 价格和两个坑\n\n配音会员 45 元一个月起，每天最多导出 80 条合成配音，单次 1 万字符，做量大的项目把导出拆到几天，别堆在一天。\n\n第一个坑，角色音色太接近。我第一版让旁白和妈妈都用了温柔女声，试听时自己都混了，换成一个偏低的女声立刻解决。第二个坑，商用授权：免费音色和会员音色的授权范围不一样，品牌片要看清条款，别把个人练习的配置直接用到商单。导出格式选 WAV，回剪辑软件再做降噪和背景音乐，MP3 二次压缩会损失高频。\n\n## 总结\n\n讯飞 配音 多角色 的效率来自稿子整齐：角色名标清楚、一行一句、音色拉开距离。讯飞多角色配音 做对话前先试 3 句，能省掉整篇返工。这套流程现在 8 分钟故事 3 小时出片，比找真人分角色录音快一天。","path":"articles/video/15-iflytek-multi-role-dubbing.md"},{"id":"write-01-xiaohongshu-viral-title-prompts","title":"小红书 爆款标题 提示词：3 个模板让点击翻倍","category":"write","keywords":["小红书爆款标题提示词","小红书标题怎么写","爆款标题公式"],"longtail":["爆款标题提示词模板","小红书标题字数限制"],"tags":["小红书运营","标题技巧","AI提示词"],"content":"上周帮一个做家居收纳的账号改标题，同一组封面、同一批素材，只把\"我的收纳日常\"换成\"6 ㎡厨房塞下 87 件东西，我只动了 1 个抽屉\"，24 小时曝光从 3200 涨到 1.8 万。平台规则摆在那儿：小红书标题字数限制就是 20 个汉字，改的不是文笔，是这 20 个字里放什么。我把这套小红书爆款标题提示词拆成三段交给模型，人工只做筛选，标题返工时间从 40 分钟压到 10 分钟。模型负责产量，人负责判断哪条像人话。\n\n## 一、先给模型三组骨架\n\n写小红书爆款标题提示词，我固定只用三段，这三段就是我的爆款标题提示词模板。第一段交代身份和读者：\"你是家居类博主，读者是租房女性，标题限 20 个汉字\"。第二段给骨架：数字加痛点加结果、反常识加验证、人群加场景加具体物。第三段是硬约束：\"禁止使用最、第一、绝对、天花板，禁止 emoji，输出 15 条并标注汉字数\"。第一次我只写\"帮我写标题\"，出来的全是\"让生活更美好\"这类空话；补上这三段后，15 条里能留下 3 条。模板里那条\"标注汉字数\"特别有用，模型自己会删形容词凑字数。这三组骨架凑起来，就是可复用的爆款标题公式，换行业也能套。\n\n## 二、20 字上限，前 12 个字定生死\n\n小红书标题到 20 个汉字就截断，信息流里先露出的部分更短，所以核心信息必须往前压。我的改稿顺序是：关键词放前 6 个字，数字第二，情绪词最后。上周那组标题里，收纳打头的 5 条平均点击率 8.2%，把\"救命\"放最前面的 4 条只有 3.1%。经常有人问小红书标题怎么写，我的回答是先把小红书标题字数限制当设计约束，而不是写完再删。第一个坑是 emoji 和话题标签往标题里塞，既占字数又像堆砌；第二个坑是标题里的数字写成\"好几件\"，读者没感觉，搜索也抓不到。\n\n## 三、提示词要带反向示例\n\n只给好例子，模型会越写越像；我每轮都补 3 条\"别写成这样\"：别写\"分享一个好东西\"，别写\"姐妹们冲\"，别写\"今天又是美好的一天\"。加了反向示例，15 条里能用的从 2 条涨到 6 条。另一个动作是让它输出表格：序号、标题、汉字数、埋入的关键词，四列摆出来，超 20 字的直接删，再对照爆款标题公式看哪条骨架跑偏。这套爆款标题提示词模板我连用了两个月，现在写一篇笔记的标题环节不超过 10 分钟。\n\n## 总结\n\n这套小红书爆款标题提示词真正有用的地方，是把平台的字数限制和违禁规则写进指令，让模型在边界内出活。先锁 20 字，再锁关键词位置，最后用反向示例压掉 AI 味。有人问小红书标题怎么写，我的顺序也一样：先字数，再信息，最后才是情绪。标题只是入口，封面和正文还得自己判断，别指望一次生成就直接发。","path":"articles/write/01-xiaohongshu-viral-title-prompts.md"},{"id":"write-02-wechat-longform-outline","title":"公众号 长文 大纲 生成：先定 3 个钩子再动笔","category":"write","keywords":["公众号长文大纲生成","公众号长文大纲","长文大纲模板"],"longtail":["公众号文章大纲怎么写","公众号长文结构"],"tags":["公众号写作","内容大纲","长文技巧"],"content":"给一个做职业教育的公众号写稿，我第一版大纲列了 5 个并列观点，发出去完读率只有 32%，后台数据里三分之一的读者读到 800 字左右就走了。后来把大纲改成\"痛点、认知、方法、案例、行动\"五段，每段只留一个钩子，同一篇改完重发，完读率 51%。公众号长文大纲生成这事，难点不在列点，在排序：先让读者疼，再给他方法。\n\n## 一、先定 3 个钩子，再让模型铺大纲\n\n我现在打开对话框第一句不是\"帮我写大纲\"，而是\"读者是工作 3 年的运营，最近汇报总被老板打断，写出他愿意读完的 3 个钩子\"。钩子定下来，大纲才有骨头。拿到 3 个钩子后挑一个当开头，另外两个分别放在第二、第三个小标题。公众号文章大纲怎么写，本质是让模型先做取舍而不是先做填充。我的长文大纲模板固定五段：钩子、原因、方法、案例、行动，每段先写 2 个要点，总字数按 3000 字倒推分配。公众号长文大纲生成最难的一步就是这里，段与段之间必须有递进，不能并排站着。\n\n## 二、字数限制先记住：标题 64 字、摘要 120 字\n\n公众号标题上限 64 个字，订阅号一天只能群发 1 次，摘要超过 120 字会被截。这三个数决定了大纲的写法：标题里埋主关键词，摘要里复述钩子，正文第一屏必须接住标题给出的承诺。长文大纲模板里，第一段标题就要回答\"读者为什么现在读\"。上一版标题我写的是\"关于职场汇报的一些思考\"，64 字没用满，但也没人点；改成\"汇报被打断 3 次后，我总结出 1 个 30 秒公式\"，点开率从 2.1% 涨到 4.6%。第一个坑是标题堆关键词，读者一眼看出是凑的；第二个坑是摘要写\"本文将介绍\"，把有限的 120 字浪费在废话上。\n\n## 三、用大纲反查 AI 味\n\n模型给的小标题最容易露馅：全是四字对仗，\"认知升级\"\"方法落地\"\"案例复盘\"排成一排。我的做法是让它同时输出两版小标题，一版四字，一版口语，最后混着用。公众号长文结构里，口语小标题反而更耐读，因为读者是滑手机不是看论文。第三个坑是大纲每段字数平均：3000 字文章按 5 段分，理论上每段 600 字，实际钩子段 200 字就够，方法和案例各 1000 字才撑得住。公众号长文结构里，最贵的不是字数，是段与段之间的推进。这版公众号长文大纲生成流程我用了半年，废稿率从三成降到一成，改稿次数从平均 4 轮降到 2 轮。\n\n## 总结\n\n大纲生成不是让模型替你思考，是把你脑子里的顺序外化出来。先定 3 个钩子，再按字数限制分配段落，最后用案例把方法落地。公众号文章大纲怎么写，先问自己读者此刻在焦虑什么。公众号长文大纲写得越具体，正文写得越快，改稿越少。","path":"articles/write/02-wechat-longform-outline.md"},{"id":"write-03-zhihu-answer-structure","title":"知乎 回答 结构 模板：开头 3 行决定能不能爆","category":"write","keywords":["知乎回答结构模板","知乎回答结构","回答结构模板"],"longtail":["知乎回答被折叠","知乎回答开头技巧"],"tags":["知乎运营","回答结构","内容模板"],"content":"知乎上一个\"要不要辞职考研\"的问题下面，我用两个账号各发了一版回答。A 版按老习惯写\"谢邀，先说下我的背景\"，首屏 3 行全是自我介绍；B 版第一行直接给结论\"先别辞，算完这 3 笔账再决定\"。48 小时后 A 版 37 赞，B 版 420 赞。同一套知乎回答结构模板，差的只是把结论提到了前 3 行。这套知乎回答结构模板后来被我做成清单，每条回答发布前过一遍。\n\n## 一、结论放首屏 3 行，后面再讲道理\n\n知乎回答页在手机上只露出开头 3 行左右，用户滑到你这篇，先看到的不是全文，是这 3 行。所以我的模板第一句永远是结论，第二句给适用人群，第三句给本文能解决什么。知乎回答怎么写，我总结成一句话：把最反直觉的判断放在读者还没决定划走的那个位置。中间主体按\"3 个论据、每个 200 到 300 字\"铺，每个论据配一个小标题，写完一个论据就回扣一次结论。结尾不总结全文，只给一个具体动作，比如\"今晚先做这件事\"。\n\n## 二、别碰折叠线：答非所问、广告、站外引流\n\n知乎回答被折叠的判定很直接：答非所问、没有实质内容、广告、诱导互动、把站外联系方式放正文。我见过最可惜的是把公众号文章整段搬过来，结尾放一句\"完整版在主页\"，回答当天就进折叠区，连搜索都搜不到。最怕的就是知乎回答被折叠，展开率一掉，回答等于没发。第一个坑是开头写\"感谢邀请\"加一段个人履历，占掉最贵的 3 行；第二个坑是在回答里放二维码或者微信号，被判定站外引流后，账号权重会掉一截。知乎回答格式上还有个小细节：小标题用加粗而不是项目符号，移动端项目符号会缩进，一屏只剩两行字，阅读体验很差。知乎回答格式里还有一个隐形规则：首屏别放长段引用。\n\n## 三、排序机制决定你什么时候发\n\n知乎回答的排序不是按发布时间，而是按赞同、收藏、评论、专业度的加权，再加上时间衰减。同样质量的回答，发在问题刚出的 2 小时内，比发在问题沉了半个月后，曝光能差 5 倍以上。我现在选题先看问题关注数和最近 24 小时的回答增量，增量小于 5 条才值得写。知乎回答开头技巧说穿了就两步：前 3 行给判断，第 4 行给理由。第三个坑是回答写完不回头改，其实发出去的前 30 分钟如果没进推荐，补一张信息图或者改一版开头，数据会重新起来。知乎回答开头技巧不是话术，是判断顺序。\n\n## 总结\n\n知乎回答结构模板可以背，但别背成八股。结论先行、3 个论据、正文不引流、发在问题热的时候，这四条做到，一篇回答的赞数下限就有了。剩下的，交给选题。","path":"articles/write/03-zhihu-answer-structure.md"},{"id":"write-04-short-video-voiceover-rhythm","title":"短视频 口播稿 节奏：60 秒卡 4 个停顿点","category":"write","keywords":["短视频口播稿节奏","口播稿怎么写","口播稿字数"],"longtail":["口播稿节奏技巧","口播稿怎么控节奏"],"tags":["短视频文案","口播技巧","完播率"],"content":"一条 60 秒口播视频，我第一版写完 480 字，录出来像开会念材料，完播率 18%，平均播放 12 秒。把稿子压到 260 字、标出 4 个停顿点之后，同样的镜头和灯光，完播率 31%，平均播放 26 秒。短视频口播稿节奏不是玄学，是字数和停顿的数学题。口播稿不是写给人看的，是写给人念的。\n\n## 一、先算语速：60 秒最多 270 字\n\n中文口播的正常语速是每秒 4 到 4.5 个字，60 秒的理论上限就是 240 到 270 字。短视频口播稿节奏的第一步永远是减字，不是加词。超过 270 字，你要么吞字，要么像开了 1.5 倍速，观众听两遍才反应过来，完播率就掉。我现在写口播稿先定秒数，再乘 4 算字数上限，写完用朗读功能过一遍，时间超了先删形容词，再删铺垫句。口播稿字数怎么算，我的习惯是留 10% 的余量：60 秒按 240 字写，进棚再顺一遍。口播稿怎么写才不像念稿，关键是把书面语的长句拆成 8 到 12 个字一句，一句一个意思，读的时候才有地方换气。口播稿怎么写，先算秒数再动笔，比先写正文省一半时间。口播稿字数不是越多越好，是越准越好。\n\n## 二、4 个停顿点是节奏的骨架\n\n60 秒视频我固定安排 4 个停顿：第 3 秒钩子说完停一次，第 15 秒抛完痛点停一次，第 40 秒讲完第二个要点停一次，结尾行动指令前停一次。停顿不是空着，是配画面切换或字幕放大。口播稿节奏技巧里最容易被忽略的是\"重音位置\"：一句话只允许一个重音词，其余的字轻着读。我把稿子里的重音词全部加粗，录的时候只看加粗的部分，语速自然就稳了。口播稿节奏技巧不是快，是有呼吸。口播稿怎么控节奏，先在稿子上标停顿线。\n\n## 三、开头 3 秒别自我介绍\n\n短视频的推荐机制里，前 3 秒的留存直接决定这条视频能不能进下一个流量池。第一个坑是开头\"大家好，我是某某\"，观众根本不关心你是谁，关心的是你能帮他解决什么；第二个坑是第 5 秒才把画面切到重点，前 4 秒全在走路或者放空镜。我现在的开头模板只有三种：抛结论、给数字、制造反差，三选一，第一句不超过 15 个字。另外字幕别超过每行 12 个字，一行太长观众读字幕就顾不上听。这套短视频口播稿节奏我用了十几条视频，最明显的变化是录废率：以前一条要录 8 遍，现在 2 到 3 遍就能过。口播稿怎么控节奏，慢半拍比快半拍安全。\n\n## 总结\n\n口播稿的节奏不是天生的语感，是字数、停顿、重音三件事拼出来的。先把 60 秒的字数算准，再把 4 个停顿点标出来，最后删掉所有自我介绍式的开场。稿子对了，镜头前就轻松一半。","path":"articles/write/04-short-video-voiceover-rhythm.md"},{"id":"write-05-amazon-listing-bullet-points","title":"亚马逊 listing 五点描述：5 条真实痛点","category":"write","keywords":["亚马逊 listing 五点描述","亚马逊五点描述","Listing 五点描述"],"longtail":["亚马逊五点描述怎么写","亚马逊 listing 优化"],"tags":["亚马逊运营","Listing 文案","跨境电商"],"content":"去年帮一个做户外折叠桌的朋友改 listing，旧五点前三条是\"High quality material\"\"Easy to use\"\"Durable design\"，最后一条竟然写\"Fast shipping\"。改完之后同款产品转化率从 8% 提到 12%，广告 ACOS 降了 6 个点。亚马逊 listing 五点描述的差距，不在英文好不好，在有没有把参数、场景和痛点写成买家能验证的句子。\n\n## 一、先记住三个硬限制\n\n亚马逊标题要求 200 字符以内，前台展示往往只露出前 60 个字符；五点描述 3 到 5 条，每条上限 500 字符，实际建议 150 到 200 字符；后台 Search Terms 只有 250 字节，塞不下多少词。这三个数字决定了写法：核心卖点必须放第一条，因为手机端每条只显示前两行，大约 80 个字符。亚马逊五点描述怎么写，我的顺序是先把类目 review 里的差评翻 20 条，把买家抱怨的词直接变成每条开头的短语。第一个坑是把五点当关键词仓库，每条塞五六个词根，读起来像机器；第二个坑是写\"100% satisfaction guaranteed\"这类保证性承诺，审核会拦，还容易招来恶意退货。亚马逊五点描述怎么写，顺序上先解决差评里出现最多的抱怨，再谈参数。\n\n## 二、每条按\"场景、参数、结果\"写\n\n我改后的第一条是\"Folds in 3 seconds, fits a 28cm backpack side pocket\"，第二条写承重\"holds up to 30kg, tested 5000 times\"。买家不关心\"friendly design\"，关心的是能不能塞进背包、会不会塌。五点的分配也有讲究：第一条解决最大痛点，第二条给硬参数，第三条讲使用场景，第四条写售后和配件清单，第五条放差异化的细节。Listing 五点描述里最能提转化的是具体数字，比如\"3 秒收纳\"\"28cm\"\"30kg\"\"5000 次测试\"，这些数字在评论和 QA 里都能被验证。Listing 五点描述的第二条最适合放认证和材质，买家翻到第二条时还在比较。亚马逊 listing 优化做到最后，拼的就是谁更敢写具体。\n\n## 三、五点写完还要过三道检查\n\n第一道查违规词：free shipping、sale、best seller、FDA approved、eco-friendly 这类词别碰，没有认证的环保和医疗表述会被下架。第二道查重复：同一个词根在五条里出现超过 3 次就删，亚马逊 listing 五点描述的权重不吃堆砌，吃相关性。第三道用手机看：把 listing 页面截图缩小到手机宽度，每条只能看到前 80 个字符，如果利益点没出现在那里，等于白写。第三个坑是五点里放特殊符号和对勾，部分类目会触发审核，稳妥起见用纯文本。亚马逊 listing 优化不是改一次就结束，我每 30 天按广告搜索词报告补一轮词。\n\n## 总结\n\n五点描述是买家在列表页里唯一会逐行读的文案。先记住 500 字符和 80 字符这两个数，再按场景、参数、结果写，最后过违规词和手机端两道检查。五条写满、每条 200 字符上下，比一条 500 字符的长段落好读。亚马逊 listing 五点描述写好了，广告费都省一截。","path":"articles/write/05-amazon-listing-bullet-points.md"},{"id":"write-06-xiaohongshu-seeding-note-banned-words","title":"小红书 种草笔记 违禁词：3 类词发之前必查","category":"write","keywords":["小红书种草笔记违禁词","小红书违禁词","种草笔记违禁词"],"longtail":["违禁词检测","小红书笔记限流"],"tags":["小红书运营","违禁词","笔记限流"],"content":"一条讲面膜的笔记，标题写\"最便宜的美白面膜，7 天白一个度\"，发出去 6 小时曝光只有 200，点开还提示内容仅自己可见。把\"最便宜\"\"美白\"\"7 天白一个度\"全部换掉，改成\"熬夜脸急救记录，14 天素颜对比\"，同账号同封面，曝光 1.2 万，收藏 300。小红书种草笔记违禁词不是吓唬人的清单，是实打实决定笔记生死的东西。\n\n## 一、三类词发之前必须过一遍\n\n第一类是极限词：最、第一、顶级、国家级、绝对、天花板，这类词在广告法里本来就不能用于宣传，小红书审核直接命中。第二类是功效和医疗词：美白、祛斑、祛痘、消炎、治疗、药效，化妆品功效宣称需要备案和特证，普通种草笔记写死功效词，轻则限流重则删除。第三类是诱导和交易词：评论区扣 1、点赞抽奖、私信领资料、加微信、代购、全网最低，这些词会被判定站外引流或诱导互动。小红书违禁词检测我一般用两个工具交叉查，零克查词和句易网，查完再人工读一遍，因为工具词库更新永远慢半拍。这类小红书违禁词清单每周在变，别背死的。\n\n## 二、机器怎么识别你的\"聪明替换\"\n\n有人把\"最\"写成\"蕞\"，把\"美白\"写成\"米白\"，或者用拼音、拆字、emoji 代替，以为能绕过去。小红书的审核模型对谐音、拼音、变体字的识别已经很成熟，标题 20 个字、正文 1000 个字的空间里，替换痕迹反而更显眼。种草笔记违禁词真正难处理的是功效表述，我的做法是不承诺结果，只写过程：\"我用了 14 天，第 7 天开始觉得上妆不卡粉\"，记录比承诺安全。第一个坑是只在标题里删词，正文和话题标签还留着原词；第二个坑是把违禁词写在图片里，图片上的文字同样会被识别。\n\n## 三、限流之后先别急着删笔记\n\n小红书笔记限流的典型信号是：发布 2 小时后曝光停在几百、搜索标题搜不到、薯条投不出去。先别删，去创作中心看有没有违规提示，没有提示的限流多半是内容质量分不够，封面、标题、正文前三行重新改一版，24 小时内还有机会拉回来。第三个坑是频繁删笔记重发，账号会被判定内容不稳定，新笔记的初始流量池更小。小红书笔记限流还有个诱因是频繁改标题。数据两天不动，就再做一次小红书违禁词检测。小红书种草笔记违禁词查得越细，发布后的返工越少，我现在写一条笔记，查词环节固定花 5 分钟。\n\n## 总结\n\n发小红书之前，把极限词、功效词、诱导词三类各过一遍，能查工具就查工具，查不到就自己念一遍。笔记被限流先看提示、再改内容，别急着重发。动笔前，小红书种草笔记违禁词先默一遍，比出事再补划算。","path":"articles/write/06-xiaohongshu-seeding-note-banned-words.md"},{"id":"write-07-resume-keyword-optimization","title":"简历 优化 关键词：3 处改动让邀约翻倍","category":"write","keywords":["简历优化关键词","简历关键词","简历优化"],"longtail":["简历关键词怎么提取","ATS 简历筛选"],"tags":["简历优化","求职技巧","ATS"],"content":"上个月帮一个做新媒体运营的朋友改简历，她投了 27 家只收到 3 个面试邀约。我没动排版，只改了三处关键词：把\"负责公众号运营\"换成岗位 JD 里的原词，把粉丝数、打开率、转化单量补进去，把\"熟练使用办公软件\"删掉。改完投 12 家，收到 9 个邀约。简历优化关键词这事，本质是让机器和人都能在 7 秒内找到匹配的证据。\n\n## 一、先从 JD 里抄词，别自己发明\n\n招聘系统筛简历的第一步是关键词匹配，HR 平均看一份简历只有 7 秒，机器更快。我的做法是把目标岗位 JD 复制到文档里，统计\"任职要求\"和\"岗位职责\"里出现 2 次以上的名词，这些就是简历关键词。比如 JD 写\"社群运营、用户增长、活动策划、数据复盘\"，简历里就别只写\"新媒体运营\"。同义词也要覆盖：用户运营和社群运营、内容策划和选题策划，各写一次。简历关键词怎么提取，我一般先看 JD 里反复出现的动词和工具名，再按重要性分到简历的四个区块：个人总结、工作经历、项目经历、技能栏。\n\n## 二、每个关键词后面必须跟数字\n\n光有关键词不够，得有证据。简历关键词怎么提取，先穷举再排序：把 JD 里 12 到 15 个词按出现频次排一遍。我的模板是\"动词、对象、数字、结果\"：独立运营 2 个公众号，6 个月涨粉 3.2 万，打开率从 4.1% 提到 6.8%，带动课程咨询 210 单。同一段经历，改前是\"负责公众号日常运营，提升粉丝活跃度\"，改后 HR 一眼能看到量级。简历优化关键词的正确用法是\"关键词加量化结果\"，而不是把词堆在技能栏。第一个坑是简历底部列 50 个关键词，ATS 简历筛选会判定为堆砌，人工看也像凑数；第二个坑是只写职责不写结果，10 份简历里有 8 份都写\"负责\"，没有一份写\"做到\"。\n\n## 三、格式别拖关键词的后腿\n\n招聘系统解析简历时，图片、表格、分栏、页眉页脚里的文字经常丢失，很多人把联系方式放在页眉，机器直接读不到。稳妥的做法是单栏、纯文本、PDF 导出，文件名写\"姓名、岗位、年限\"，比如\"张琳-新媒体运营-3 年.pdf\"。ATS 简历筛选对字体不敏感，对文本框敏感，内容别塞进文本框。一页纸足够，工作 5 年以内别写两页。第三个坑是拿一份简历投所有岗位，关键词匹配度从 80% 掉到 40%，我现在的习惯是按岗位建三个版本，只改个人总结和技能栏。简历优化做到最后你会发现，改的不是文笔，是匹配度。\n\n## 总结\n\n简历优化关键词的顺序是：抄 JD、配数字、改格式。12 个关键词、每段经历两个数字、单栏 PDF，这三件事做完，面试邀约率通常能翻一倍。剩下的，交给面试。","path":"articles/write/07-resume-keyword-optimization.md"},{"id":"write-08-business-email-english-polish","title":"商务邮件 英文 润色：3 步去掉中式客套","category":"write","keywords":["商务邮件英文润色","英文商务邮件","邮件润色"],"longtail":["商务邮件英文模板","英文邮件怎么写得体"],"tags":["商务英语","邮件写作","职场沟通"],"content":"给德国客户回过一封邮件，原文是\"Dear Sir, I am writing to inform you that we have finished the report. Please kindly find the attached file and give me your opinion as soon as possible. Thanks.\"。87 个词，对方三天没回。改成\"Hi David, Attached is the Q3 report. Could you share feedback by Friday, Jan 9? Thanks, Li\"，21 个词，当天下午就回了。他后来回信说，之前的邮件看不出要我做什么。商务邮件英文润色的第一步不是换高级词，是把句子砍短。\n\n## 一、先砍三个中式客套\n\n\"Please kindly\"\"I am writing to inform you\"\"We are looking forward to your reply\"，这三句几乎每封中式商务邮件都有，母语者读起来像模板。我的润色规则：please 一封邮件最多用一次，kindly 直接删，inform 换成 tell 或者直接把附件贴出来。商务邮件英文润色时，我让模型只做三件事：删客套、拆长句、把被动改主动。比如\"The report has been completed by our team\"改成\"We finished the report\"，前者 9 个词，后者 4 个词，意思一样。商务邮件英文润色做到最后，删掉的字比换掉的词多。改完一封 120 词的邮件通常剩 70 词，信息量没少，读起来顺了。\n\n## 二、主题行 50 字符，正文 5 句内\n\n商务邮件的主题行建议控制在 50 个字符以内，手机端只显示前 35 到 40 个字符，所以动作和对象要放最前面：\"Action needed: Q3 budget by Jan 9\"比\"Regarding the Q3 budget discussion\"清楚。主题行动词开头最省事：Send、Review、Confirm、Approve，四个词够用。正文我按 5 句模板写：一句背景、一句请求、一句截止时间、一句附件说明、一句感谢，总词数压到 120 词以内。时间写全：Jan 9, 2026 比 1 月 9 日清楚，跨时区再补一句 CET。英文商务邮件里最贵的资源是对方的注意力，不是你的礼貌。第一个坑是每封邮件都用\"I hope this email finds you well\"开场，第二封开始就没人看；第二个坑是\"ASAP\"三个字母，在跨文化沟通里等于催命，写具体日期更专业。\n\n## 三、润色提示词要给约束，不是给形容词\n\n我现在给模型的指令是：\"收件人是德国客户，关系一般，目的要 Q3 报告反馈，截止 1 月 9 日，语气直接但不失礼，全文不超过 120 词，禁用 kindly、hereby、pursuant to，输出主题行和正文。\"约束越具体，改出来的越像人写的。商务邮件英文模板可以套，但别整段复制，换一个客户就露馅。第三个坑是过度润色成莎士比亚腔，商务邮件的目标是让对方 30 秒内知道你要什么，不是展示词汇量。邮件润色最容易漏的是附件，正文没提附件，收件人常常找不到。英文邮件怎么写得体，我最后只看两点：对方读完知不知道下一步做什么，以及这封邮件还能不能再删一句。\n\n## 总结\n\n润色英文商务邮件，先删客套，再控长度，最后给明确动作。商务邮件英文模板不解决语气问题，邮件润色也不是把简单句子改复杂，是让每句话都有用。英文邮件怎么写得体，50 字符的主题行、120 词的正文、一个具体截止日期，比任何高级词汇都管用。邮件发出去之前，自己用手机读一遍，读不懂的地方就是该删的地方。","path":"articles/write/08-business-email-english-polish.md"},{"id":"write-09-novel-outline-character-card","title":"小说 大纲 人物卡：先写 7 个字段再开章","category":"write","keywords":["小说大纲人物卡","人物卡","小说大纲"],"longtail":["人物卡怎么写","小说大纲模板"],"tags":["网文写作","人物设定","小说大纲"],"content":"写到第 18 章时，我给女主加了一场深夜急诊戏，写到一半才发现她明明设定是怕黑的，整场戏把人设写崩了。回去翻人物卡，上面只写了\"林晚，28 岁，急诊科护士，性格坚强\"，恐惧、秘密、口头禅全是空的。后来把小说大纲人物卡补成 7 个字段，大纲按人物动机重排，那本书从 3 万字弃坑到顺利签约番茄。签约编辑说，问题不在文笔，在人物动机不够具体。\n\n## 一、人物卡只写 7 个字段\n\n我的小说大纲人物卡固定 7 栏：姓名年龄身份、核心欲望、最怕的事、一个秘密、口头禅或小动作、成长弧光、关键关系。每栏只写 1 到 2 句，写多了就成简历。以林晚为例：欲望是证明自己不是靠关系进的医院，最怕黑，秘密是替弟弟顶过一次处分，口头禅是\"先量个血压再说\"，弧光是从证明自己到接受自己。人物卡怎么写才不空？每个字段都要能直接变成一场戏，比如怕黑对应第 6 章的停电夜班，顶处分对应第 22 章的家庭冲突。7 个字段里最重要的是欲望和恐惧，这两个决定人物在关键时刻怎么选。\n\n## 二、大纲按事件、冲突、转折写细纲\n\n平台签约的门槛先摆着：番茄大约 2 万字可以提交签约申请，起点要 4 到 5 万字，日更 4000 到 6000 字才撑得住推荐。所以大纲不能只写三幕，得拆到章。我的小说大纲模板是每章 3 行：这章发生什么事件、主角和谁冲突、结尾留什么转折。前 3 章是黄金三章，必须完成主角亮相、麻烦上门、第一个选择。重写时我把第 1 章从\"介绍医院日常\"改成\"停电夜班，林晚摸黑给病人扎针\"，追读率从 31% 涨到 47%。\n\n## 三、人物卡和大纲要互相校验\n\n写完 10 章回头对一次人物卡，看每个角色的行为有没有违背欲望和恐惧。我现在的习惯是每写完一卷，把主要人物的 7 个字段重读一遍，改大纲而不是改人设。第一个坑是人物卡写成外貌清单，身高血型星座写满一页，却没有一句写他想要什么；第二个坑是大纲细到每句话，写着写着就没劲，细纲到章就够。第三个坑是配角只有名字没有欲望，读者记不住，我现在给每个有名字的配角至少写一句\"他想要什么\"。小说大纲人物卡不是一次写完的，每卷结束补一次。人物卡怎么写，回看三句：他要什么、他怕什么、他瞒着什么。\n\n## 总结\n\n人物卡解决\"他为什么这么做\"，大纲解决\"接下来发生什么\"。7 个字段、每章 3 行、每 10 章校验一次，这套流程跑顺了，人设崩和卡文都会少很多。小说大纲模板不用照抄现成表格，字段顺序按自己的故事调。先写卡，再开章，顺序别反过来。","path":"articles/write/09-novel-outline-character-card.md"},{"id":"write-10-seo-article-keyword-layout","title":"SEO 文章 关键词布局：3 次出现就够用","category":"write","keywords":["SEO文章关键词布局","关键词布局","SEO文章"],"longtail":["关键词密度多少合适","长尾关键词布局"],"tags":["SEO写作","关键词优化","内容运营"],"content":"去年接手一个企业站的 SEO 文章，原文 1800 字里核心词出现了 12 次，读起来像复读机，排名停在第 3 页。把核心词压到 4 次、补了 3 个长尾词、重新排了 H2 之后，第 9 天升到首页第 8 位，自然流量从每天 40 涨到 260。SEO 文章关键词布局不是数次数，是把词放到搜索引擎和读者都会看的位置。位置做对了，同样的内容能被更多长尾搜索接住。\n\n## 一、先记住三个位置和两个数字\n\n标题标签控制在 30 个汉字以内，核心词放前 10 个字；meta description 约 78 个汉字，里面自然出现一次核心词；H1 全页只有一个，和标题不重复。关键词密度按百度搜索资源平台的建议控制在 2% 到 8%，我一般做到 3% 左右。首段 100 字内必须出现核心词，因为搜索引擎判断主题时第一段的权重最高。SEO 文章关键词布局的第一原则是位置优先于次数，次数只是结果。SEO 文章关键词布局按这个顺序排：标题、首段、H2、结尾，四个位置各出现一次，剩下的用同义词和长尾补。\n\n## 二、长尾词放 H2，一个 H2 一个意图\n\n核心词只有一两个，长尾词才是流量入口。我从百度下拉框和相关搜索里挑 3 到 5 个长尾，一个长尾对应一个 H2，每个 H2 下面写 200 到 300 字，长尾词在 H2 里出现一次、正文里再出现一到两次。关键词密度多少合适这个问题，我的经验是别超过 5%，超过之后读起来就不像人话。长尾关键词布局的关键是意图匹配：搜\"关键词密度多少合适\"的人要的是数字，不是概念，所以那一段第一句就得给 2% 到 8%。相关搜索里的长尾大多是一个完整问句，直接拿来当 H2 最省事。\n\n## 三、堆砌会触发算法，不是玄学\n\n百度有飓风算法专门打击采集和关键词堆砌，标题里塞五个词、正文每段开头重复核心词，都是典型特征。第一个坑是正文首段不出现关键词，算法和读者都抓不到主题；第二个坑是只做核心词不做长尾，核心词竞争大，新站半年未必排得上去。我现在的流程是写完先数：核心词 3 到 5 次、每个长尾 2 到 3 次、密度不超过 5%，超了就删。长尾关键词布局不要挤在一段里，一个 H2 接住一个意图。内链 2 到 3 条，锚文本用长尾词，别写\"点击这里\"。SEO 文章发出去之后，收录一般 1 到 7 天，这期间别频繁改标题，改一次等于重新提交。\n\n## 总结\n\n关键词布局的本质是分配注意力：标题给核心词，H2 给长尾，正文给解释。SEO 文章关键词布局做到最后，是让每段都有存在的理由。30 字标题、78 字描述、3% 密度，三个数记牢，比背一百条技巧有用。写完读一遍，像人话再发。","path":"articles/write/10-seo-article-keyword-layout.md"},{"id":"write-11-livestream-script-scripts","title":"直播 话术 脚本：5 分钟一个循环，重复 3 轮","category":"write","keywords":["直播话术脚本","直播话术","直播脚本"],"longtail":["直播话术模板","直播间违规词"],"tags":["直播运营","话术设计","带货技巧"],"content":"上个月陪一个卖保暖内衣的直播间改话术脚本。原来主播只有一句\"家人们，这个真的很好，买它\"，平均停留 45 秒，转化率 1.8%。改成 5 分钟一个循环、每轮按固定 5 段讲之后，同样 3 小时场观，平均停留 72 秒，转化率 3.2%。直播话术脚本不是让主播背台词，是把每一批新进来的观众都当成第一次听。\n\n## 一、5 分钟循环，因为流量是滚动的\n\n抖音直播的推荐是持续的，每隔几分钟就有一批新观众进来，你讲第二遍的时候，老观众可能刚走，新观众刚来。所以话术不能线性讲到底，要按 5 分钟一个循环重复。我的脚本分 5 段：0 到 30 秒留人，30 到 90 秒戳痛点，90 到 180 秒讲 3 个卖点，180 到 240 秒报价格锚点和库存，240 到 300 秒逼单加售后。为什么是 5 分钟而不是 3 分钟或 10 分钟？3 分钟讲不完整一个卖点，10 分钟老观众听腻，5 分钟刚好覆盖一批新流量。一场 3 小时的直播，这套循环大概跑 30 多轮，直播话术脚本里每轮只需要记住 5 个关键句。直播间人少的时候更要按脚本走，主播一自由发挥就容易冷场。\n\n## 二、开场 30 秒决定平台给不给你流量\n\n直播间推荐看三个数：平均停留时长、互动率、成交转化率。开场 30 秒留不住人，后面讲得再精彩也没用。我的开场固定三句话：一句身份、一句利益、一句指令，比如\"做了 8 年保暖内衣的工厂，今天这款比双 11 还便宜 20 块，扣 1 领券\"。直播话术模板里最没用的是\"欢迎新进来的宝宝\"，观众听不出任何信息。直播话术模板不要写成长篇台词，一页 5 行就够。价格锚点必须有真实依据：原价多少、现价多少、比哪个平台低多少，写清楚，别编，编出来的最低价一旦被举报就是虚假宣传。\n\n## 三、违规词和口播一致性是底线\n\n直播间违规词比图文更严：最、第一、全网最低、永远不会起球、治疗老寒腿，这些词出现在口播里，轻则限流重则封播。我的直播脚本每段结尾都标一行禁语，主播念稿前先看。我每月更新一次直播间违规词清单，按类目归类。每轮结尾留 10 秒回答公屏问题，互动率会好看很多。第一个坑是口播参数和商品详情页不一致，详情页写 320 克，口播说 400 克，会被判定虚假宣传；第二个坑是全程喊麦没有信息，停留时长会掉得很快。直播话术里现在还固定加一句\"不喜欢 7 天可退\"，这句比任何逼单话术都管用，也顺带把售后争议压下去。\n\n## 总结\n\n直播话术脚本的核心是节奏：5 分钟一个循环，30 秒留人，3 个卖点，1 个真实价格锚点。把违规词列成禁语清单，把参数和详情页对齐，剩下的交给主播的状态。脚本写细一点，主播就轻松一点，场观也稳一点。","path":"articles/write/11-livestream-script-scripts.md"},{"id":"write-12-government-document-format","title":"政府 公文 格式：22 行 28 字，错一处返工","category":"write","keywords":["政府公文格式","公文格式","党政机关公文格式"],"longtail":["公文格式标准","公文写作格式"],"tags":["公文写作","格式规范","体制内材料"],"content":"去年帮一个街道办改材料，一份《关于申请采购办公用品的报告》被退回来三次。第一次退回是因为文种错了，申请采购应当用请示；第二次是标题里写了\"请示报告\"，两个文种混用；第三次是页边距和字体不对。政府公文格式不是排版洁癖，是 GB/T 9704-2012 里一条条写死的规矩，错一处就得返工。\n\n## 一、页面和字体：22 行、28 字、3 号仿宋\n\n党政机关公文格式国家标准规定：版心 156 毫米乘 225 毫米，页边距上 37 毫米、下 35 毫米、左 28 毫米、右 26 毫米；正文用 3 号仿宋，每页 22 行、每行 28 个字；标题用 2 号小标宋；一级标题 3 号黑体，二级标题 3 号楷体，三级标题 3 号仿宋加粗。这些数字在 Word 的页面设置里能直接填，填完看行数和字数对不对。政府公文格式的检查顺序我一般是：先看文种，再看版式，最后看内容。标题回行也有讲究，词意要完整，不能把\"关于\"两个字落单在第二行。\n\n## 二、文种用错，内容再好也白搭\n\n法定公文有 15 种：决议、决定、命令、公报、公告、通告、意见、通知、通报、报告、请示、批复、议案、函、纪要。最容易混的是报告和请示：报告是汇报情况，不要求答复；请示是请求批准，必须一文一事，而且不能多头主送。那份采购申请写成\"报告\"，领导没法批，只能退回。公文格式标准里还有一条：请示不得夹带报告事项，报告里也不许夹带请示，两者混在一份文件里，收文单位会直接打回。公文写作格式练多了会发现，选对文种比写漂亮话重要得多。\n\n## 三、成文日期和版记是最容易扣分的地方\n\n成文日期用阿拉伯数字，标全年月日，右空 4 字；发文字号里的年份用六角括号；正文中的数字，计量和统计用阿拉伯数字，表述性文字用汉字。这些细节看着小，评审时一眼就能看出来。第一个坑是三级标题字体用错，一级黑体、二级楷体、三级仿宋加粗，很多人三级也用了黑体；第二个坑是附件说明写在正文里而不是版记位置，附件名称和正文里的括号说明对不上。版记里的抄送机关、印发机关和印发日期，各占一行，位置错了整页都要重排。对照公文格式标准逐项打勾，比凭记忆排版稳。公文写作格式是死功夫，排两三份就熟了。一份 2000 字的材料，格式熟了半小时能排完。\n\n## 总结\n\n政府公文格式就三件事：版式按国标填、文种按用途选、数字按规则写。党政机关公文格式的现行版本是 GB/T 9704-2012，网上模板鱼龙混杂，以国标为准。22 行 28 字、3 号仿宋、请示一文一事，记住这几条，至少不会被退稿。写完让同事按检查清单过一遍，比自查靠谱。","path":"articles/write/12-government-document-format.md"},{"id":"write-13-thesis-abstract-reduction","title":"论文 摘要 降重：先改 3 处，再查重复率","category":"write","keywords":["论文摘要降重","摘要降重","论文摘要"],"longtail":["论文摘要怎么写","知网查重摘要"],"tags":["毕业论文","摘要写作","查重降重"],"content":"硕士论文第一次查重，摘要重复率 38%，整段标红。我用一晚上做同义词替换，第二次降到 31%，但语句开始读不通。后来按\"目的、方法、结果、结论\"四要素逐句重写，只保留必须保留的术语，第三次重复率 9%，摘要还比原来短了 80 字。论文摘要降重不是换词游戏，是重新讲一遍你的研究。\n\n## 一、先拆四要素，再动笔\n\n中文摘要一般 300 到 500 字，学位论文多按这个区间，期刊论文 200 到 300 字，关键词 3 到 5 个。我把摘要拆成四块：研究目的、研究方法、结果、结论。四块各写 1 到 2 句，字数自然卡住。论文摘要降重的第一步不是开查重工具，是确认四要素齐不齐：缺结果、缺数据是重复率高的常见原因，因为空话最容易被别人写过。写完先读一遍，如果每句话都能套到另一篇论文上，那它大概率也会标红。论文摘要怎么写，先看学校模板给的字数区间，再定每块写几句。\n\n## 二、知网查重的真实规则\n\n知网的判定不是简单数\"连续 13 个字\"，那是民间总结，实际是滑动窗口加相似度阈值，语义高度相似的改写也可能标红。摘要、致谢都在查重范围内；参考文献列表本身不查，但正文引用格式识别不出来，引用内容就按正文算重复，这也是很多人重复率高的隐形原因。知网查重摘要的规则每年微调，别照着三年前的经验改。摘要降重时别动专业术语，\"显著性\"\"信度\"\"样本量\"换了反而不专业，要改的是句子结构和语序：主动改被动、长句拆短句、数据换一种呈现。论文摘要怎么写才稳：每个结论后面跟一个数字，数字对不上就改结论，而不是改数字。\n\n## 三、三个容易踩的坑\n\n第一个坑是机器降重，同义词乱换，把\"研究对象\"换成\"钻研对象\"，查重是降了，答辩时老师读不下去。第二个坑是摘要里\"本文\"出现五六次，中文摘要确实常用\"本文\"，但每句都\"本文\"显得空，换成\"研究\"\"实验\"更实。第三个坑是结论写得比数据大，摘要里写\"显著提升\"，正文只有 3 组样本，评审一眼看穿。摘要别写\"本文认为\"，结论用数据说话。重复率降到 10% 以下不是目标，语句通顺才是。知网查重摘要的结果在报告里单独列出，标红段落优先改句首和句尾，这两处最容易和原文撞车。改完的摘要控制在 400 字左右，四要素齐全，重复率通常能压到 15% 以下。\n\n## 总结\n\n论文摘要降重的顺序是拆要素、改结构、控术语、对数据。300 到 500 字、四要素齐全、结论有数字，重复率自然下来。改完自己读一遍，读不通就重写，别在病句上省时间，答辩时会被放大。","path":"articles/write/13-thesis-abstract-reduction.md"},{"id":"write-14-brand-slogan-generation","title":"品牌 slogan 生成：6 个字说清一个卖点","category":"write","keywords":["品牌slogan生成","slogan生成","品牌slogan"],"longtail":["品牌口号怎么写","slogan字数"],"tags":["品牌文案","slogan","广告法"],"content":"给一个做便携充电宝的品牌写 slogan，第一轮让模型出了 30 条，一半是\"品质生活，从心开始\"这种放哪个品类都成立的句子。最后定下的是\"6 小时快充，通勤不慌\"，8 个字。品牌 slogan 生成的难点不是想不出句子，是想不出能被记住、又能注册的句子。\n\n## 一、先给模型四个输入\n\n我的提示词固定四项：品牌定位（通勤场景的便携充电）、目标人群（一线城市上班族）、核心利益（快充、轻）、语气（直白不煽情）。再加三条禁令：不许用最、第一、极致等广告法禁用词，不许四字成语堆砌，每条不超过 12 个字。一次出 30 条，按\"能记住、能注册、能延展\"三个标准筛。品牌口号怎么写，先问品牌自己最想让用户记住哪一件事。提示词里加一句\"不超过 12 个字，每条只留一个动词\"，产出立刻不一样。slogan 生成最忌一上来就要\"有感觉的句子\"，没有定位的输入，模型只能给你形容词。\n\n## 二、6 到 12 个字，说清一个利益\n\n中文品牌口号的舒适区是 6 到 12 个字，超过 12 个字难记，低于 4 个字又容易空。广告法第九条明确禁止使用\"国家级\"\"最高级\"\"最佳\"这类用语，slogan 里出现极限词，投放和商标注册都过不去。我筛 slogan 时先问一句：这句话能不能对应一个具体利益？\"品质生活，从心开始\"对应不了任何东西，\"6 小时快充，通勤不慌\"能对应充电速度和场景。品牌 slogan 生成到这一步，30 条通常只剩 3 条。slogan 字数不是越短越好，\"充电快\"三个字谁都写过，加一个场景才有区分度。slogan 字数超了先删形容词，\"极致\"\"卓越\"删完通常还剩 8 个字。\n\n## 三、注册和延展性要一起看\n\nslogan 是要申请商标的，太通用、太描述性的句子缺乏显著性，容易被驳回；谐音梗又容易有歧义，注册时审查更严。我的做法是把候选句拆成两三个词组，先去商标网查近似，再看能不能延展成系列：一句 slogan 能不能拆出海报标题、详情页副标、客服话术。充电宝的商标要查第 9 类，广告语注册还要看第 35 类。品牌口号怎么写才不浪费预算：定下来至少用 2 到 3 年，频繁换等于每次重新教育用户。第一个坑是内部投票选\"最顺口\"的，顺口不等于能记住；第二个坑是 slogan 里塞两个以上卖点，用户一个都记不住。slogan 定稿前找 10 个目标用户读一遍，能复述的留下。\n\n## 总结\n\n品牌 slogan 生成的流程是：给定位、出 30 条、按三个标准筛、查商标、做延展测试。6 到 12 个字、一个利益、无极限词，四条底线守住，剩下的交给时间验证。定稿别急，放一周再回来看，还顺眼才是能用的那句。","path":"articles/write/14-brand-slogan-generation.md"}];

/* ---------------- 工具函数 ---------------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catName = id => (CATS.find(c => c.id === id) || {name:'未分类'}).name;
const LS = 'stellara_nav_articles_v1';

function customArticles(){
  try { const a = JSON.parse(localStorage.getItem(LS) || '[]'); return Array.isArray(a) ? a : []; } catch(e){ return []; }
}
function allArticles(){ return ARTICLES.concat(customArticles()); }

/* 极简 Markdown */
function md(src){
  let t = String(src || '').replace(/\r\n/g,'\n');
  const blocks = [];
  t = t.replace(/```([\s\S]*?)```/g, (_,c)=>{ blocks.push('<pre><code>'+esc(c.replace(/^\n|\n$/g,''))+'</code></pre>'); return '\u0000B'+(blocks.length-1)+'\u0000'; });
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = t.split('\n'), out = [];
  let para = [], list = null;
  const flushP = ()=>{ if(para.length){ out.push('<p>'+inline(para.join(' '))+'</p>'); para=[]; } };
  const flushL = ()=>{ if(list){ out.push('<'+list.tag+'>'+list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+'</'+list.tag+'>'); list=null; } };
  for (let i=0;i<lines.length;i++){
    const ln = lines[i];
    if (/^\u0000B\d+\u0000$/.test(ln.trim())) { flushP(); flushL(); out.push(blocks[+ln.trim().replace(/\u0000B|\u0000/g,'')]); continue; }
    if (!ln.trim()) { flushP(); flushL(); continue; }
    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushP(); flushL(); const lv=h[1].length===1?2:Math.min(4,h[1].length); out.push('<h'+lv+'>'+inline(h[2])+'</h'+lv+'>'); continue; }
    if (/^\s*[-*+]\s+/.test(ln)) { flushP(); if(!list||list.tag!=='ul'){flushL(); list={tag:'ul',items:[]};} list.items.push(ln.replace(/^\s*[-*+]\s+/,'')); continue; }
    if (/^\s*\d+\.\s+/.test(ln)) { flushP(); if(!list||list.tag!=='ol'){flushL(); list={tag:'ol',items:[]};} list.items.push(ln.replace(/^\s*\d+\.\s+/,'')); continue; }
    if (/^\s*>/.test(ln)) { flushP(); flushL(); out.push('<blockquote>'+inline(ln.replace(/^\s*>\s?/,''))+'</blockquote>'); continue; }
    para.push(ln.trim());
  }
  flushP(); flushL();
  return out.join('\n');
}

/* ---------------- 路由 ---------------- */
const state = {view:'tools', cat:'all', q:'', artCat:'all', artId:null};
function nav(){
  const items = [['tools','工具库'],['articles','教程文章'],['about','说明']];
  $('#nav').innerHTML = items.map(([k,n])=>`<button data-go="${k}" class="${state.view===k?'on':''}">${n}</button>`).join('');
}

function render(){
  nav();
  const app = $('#app');
  if (state.view === 'tools') app.innerHTML = viewTools();
  else if (state.view === 'articles') app.innerHTML = viewArticles();
  else if (state.view === 'article') app.innerHTML = viewArticle(state.artId);
  else app.innerHTML = viewAbout();
  window.scrollTo({top:0,behavior:'instant'});
}

/* ---------------- 工具库 ---------------- */
function viewTools(){
  const q = state.q.trim().toLowerCase();
  const list = TOOLS.filter(t => (state.cat==='all'||t.c===state.cat) &&
    (!q || (t.n+t.d).toLowerCase().includes(q)));
  const chips = [{id:'all',name:'全部'}].concat(CATS).map(c =>
    `<button class="chip ${state.cat===c.id?'on':''}" data-cat="${c.id}">${c.name}${c.id==='all'?' '+TOOLS.length:''}</button>`).join('');
  return `
  <section class="hero">
    <div class="eyebrow">AI TOOL DIRECTORY</div>
    <h1>把 <span>42 款 AI 工具</span>按真实用途摆好，<br>再配 100 篇能照着做的教程</h1>
    <p class="lead">不堆"大全"，只留实测过、愿意再打开的。每个分类 6 款，点开即用；每篇教程都带参数、步骤和踩过的坑。</p>
    <div class="stats">
      <div class="stat"><b>42</b>工具卡片</div>
      <div class="stat"><b>7</b>大分类</div>
      <div class="stat"><b>${allArticles().length}</b>篇教程</div>
      <div class="stat"><b>0</b>外部依赖</div>
    </div>
  </section>
  <div class="toolbar">
    ${chips}
    <label class="search">🔍<input id="q" placeholder="搜索工具名或用途…" value="${esc(state.q)}"></label>
  </div>
  <div class="grid">
    ${list.length ? list.map(t => `
      <a class="card" href="${esc(t.u)}" target="_blank" rel="noopener">
        <span class="tagline">${catName(t.c)}</span>
        <h3><i>${esc(t.n.slice(0,1))}</i>${esc(t.n)}</h3>
        <p>${esc(t.d)}</p>
        <span class="go">打开官网 →</span>
      </a>`).join('') : '<div class="empty">没有匹配的工具，换个关键词试试</div>'}
  </div>`;
}

/* ---------------- 文章列表 ---------------- */
function viewArticles(){
  const q = state.q.trim().toLowerCase();
  const arts = allArticles().filter(a => (state.artCat==='all'||a.category===state.artCat) &&
    (!q || (a.title + (a.keywords||[]).join(' ')).toLowerCase().includes(q)));
  const chips = [{id:'all',name:'全部'}].concat(CATS).map(c => {
    const n = allArticles().filter(a=>a.category===c.id).length;
    return `<button class="chip ${state.artCat===c.id?'on':''}" data-artcat="${c.id}">${c.name}${c.id==='all'?' '+allArticles().length:' '+n}</button>`;
  }).join('');
  return `
  <section class="hero">
    <div class="eyebrow">TUTORIALS · 100</div>
    <h1>100 篇<span>细分场景教程</span></h1>
    <p class="lead">每篇只解决一个具体问题：参数怎么填、哪一步会翻车、用什么数字验收。点开即读，无需登录。</p>
  </section>
  <div class="toolbar">
    ${chips}
    <label class="search">🔍<input id="q" placeholder="搜索标题或关键词…" value="${esc(state.q)}"></label>
    <button class="btn" id="btnImport">＋ 批量导入 Markdown</button>
  </div>
  <div class="panel import" id="importBox">
    <div class="hint" style="margin-bottom:10px">支持两种方式：① 直接粘贴多篇 Markdown（用 <code>---</code> 分隔，每篇带 frontmatter）；② 选择多个 .md 文件。文章保存在本机浏览器，不上传服务器。</div>
